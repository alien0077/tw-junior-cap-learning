  - 'transfer: 進入會考型新資料題'
  - 'exit-ticket: 一題理由題加一個自我診斷'
  visualizations:
  - number-model：以「N-7-3：負數與數的四則混合運算（含分數、小數）」作為唯一主題，至少同步呈現兩種表徵
  - 每次變更都保留因果可追溯的標記、圖例與文字替代
  interactiveBlocks:
  - id: CUR-MATH-CONTENT-N-7-3-I01
    component: NumberLineBlock
    purpose: 以運算樹分離乘除子運算與外層加減，再用帶號數線追蹤 −18.5→−23.5→−22.75，最後以共同分母回查；避免把「減去負數」誤成所有負號一起變正。
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        primary: 1
        secondary: 1
    studentActions:
    - 先預測最終結果的正負與量級，並指出第一個必須完成的乘法子運算
    - 完成 4×(−1.25)=−5 後，將外層式子保留成 −18.5+(−5)−(−0.75)
    - 在數線上觀察加 −5 向左、減去 −0.75 等價於加 +0.75 向右；只改變對應操作
    - 切換共同分母證據，核對 −74/4−20/4+3/4=−91/4，並遷移到 −6−2×(−3)+(−4)÷2
    visualRules:
    - 第一畫面顯示原式、運算優先層級與數線，答案及箭頭在預測前隱藏
    - 乘法結果先由運算節點產生，再投影成數線的 −5 位移；數線不得假裝直接表示乘法規則
    - −(−0.75) 只在最後一段標成 +0.75 向右移，不可讓其他負數同步變正
    - 小數結果與共同分母回查同時可讀；320/375/390/430px 仍保留完整運算樹、方向與終點標籤
    misconceptionChecks:
    - id: MC-CUR-MATH-CONTENT-N-7-3-I01
      trigger: 把 −(−0.75) 的雙負號規則套到整個式子，或忽略乘除優先順序直接由左至右結算
      prompt: 先圈出 4×(−1.25) 與 (−4)÷2 這類乘除子運算，再指出哪一個外層減號真的作用在負數上；用數線方向或共同分母作證。
      expectedEvidence: 乘法節點為 −5；數線由 −18.5 到 −23.5，再因 +0.75 到 −22.75；分數回查為 −91/4
    feedback:
      correct: 指出學生正確保留的帶號量與移動方向，再要求以共同分母或新式子完成第二種證據。
      incorrect: 先標出錯誤發生在運算順序或雙負號位置；只提示該節點，不重寫整題，重試後才揭示局部中間值。
