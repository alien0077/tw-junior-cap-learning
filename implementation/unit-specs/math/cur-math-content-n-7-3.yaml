  capTransfer:
    questionType: 帶號混合運算的運算順序、雙負號方向與估算回查
    stemConstraint: 計算 −6−2×(−3)+(−4)÷2，先寫兩個乘除子運算，再完成外層加減
    requiredResponse: 得到 −2；說明 −(−6) 變成 +6，而最後 (−4)÷2 仍是 −2
    scoring: 結果 1、運算節點與符號證據 1、估算或等值回查 1
  exitTicket:
    prompt: 化簡 −10+3×(−2)−(−4) 時，哪個部分先做？最後一次移動方向為何？
    successCriteria:
    - 先得到 3×(−2)=−6
    - −(−4)=+4，只改變最後一筆操作
    - 結果 −12，且能用數線或整數估算回查
  expressionExtension:
    applicable: false
    task: 用 80～120 字／英文短段落，將「N-7-3：負數與數的四則混合運算（含分數、小數）」的證據、因果或觀察說給同學聽
    constraint: 學生先寫；系統只給一階回饋，不直接代寫完整答案
  mobileA11y:
