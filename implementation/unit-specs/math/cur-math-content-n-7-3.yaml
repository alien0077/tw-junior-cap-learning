  testCases:
  - 載入「N-7-3：負數與數的四則混合運算（含分數、小數）」時不得先顯示正解；學生必須先提交對「N-7-3：負數與數的四則混合運算（含分數、小數）」的預測，且預測會被保留供後續比較。
  - 操作「number-model：以「N-7-3：負數與數的四則混合運算（含分數、小數）」作為唯一主題，至少同步呈現兩種表徵」中的主要變項後，與「表徵／證據與結論的對應」相關的圖、表、句構或因果鏈必須同步更新，文字狀態也要說明改變了什麼。
  - 學生觸發「把「N-7-3：負數與數的四則混合運算（含分數、小數）」當成可直接套公式的程序，忽略量與表徵的對應」時，系統必須命中本單元的 misconception
    check，要求學生指出可定位證據，並先給一階提示而非直接揭露答案。
  - 在 320px、375px 與 768px 寬度，以鍵盤完成「N-7-3：負數與數的四則混合運算（含分數、小數）」的預測—操作—觀察—解釋流程時，核心題幹、控制項、回饋與可讀狀態不得溢位或遺失。
  - 以新資料執行「N-7-3：負數與數的四則混合運算（含分數、小數）」的 CAP transfer：換一個情境但保留「N-7-3：負數與數的四則混合運算（含分數、小數）」的核心關係；不可只換名詞；學生回答必須選答後必須指出證據或推理步驟，評分同時檢查概念、證據對應與表達完整度。
  - 外部資料失效時，NumberLineBlock 仍須以「N-7-3：負數與數的四則混合運算（含分數、小數）」的文字與資料 fallback 完成預測、操作、觀察、解釋與 transfer，不得阻塞本課。
