  capTransfer:
    questionType: 盒狀圖端點改變與散布量判讀
    stemConstraint: 甲站Q1=22固定、Q3由26改為28；判斷IQR與中位數哪些必然改變
    requiredResponse: IQR由4變6；中位數24可保持不變；Q3改變的是盒子端而非最大值鬚端
    scoring: 端點角色1、IQR計算1、結論範圍1
  exitTicket:
    prompt: 若只把最大值由30改成35，而Q1=22、Q3=26不變，IQR與全距各如何？
    successCriteria:
    - IQR仍為4
    - 全距增加5
    - 說明最大值屬鬚端，不是IQR端點
  expressionExtension:
    applicable: false
    task: 用 80～120 字／英文短段落，將「D-9-1：統計數據的分布」的證據、因果或觀察說給同學聽
    constraint: 學生先寫；系統只給一階回饋，不直接代寫完整答案
  mobileA11y:
    breakpoints:
    - 320
    - 375
    - 390
    - 430
    - 768
    touchTargetMinPx: 44
    keyboardAlternative: true
    screenReader: 每個控制項有名稱、目前值、操作結果與錯誤回饋
    reducedMotion: 停用自動動畫仍可逐步操作
  testCases:
  - 載入「D-9-1：統計數據的分布」時不得先顯示正解；學生必須先提交對「D-9-1：統計數據的分布」的預測，且預測會被保留供後續比較。
  - 操作「data-explorer：以「D-9-1：統計數據的分布」作為唯一主題，至少同步呈現兩種表徵」中的主要變項後，與「表徵／證據與結論的對應」相關的圖、表、句構或因果鏈必須同步更新，文字狀態也要說明改變了什麼。
  - 學生觸發「把「D-9-1：統計數據的分布」當成可直接套公式的程序，忽略量與表徵的對應」時，系統必須命中本單元的 misconception check，要求學生指出可定位證據，並先給一階提示而非直接揭露答案。
  - 在 320px、375px 與 768px 寬度，以鍵盤完成「D-9-1：統計數據的分布」的預測—操作—觀察—解釋流程時，核心題幹、控制項、回饋與可讀狀態不得溢位或遺失。
  - 以新資料執行「D-9-1：統計數據的分布」的 CAP transfer：換一個情境但保留「D-9-1：統計數據的分布」的核心關係；不可只換名詞；學生回答必須選答後必須指出證據或推理步驟，評分同時檢查概念、證據對應與表達完整度。
  - 外部資料失效時，DataExplorerBlock 仍須以「D-9-1：統計數據的分布」的文字與資料 fallback 完成預測、操作、觀察、解釋與 transfer，不得阻塞本課。
