    currentEvidenceStatus: curriculum-and-kg-grounded; publisher-chapter-evidence-recorded; fusion-review-pending
  learningGoals:
  - 用多重表徵解釋「D-9-1：統計數據的分布」的關係，而非只背步驟
  - 由圖表或操作結果建立符號／數值表達
  - 將概念遷移到一題新情境並說明理由
  prerequisites:
  - 能讀懂本單元使用的基本符號、圖表或短文本
  - 能依提示完成一次預測、操作、觀察、解釋循環
  coreConcepts:
  - D-9-1：統計數據的分布
  - 表徵／證據與結論的對應
  - 錯誤答案所反映的概念差異
  misconceptions:
  - 把「D-9-1：統計數據的分布」當成可直接套公式的程序，忽略量與表徵的對應
  - 把記憶答案當成理解證據
  - 忽略題幹中的限制條件或單位
  contentFlow:
  - 'hook: 以單元真實問題引起預測'
  - 'activate-prerequisite: 顯示先備檢核並允許補救'
  - 'visualize: 用 data-explorer 建立可觀察表徵'
  - 'predict: 學生先提交預測且答案暫不揭露'
  - 'manipulate: 改變一個變項或標記一段證據'
  - 'observe: 同步更新圖、表、句構或因果鏈'
  - 'explain: 學生用一句話說明觀察到的關係'
  - 'formalize: 再顯示本單元正式語言與記法'
  - 'transfer: 進入會考型新資料題'
  - 'exit-ticket: 一題理由題加一個自我診斷'
  visualizations:
  - data-explorer：以「D-9-1：統計數據的分布」作為唯一主題，至少同步呈現兩種表徵
  - 每次變更都保留因果可追溯的標記、圖例與文字替代
  interactiveBlocks:
  - id: CUR-MATH-CONTENT-D-9-1-I01
    component: DataExplorerBlock
    purpose: 以兩座氣象站的五數摘要與盒狀圖同步比較中位數、全距與 IQR；一次只改最大值或Q3，辨認鬚與盒子各自承載的散布資訊。
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        primary: 1
        secondary: 1
    studentActions:
    - 先預測甲站最大值30→35時，右鬚、全距、IQR與中位數哪些會改變
    - 只拖曳最大值，觀察右鬚與全距同步，而Q1、Q3不動時盒寬與IQR保持
    - 再只拖曳Q3，觀察盒子右端與IQR改變，並比較中位數仍可固定
    - 用兩站全距與IQR寫有範圍界線的結論；遷移到新五數摘要，避免把IQR較小說成所有資料相同
    visualRules:
    - 兩站盒狀圖使用同一數軸，五數摘要、全距與IQR數值卡同步
    - 最大值控制只應移動鬚端；Q3控制只應移動盒子端並改IQR
    - 中位數、Q1、Q3、最小值、最大值皆以位置與文字標籤呈現，不靠顏色
    - 手機版兩站可改成垂直堆疊，但必須保持同一尺度與盒／鬚角色清楚
    misconceptionChecks:
    - id: MC-CUR-MATH-CONTENT-D-9-1-I01
      trigger: 最大值改變時誤判 IQR 必定改變，或把『IQR較小』解釋成所有觀測值都相同
      prompt: 指出你改動的是鬚端還是盒子端；分別計算最大−最小與Q3−Q1，再限定結論描述的是全部範圍或中間50%。
      expectedEvidence: 甲最大35時全距17、IQR仍4；乙全距9、IQR2；Q3改變才會直接改IQR
    feedback:
      correct: 指出盒狀圖上對應位置與數值差，並要求用『全部範圍／中間50%』精確表述。
      incorrect: 先標出誤用的是全距或IQR；提示對應端點後讓學生重算，不直接代寫播報句。
