  capTransfer:
    questionType: 一次函數參數與情境範圍判讀
    stemConstraint: 水箱 y=−7x+100；讀 x=2、5、8 的水量並說明負斜率與有效情境範圍
    requiredResponse: 說明斜率 −7 代表每單位時間減少7、截距100為初始量；負水量屬代數延伸但情境不允許
    scoring: 參數意義1、圖表證據1、情境範圍1
  exitTicket:
    prompt: y=8x+30 改成 y=8x+50 時，圖形哪個特徵不變？同一 x 的 y 改變多少？
    successCriteria:
    - 斜率仍為8，兩線平行
    - y 截距由30到50
    - 同一 x 的輸出都增加20
  expressionExtension:
    applicable: false
    task: 用 80～120 字／英文短段落，將「F-8-2：一次函數的圖形」的證據、因果或觀察說給同學聽
    constraint: 學生先寫；系統只給一階回饋，不直接代寫完整答案
  mobileA11y:
    breakpoints:
    - 320
    - 375
    - 390
    - 430
    - 768
    touchTargetMinPx: 44
    keyboardAlternative: true
    screenReader: 每個控制項有名稱、目前值、操作結果與錯誤回饋
    reducedMotion: 停用自動動畫仍可逐步操作
  testCases:
  - 載入「F-8-2：一次函數的圖形」時不得先顯示正解；學生必須先提交對「F-8-2：一次函數的圖形」的預測，且預測會被保留供後續比較。
  - 操作「function-graph：以「F-8-2：一次函數的圖形」作為唯一主題，至少同步呈現兩種表徵」中的主要變項後，與「表徵／證據與結論的對應」相關的圖、表、句構或因果鏈必須同步更新，文字狀態也要說明改變了什麼。
  - 學生觸發「把「F-8-2：一次函數的圖形」當成可直接套公式的程序，忽略量與表徵的對應」時，系統必須命中本單元的 misconception check，要求學生指出可定位證據，並先給一階提示而非直接揭露答案。
  - 在 320px、375px 與 768px 寬度，以鍵盤完成「F-8-2：一次函數的圖形」的預測—操作—觀察—解釋流程時，核心題幹、控制項、回饋與可讀狀態不得溢位或遺失。
  - 以新資料執行「F-8-2：一次函數的圖形」的 CAP transfer：換一個情境但保留「F-8-2：一次函數的圖形」的核心關係；不可只換名詞；學生回答必須選答後必須指出證據或推理步驟，評分同時檢查概念、證據對應與表達完整度。
  - 外部資料失效時，FunctionRepresentationBlock 仍須以「F-8-2：一次函數的圖形」的文字與資料 fallback 完成預測、操作、觀察、解釋與 transfer，不得阻塞本課。
