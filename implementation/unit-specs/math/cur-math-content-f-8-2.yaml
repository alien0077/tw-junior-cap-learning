    currentEvidenceStatus: curriculum-and-kg-grounded; publisher-chapter-evidence-recorded; fusion-review-pending
  learningGoals:
  - 用多重表徵解釋「F-8-2：一次函數的圖形」的關係，而非只背步驟
  - 由圖表或操作結果建立符號／數值表達
  - 將概念遷移到一題新情境並說明理由
  prerequisites:
  - 能讀懂本單元使用的基本符號、圖表或短文本
  - 能依提示完成一次預測、操作、觀察、解釋循環
  coreConcepts:
  - F-8-2：一次函數的圖形
  - 表徵／證據與結論的對應
  - 錯誤答案所反映的概念差異
  misconceptions:
  - 把「F-8-2：一次函數的圖形」當成可直接套公式的程序，忽略量與表徵的對應
  - 把記憶答案當成理解證據
  - 忽略題幹中的限制條件或單位
  contentFlow:
  - 'hook: 以單元真實問題引起預測'
  - 'activate-prerequisite: 顯示先備檢核並允許補救'
  - 'visualize: 用 function-graph 建立可觀察表徵'
  - 'predict: 學生先提交預測且答案暫不揭露'
  - 'manipulate: 改變一個變項或標記一段證據'
  - 'observe: 同步更新圖、表、句構或因果鏈'
  - 'explain: 學生用一句話說明觀察到的關係'
  - 'formalize: 再顯示本單元正式語言與記法'
  - 'transfer: 進入會考型新資料題'
  - 'exit-ticket: 一題理由題加一個自我診斷'
  visualizations:
  - function-graph：以「F-8-2：一次函數的圖形」作為唯一主題，至少同步呈現兩種表徵
  - 每次變更都保留因果可追溯的標記、圖例與文字替代
  interactiveBlocks:
  - id: CUR-MATH-CONTENT-F-8-2-I01
    component: FunctionRepresentationBlock
    purpose: 用同一座標尺度同步方程式、表格與直線；一次只改 a 或 b，直接觀察固定變化率、y 截距、平行平移與兩方案交點。
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        primary: 1
        secondary: 1
    studentActions:
    - 先預測 b=30 固定時把 a 由18改成8，哪個點與哪個變化量保持不變
    - 只調整 a，讀 x=0、2、4 的表格差與直線傾斜，確認 (0,30) 固定
    - 鎖定 a=8 後只改 b=30→50，比較同一 x 的輸出差與兩條平行線
    - 拖動 x 比較 18x+30 與24x，找到價差0並以方程式驗證交點；再遷移到 y=−7x+100
    visualRules:
    - 圖、表、方程式共用同一 a、b、x 狀態，任一參數改變時三種表示同步
    - 比較 a 時 b 必須鎖定；比較 b 時 a 必須鎖定，避免同時改兩個變因
    - 交點模式同時標示兩方案在相同 x 的輸出與價差，不能只靠線條看起來相交
    - 手機版圖形仍保留坐標尺度、表格與參數意義；不以線色作唯一區別
    misconceptionChecks:
    - id: MC-CUR-MATH-CONTENT-F-8-2-I01
      trigger: 把 b 的垂直平移誤認為斜率改變，或把圖上兩線接近當成已找到精確交點
      prompt: 固定另一個參數，分別讀 x=0 的值與相鄰 x 的輸出差；交點則比較同一 x 的兩個輸出是否完全相等。
      expectedEvidence: a 改變時 (0,b) 不動而每單位變化量改變；b 改變時斜率不變且所有 y 同增；x=5 時兩方案皆120
    feedback:
      correct: 指出圖、表、式中一致的斜率或截距證據，再要求切換另一個單一參數驗證。
      incorrect: 先指出混淆的是斜率、截距或交點精度；鎖定另一參數後重試，不直接給最終結論。
