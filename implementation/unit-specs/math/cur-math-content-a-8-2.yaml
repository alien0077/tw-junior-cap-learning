  knowledgeGraphIds:
  - kg-math-content-a-8-2
  title: A-8-2：多項式的意義
  subject: math
  socialDiscipline: null
  curriculumLevel: learning-content
  gradeRange:
  - '8'
  fusedScope:
    officialCurriculum: A-8-2：多項式的意義
    curriculumIntent: A-8-2：多項式的意義
    publisherEvidence:
      nani:
