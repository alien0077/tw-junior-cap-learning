unitImplementationSpec:
  specVersion: '1.0'
  lessonId: cur-math-linear-equation-check
  knowledgeGraphIds: [kg-math-content-a-7-3]
  title: 一元一次方程式：代回檢查
  subject: math
  curriculumLevel: learning-content
  gradeRange: ['7']
  learningGoals:
  - 以等價變形求候選解並保留可追溯步驟
  - 將候選值代回原方程式，分別計算左右兩邊
  - 同時檢查等式成立與題意範圍
  coreConcepts:
  - 方程式變形必須維持等值
  - 代回原式比只檢查最後一行更能發現錯誤
  - 情境解還須符合單位、整數與非負等限制
  misconceptions:
  - 括號只除一項
  - 左右兩邊沒有同步做相同運算
  - 左右不等時任意修改候選答案
  interactiveBlocks:
  - id: CUR-MATH-LINEAR-EQUATION-CHECK-I01
    component: AlgebraBalanceBlock
    purpose: 保留2(x+3)=14的等價變形，再以左右值驗證x=4並遷移至費用方程式
    studentActions:
    - 兩邊同除2得到x+3=7
    - 兩邊同減3得到x=4
    - 代回原式確認左右皆為14
    - 對15x+80=170求x=6並檢查人數限制
    misconceptionChecks:
    - id: MC-CUR-MATH-LINEAR-EQUATION-CHECK-I01
      trigger: 只檢查整理後最後一行或代回左右不等
      prompt: 回到原方程式，分別算左值與右值，再定位括號、符號、移項或除法錯誤。
      expectedEvidence: x=4時2(4+3)=14；費用題x=6時15×6+80=170
  testCases:
  - 2(x+3)=14須保留x+3=7與x=4兩步並代回原式
  - 故意錯誤候選值不得以修改答案方式讓等式成立
  - 15x+80=170須得到x=6且說明人數為非負整數
  - 回饋需指出錯誤所在步驟而非直接只顯示答案
  status:
    designStatus: specified
    implementationStatus: implemented
    qaStatus: untested
  sourceRefs:
  - locator: A-7-3 lineage；lesson studyReferences 與 simulation sourceRefs
    role: curriculum-and-lesson-evidence
