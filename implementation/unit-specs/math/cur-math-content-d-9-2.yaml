    currentEvidenceStatus: curriculum-and-kg-grounded; publisher-chapter-evidence-recorded; fusion-review-pending
  learningGoals:
  - 用多重表徵解釋「D-9-2：認識機率」的關係，而非只背步驟
  - 由圖表或操作結果建立符號／數值表達
  - 將概念遷移到一題新情境並說明理由
  prerequisites:
  - 能讀懂本單元使用的基本符號、圖表或短文本
  - 能依提示完成一次預測、操作、觀察、解釋循環
  coreConcepts:
  - D-9-2：認識機率
  - 表徵／證據與結論的對應
  - 錯誤答案所反映的概念差異
  misconceptions:
  - 把「D-9-2：認識機率」當成可直接套公式的程序，忽略量與表徵的對應
  - 把記憶答案當成理解證據
  - 忽略題幹中的限制條件或單位
  contentFlow:
  - 'hook: 以單元真實問題引起預測'
  - 'activate-prerequisite: 顯示先備檢核並允許補救'
  - 'visualize: 用 data-explorer 建立可觀察表徵'
  - 'predict: 學生先提交預測且答案暫不揭露'
  - 'manipulate: 改變一個變項或標記一段證據'
  - 'observe: 同步更新圖、表、句構或因果鏈'
  - 'explain: 學生用一句話說明觀察到的關係'
  - 'formalize: 再顯示本單元正式語言與記法'
  - 'transfer: 進入會考型新資料題'
  - 'exit-ticket: 一題理由題加一個自我診斷'
  visualizations:
  - data-explorer：以「D-9-2：認識機率」作為唯一主題，至少同步呈現兩種表徵
  - 每次變更都保留因果可追溯的標記、圖例與文字替代
  interactiveBlocks:
  - id: CUR-MATH-CONTENT-D-9-2-I01
    component: ProbabilityExperimentBlock
    purpose: 以可重現的累積硬幣試驗比較理論機率0.5與實驗相對頻率，先預測再查看10/20/50/100/200次資料，理解長期較穩定但不要求每批恰好相等。
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        primary: 1
        secondary: 1
    studentActions:
    - 先判斷10次有7次正面是否足以證明硬幣一定不公平，答案保持隱藏
    - 切換累積試驗次數10、20、50、100、200，讀正面次數與相對頻率折線相對於0.5的位置
    - 比較『接近0.5』與『等於0.5』，用短期波動與長期趨勢限制結論
    - 遷移到等面積轉盤P(紅)=1/4與48/200=0.24，區分理論模型、實驗觀察與下一次不確定性
    visualRules:
    - 第一畫面顯示10次7正面的情境與理論0.5基準，但不先宣告公平與否
    - 累積試驗使用固定可重現資料，避免自動QA因隨機數產生不穩定結論；仍明確標示這是一組觀察資料
    - 折線、目前試驗點、正面次數、分母與相對頻率同步，不能只顯示單一百分比
    - 手機版保留0.5基準線與目前數值卡；顏色不是唯一區分方式
    misconceptionChecks:
    - id: MC-CUR-MATH-CONTENT-D-9-2-I01
      trigger: 把7/10直接當成硬幣理論機率，或認為公平硬幣100次必須恰好50次正面，或由前面結果推斷下一次必然結果
      prompt: 分開寫『模型給的理論機率』與『這一批資料的相對頻率』；再比較試驗次數增加時波動幅度是否較穩定。
      expectedEvidence: 10次7正面相對頻率0.70；累積資料到100次0.51、200次0.505；轉盤48/200=0.24接近1/4但不必相等
    feedback:
      correct: 指出理論值、觀察值與試驗次數三者的關係，再要求以轉盤新情境說明。
      incorrect: 先指出混淆的是理論機率、相對頻率或獨立試驗；提示對應分母與基準線後重試。
