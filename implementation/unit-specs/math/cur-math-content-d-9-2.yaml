  capTransfer:
    questionType: 理論機率與相對頻率的比較
    stemConstraint: 等面積轉盤P(紅)=1/4；200次觀察48次紅色，判讀0.24與0.25，並說明下一次是否被前次結果決定
    requiredResponse: 0.24接近0.25屬合理波動；不要求剛好50次；下一次仍具不確定性
    scoring: 計算1、理論/實驗區分1、獨立性敘述1
  exitTicket:
    prompt: 公平硬幣20次若有12次正面，能否直接說理論機率是0.6？為什麼？
    successCriteria:
    - 0.6是這批資料的相對頻率
    - 理論模型仍是0.5
    - 短期資料會波動，需更多試驗觀察長期趨勢
  expressionExtension:
    applicable: false
    task: 用 80～120 字／英文短段落，將「D-9-2：認識機率」的證據、因果或觀察說給同學聽
    constraint: 學生先寫；系統只給一階回饋，不直接代寫完整答案
  mobileA11y:
    breakpoints:
    - 320
    - 375
    - 390
    - 430
    - 768
    touchTargetMinPx: 44
    keyboardAlternative: true
    screenReader: 每個控制項有名稱、目前值、操作結果與錯誤回饋
    reducedMotion: 停用自動動畫仍可逐步操作
  testCases:
  - 載入「D-9-2：認識機率」時不得先顯示正解；學生必須先提交對「D-9-2：認識機率」的預測，且預測會被保留供後續比較。
  - 操作「data-explorer：以「D-9-2：認識機率」作為唯一主題，至少同步呈現兩種表徵」中的主要變項後，與「表徵／證據與結論的對應」相關的圖、表、句構或因果鏈必須同步更新，文字狀態也要說明改變了什麼。
  - 學生觸發「把「D-9-2：認識機率」當成可直接套公式的程序，忽略量與表徵的對應」時，系統必須命中本單元的 misconception check，要求學生指出可定位證據，並先給一階提示而非直接揭露答案。
  - 在 320px、375px 與 768px 寬度，以鍵盤完成「D-9-2：認識機率」的預測—操作—觀察—解釋流程時，核心題幹、控制項、回饋與可讀狀態不得溢位或遺失。
  - 以新資料執行「D-9-2：認識機率」的 CAP transfer：換一個情境但保留「D-9-2：認識機率」的核心關係；不可只換名詞；學生回答必須選答後必須指出證據或推理步驟，評分同時檢查概念、證據對應與表達完整度。
  - 外部資料失效時，DataExplorerBlock 仍須以「D-9-2：認識機率」的文字與資料 fallback 完成預測、操作、觀察、解釋與 transfer，不得阻塞本課。
  definitionOfDone:
  - 課綱 ID、KG ID、標題與官方 locator 通過一致性檢查
  - 三版本章節級證據已補齊，或明確標記 pending，不得冒充完成
  - 至少一個互動操作能回答本單元明確學習問題
  - 至少一個迷思被實際誘發、診斷並以分層回饋處理
  - 會考 transfer、exit ticket 與表達延伸（適用時）可執行
  - mobile、keyboard、screen reader、reduced-motion 與 fallback 測試通過
  - 內容、教學法與版權審查通過；無 placeholder、TODO 或只換名詞模板
