  learningGoals:
  - 區分直角柱外露面面積與內部容量，以平方／立方單位表示
  - 由正角錐展開圖辨認底面與各側面三角形，使用側面斜高逐面求表面積
  - 由直圓錐展開圖連結扇形弧長與底圓周長，使用母線作扇形半徑求表面積
  - 操作柱長時，能由兩個三角底面、三個側面展開圖及數值表說明表面積與體積如何改變
  - 將底面由 8-15-17 改為 7-24-25 直角三角形，重新計算直角柱表面積與體積並說明依據
  prerequisites:
  - 能讀懂本單元使用的基本符號、圖表或短文本
  - 能依提示完成一次預測、操作、觀察、解釋循環
  coreConcepts:
  - S-9-13：表面積與體積
  - 表徵／證據與結論的對應
  - 錯誤答案所反映的概念差異
  misconceptions:
  - 把底面積乘柱長當成表面積，漏算兩個底面或三片側面
  - 用底面周長推體積，或用底面積推側面總面積
  - 把平方公分與立方公分混用，或將錐體體積公式越界帶入本課
  contentFlow:
  - 'hook: 從外殼材料與內部容量這兩種不同任務辨認所求量'
  - 'teach-prism: 以兩個底面與逐片長方形側面建立表面積清單，另以底面積乘柱長建立直角柱體積'
  - 'teach-pyramid: 延續逐面列帳，將底面與側面三角形分開，辨認側面斜高不等於立體垂直高'
  - 'teach-cone: 從平面多邊形面轉到扇形展開，以扇形弧長等於底圓周長推導圓錐側面積'
  - 'predict: 選擇增量預測並提交，提交前隱藏公式與數值'
  - 'visualize: 呈現 8-15-17 直角三角柱立體示意與兩底三側展開表徵'
  - 'manipulate: 以鍵盤可操作的柱長滑桿改變單一變項'
  - 'observe: 同步更新立體連接邊、展開圖長方形、表面積表與體積表'
  - 'explain: 區分底面周長乘柱長與底面積乘柱長所代表的量'
  - 'transfer: 改用 7-24-25 直角三角形底面重新計算'
  - 'exit-ticket: 說明平方／立方單位並指出展開圖證據'
  visualizations:
  - math-geometry 專屬模型：以 8-15-17 直角三角柱同步呈現立體連接、三側表徵、逐面表格及體積
  - 預測答案提交前不揭露正式公式、解題數值或正誤回饋
  - 柱長滑桿每次變更都同步更新示意、三片側面尺寸、表面積、體積與文字狀態
  - 以文字標籤與表格補足圖形資訊，顏色不單獨承擔意義
  interactiveBlocks:
  - id: CUR-MATH-CONTENT-S-9-13-I01
    component: StepwiseReasoningBlock
    purpose: 讓學生操作並看見「S-9-13：表面積與體積」中最容易被背誦取代的關係
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        prismLength: 3
    studentActions:
    - 先提交預測，不顯示正解
    - 以鍵盤或滑鼠調整柱長滑桿，操作單一條件
    - 對照前後兩個底面、三個側面、表面積與體積數值
    - 以短句說明柱長變化如何分別影響外殼面積與內部容量
    - 以 7-24-25 直角三角形底面完成新資料遷移題
    visualRules:
    - 操作後所有相關表徵同步更新，不得只改單一數字
    - 正解揭露前保留學生預測與操作紀錄
    - 顏色不可單獨承擔意義，必須搭配標籤、符號或文字
    - 窄螢幕不得裁切核心圖、題幹與回饋
    misconceptionChecks:
    - id: MC-CUR-MATH-CONTENT-S-9-13-I01
      trigger: 把底面積乘柱長當成表面積，或把底面周長乘柱長當成體積
      prompt: 請在展開圖或表格指出兩個底面、三個側面，以及各自對應平方／立方單位的證據。
      expectedEvidence: 兩個三角底面、三個長方形側面、底面周長、底面積及正確單位
    feedback:
      correct: 指出學生用展開圖或數值表支撐的步驟，要求以新底面重算一次。
      incorrect: 先辨認錯在底面、側面、所求量或單位；先提示回看展開圖，再讓學生重試，最後才顯示局部算式。
