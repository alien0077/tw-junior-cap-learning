  capTransfer:
    questionType: 新底面資料下的直角柱表面積與體積
    stemConstraint: 底面改為 7-24-25 直角三角形、柱長 2 cm；須重新由底面積與周長建模，不可複製示範題數值
    requiredResponse: 寫出兩個底面、三個側面、體積乘式及平方／立方單位
    scoring: 概念正確 1、證據對應 1、表達完整 1
  exitTicket:
    prompt: 柱長每增加 1 cm，表面積與體積各增加多少？請指出展開圖和底面中的依據。
    successCriteria:
    - 說出底面周長控制側面面積增量、底面積控制容量增量
    - 正確使用 cm² 與 cm³
    - 指出一項展開圖或計算表證據
  expressionExtension:
    applicable: false
    task: 用 80～120 字／英文短段落，將「S-9-13：表面積與體積」的證據、因果或觀察說給同學聽
    constraint: 學生先寫；系統只給一階回饋，不直接代寫完整答案
  mobileA11y:
    breakpoints:
    - 320
    - 375
    - 768
    touchTargetMinPx: 44
    keyboardAlternative: true
    screenReader: 每個控制項有名稱、目前值、操作結果與錯誤回饋
    reducedMotion: 停用自動動畫仍可逐步操作
  testCases:
  - 初始畫面只呈現柱長3 cm增至5 cm的預測選項；未選答案不能提交，選答案但未提交仍不得顯示公式、數值表、滑桿或正誤解析；選B提交後才顯示解鎖內容，並保留所選預測。
  - 解鎖後須同時顯示8-15-17直角三角柱立體圖、兩個三角端面與三個側面的展開表徵、逐面計算表；初值L=3時表面積240 cm²、體積180 cm³，鍵盤將L調至5時，三片側面、S=320 cm²、V=300 cm³及文字狀態同步更新。
  - 預測A提交後回饋須指出周長40 cm控制側面面積增量、底面積60 cm²控制體積增量，提示學生回看展開表徵；不得把誤答判為正確，也不得混用cm²與cm³。
  - 正角錐例須從展開面逐片加總底面與側面，辨認側面斜高與立體垂直高不同；直圓錐例須由扇形弧長等於底圓周長推導，不可只呈現無來源的套用公式。
  - 以鍵盤操作預測、提交、四步導覽、柱長滑桿、遷移選項與重設時，焦點須留在對應控制項；320px、375px與768px下題幹、控制項、逐面表格及回饋不得被截切或形成頁面水平溢位。
  - 遷移題以新7-24-25直角三角形、柱長2 cm重新計算；選B並提交後顯示兩個底面共168 cm²、三側總面積112 cm²、表面積280 cm²與體積168 cm³的推導，錯答則提示分開重算面積與周長。
  - 重設須清除預測、解鎖、滑桿及遷移狀態並回到答案隱藏畫面；不依賴外部網路即可完成預測、操作、觀察、解釋及新底面遷移。
  - 若幾何模擬腳本無法載入，學生頁仍須保留六段完整教學正文與 GuidedChoice 題目；不得顯示空白卡片或 JavaScript 錯誤，並能以鍵盤完成文字題與逐題回饋。此為本課的降級 fallback，不代表模擬操作仍可使用。
