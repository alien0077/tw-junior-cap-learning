unitImplementationSpec:
  specVersion: '1.0'
  lessonId: cur-math-content-root-a
  knowledgeGraphIds: [kg-math-content-a]
  title: A：代數——把數量關係寫成可檢查的式子
  subject: math
  curriculumLevel: learning-content
  gradeRange: ['7','8','9']
  learningGoals:
  - 先辨認未知量、已知量、單位與限制，再建立代數模型
  - 以代回、估算、單位與範圍檢查式子、方程式與不等式
  coreConcepts:
  - 變動量與固定量不可因表面相鄰而任意合併
  - 等號表示等值；不等式表示可行範圍
  - 表格、式子與圖形必須描述同一關係
  misconceptions:
  - 把固定量20與每張35元誤寫成55x
  - 把移項當成無理由變號
  - 忽略整數、非負與至少足量等情境限制
  interactiveBlocks:
  - id: CUR-MATH-CONTENT-ROOT-A-I01
    component: StepwiseReasoningBlock
    purpose: 以校慶備品與票券情境完成建模、逐步計算、限制檢查與遷移判斷
    studentActions:
    - 標記未知量、已知量、單位與固定／變動關係
    - 保留中間算式並核對百分比基準
    - 對答案做代回、估算、單位與範圍檢查
    misconceptionChecks:
    - id: MC-CUR-MATH-CONTENT-ROOT-A-I01
      trigger: 把不同量直接相加或把128.8無條件捨去
      prompt: 先指出15%是以哪個量為基準，再檢查整數購買是否必須至少足量。
      expectedEvidence: 4×28=112；112×1.15=128.8；向上取整為129
  testCases:
  - 校慶4班每班28人加15%備品時，應保留112、128.8與向上取整129的推理鏈
  - 35x+20=195的解須能說明兩邊同減20、同除35並代回
  - 35x+20≤195須補上x為非負整數的情境限制
  - 鍵盤與窄螢幕仍可完成步驟選擇並讀取文字回饋
  status:
    designStatus: specified
    implementationStatus: implemented
    qaStatus: untested
  sourceRefs:
  - locator: 官方數學課綱 A：代數；lesson studyReferences 與 simulation sourceRefs
    role: official-curriculum-and-lesson-evidence
