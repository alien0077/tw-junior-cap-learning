unitImplementationSpec:
  specVersion: '1.0'
  lessonId: cur-math-linear-function-graph
  knowledgeGraphIds: [kg-math-content-f-8-2]
  title: F-8-2：一次函數的圖形
  subject: math
  curriculumLevel: learning-content
  gradeRange: ['8']
  learningGoals:
  - 在式子、表格、座標與直線圖形之間互相轉換
  - 分辨斜率是變化率、截距是x=0時的起始值
  - 以未參與建式的座標點驗證候選一次函數
  coreConcepts:
  - y=mx+b中m控制固定變化率，b控制y軸截距
  - 點在圖上等價於座標代入方程式成立
  - 只看直線方向不足以確認方程式
  misconceptions:
  - 把(x,y)座標順序顛倒
  - 改變斜率時誤以為截距也必須改變
  - 把固定起步費當斜率、每公里費當截距
  interactiveBlocks:
  - id: CUR-MATH-LINEAR-FUNCTION-GRAPH-I01
    component: FunctionRepresentationBlock
    purpose: 操作m與b並同步核對表格、座標、直線與方程式
    studentActions:
    - 對y=2x+1建立x=0、1、3的座標
    - 固定b=1只改m並觀察Δy/Δx與直線方向
    - 用未參與建式的點代回驗證
    - 對共享單車y=12x+40核對(5,100)與(8,136)
    misconceptionChecks:
    - id: MC-CUR-MATH-LINEAR-FUNCTION-GRAPH-I01
      trigger: 把40當斜率或只憑圖形方向判斷方程式
      prompt: 先檢查x=0的輸出，再用兩點計算Δy/Δx並代入另一點。
      expectedEvidence: 截距40；(136−100)/(8−5)=12；兩點均符合y=12x+40
  testCases:
  - y=2x+1需同步得到(0,1)、(1,3)、(3,7)
  - m改為−1且b固定1時截距不得移動，x每增1時y減1
  - (4,−3)須能驗證y=−x+1
  - 共享單車情境須正確區分斜率12與截距40
  - 320px與鍵盤路徑仍可讀取方程式、點、斜率及文字狀態
  status:
    designStatus: specified
    implementationStatus: implemented
    qaStatus: untested
  sourceRefs:
  - locator: F-8-2 lineage；lesson studyReferences 與 simulation sourceRefs
    role: official-curriculum-and-lesson-evidence
