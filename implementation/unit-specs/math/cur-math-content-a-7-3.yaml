  capTransfer:
    questionType: 路程表資料建模與單位短答
    stemConstraint: 步道總長 10.8 公里，先走 2.4 公里，其餘以每小時 3 公里行走 t 小時；建立方程式求 t，並說明為何答案單位是小時而非公里。
    requiredResponse: 定義 t、列出 2.4+3t=10.8、逐步解方程、代回總距離並檢查 t≥0。
    scoring: 未知量和方程式正確 1、等價解法正確 1、代回與單位／範圍說明 1
  exitTicket:
    prompt: 有人說四張票共 260 元，所以每張 65 元。若另收 20 元手續費，指出錯誤並寫出正確單價與驗算式。
    successCriteria:
    - 先從 260 元扣除 20 元，得到四張票共 240 元。
    - 將 240 除以 4 得每張 60 元。
    - 以 4×60+20=260 驗算，並標明「元／張」。
  expressionExtension:
    applicable: true
    task: 以自己的生活收據設計一個含固定費與單價的情境，寫出一次方程式，說明各項單位、解的意思與一種驗算方式。
    constraint: 學生先寫；回饋只檢查變動項／固定項、單位與代回，不替學生生成完整情境答案。
  mobileA11y:
    breakpoints:
    - 320
    - 375
    - 768
    touchTargetMinPx: 44
    keyboardAlternative: true
    screenReader: 每個控制項有名稱、目前值、操作結果與錯誤回饋
    reducedMotion: 停用自動動畫仍可逐步操作
  testCases:
  - 預測被保留；正解隱藏至學生操作「扣一次 20 元，再除以 4 張」後才顯示。
  - 單價 60 元的回代結果為 260 元；錯誤值 65 元回代為 280 元並命中固定費診斷。
  - 改動票數／固定費時，票券圖、費用式和候選值同步更新；不能只改畫面數字。
  - 在 320px、375px、768px 與鍵盤操作下完成預測、逐步求解、原式驗算及分層提示。
  - 步道遷移題得 t=2.8 小時，代回 2.4+3×2.8=10.8；不接受只寫 2.8 而無單位與條件說明。
  - 分數方程式步驟為 2(x+1)+3(x−2)=24、5x−4=24、x=28/5；回代兩項為11/5與9/5，總和4；對右側漏乘或括號常數漏乘須給出可辨識提示。
  - 關閉動畫或費率圖元件失效時，文字 fallback 以固定費卡、單價／數量表和等式鏈呈現求解，仍能檢查單位、答案與步道遷移。
  definitionOfDone:
  - 課綱 ID、KG ID、標題與官方 locator 通過一致性檢查
  - 三版本章節級證據已補齊，或明確標記 pending，不得冒充完成
  - 至少一個互動操作能回答本單元明確學習問題
  - 至少一個迷思被實際誘發、診斷並以分層回饋處理
  - 會考 transfer、exit ticket 與表達延伸（適用時）可執行
  - mobile、keyboard、screen reader、reduced-motion 與 fallback 測試通過
  - 內容、教學法與版權審查通過；無 placeholder、TODO 或只換名詞模板
