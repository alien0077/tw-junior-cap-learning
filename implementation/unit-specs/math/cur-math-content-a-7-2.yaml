  - refId: phet-activity
    reuseDecision: inspiration-only
    application: "沿用先預測、再檢查、以證據解釋的活動節奏；本課不移植其求解程序。"
  - refId: w3c-aria
    reuseDecision: inspiration-only
    application: "列式／分類／候選檢驗各控制項均提供鍵盤名稱與文字結果宣告；正誤不只用顏色表示，且不呈現天平或平衡狀態。"
  - refId: w3c-landmarks
    reuseDecision: inspiration-only
    application: "以主內容與標題層級組織情境量、符號式、分類及候選值檢驗步驟，方便鍵盤和助讀器循序導覽。"
  capTransfer:
    questionType: 從短情境建立一元一次方程式，並說明符號所代表的量
    stemConstraint: 六包相同種子、包材重5克、總重47克；學生定義每包重量並列式，不要求解。
    requiredResponse: 寫出未知數定義及6s+5=47，說明係數、固定量、總量和單位各自對應何處。
    scoring: 未知數及單位定義1、關係式正確1、係數與常數語意說明1
  exitTicket:
    prompt: 小安把 2x+5 當成一元一次方程式，並說候選 x=3 是 2x+5=13 的解。指出第一個判斷錯誤，並用原式左右比較說明候選值是否成立。
    successCriteria:
    - 指出 2x+5 沒有等號，所以是代數式，不是方程式。
    - 將 x=3 代入 2x+5=13，左側為11、右側為13。
    - 說明左右不相等，故 x=3 不是該方程式的解。
  expressionExtension:
    applicable: true
    task: 寫一段給同學看的說明，解釋如何由情境辨認未知量並列成方程式，再說明如何代入候選值判斷解是否成立。
    constraint: 學生先寫；系統只檢查「未知數定義、量的對應、原式左右比較」三項，不替學生代寫完整答案。
  mobileA11y:
    breakpoints:
    - 320
    - 375
    - 768
    touchTargetMinPx: 44
    keyboardAlternative: true
    screenReader: 每個控制項有名稱、目前值、操作結果與錯誤回饋
    reducedMotion: 停用自動動畫仍可逐步操作
  testCases:
    - 初始情境量卡組合成4x+3=27；x為每袋枚數、4為袋數、3為散放枚數、27為總枚數，學生需先提交量義及係數、常數對照。
    - 分類題將缺等號、多未知數及二次未知數設為不同非例，分別回饋錯誤條件。
    - 代入x=6至4x+3=27顯示左側27、右側27；錯誤候選值顯示不等結果並要求重試。
    - 320px、375px、768px與鍵盤操作能完成情境建模、分類及候選檢驗；減少動態模式仍提供文字紀錄。
    - 遷移情境六包種子另加5克包材共47克，唯一目標是列式6s+5=47與解釋量的對應，不計算s。
    - 圖卡或外部資料失效時，文字fallback仍可讀取情境、輸入方程式、選擇候選值及比較左右數值。
  definitionOfDone:
    - 課綱 ID、KG ID、標題與官方 locator 通過一致性檢查
    - 三版本章節級證據已補齊，或明確標記 pending，不得冒充完成
    - 至少一個互動操作能回答本單元明確學習問題
    - 至少一個迷思被實際誘發、診斷並以分層回饋處理
    - 會考 transfer、exit ticket 與表達延伸（適用時）可執行
    - mobile、keyboard、screen reader、reduced-motion 與 fallback 測試通過
    - 內容、教學法與版權審查通過；無 placeholder、TODO 或只換名詞模板
