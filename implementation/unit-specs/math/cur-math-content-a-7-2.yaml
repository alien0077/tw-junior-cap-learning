  learningGoals:
  - 將單一未知量的具體情境寫成一元一次方程式，說清楚未知數、係數、常數、等號兩側與單位的意義。
  - 依等號、未知數個數及未知數最高次數，區分一元一次方程式與非例。
  - 判斷給定數值是否為方程式的解：代入原式後兩側相等才成立；本單元不教授如何求出未知數。
  prerequisites:
  - 能讀懂本單元使用的基本符號、圖表或短文本
  - 能依提示完成一次預測、操作、觀察、解釋循環
  coreConcepts:
  - 方程式是含未知數的等量關係；解是使等式成立的未知數值，不是任何被移到等號另一邊的數。
  - 本單元限於方程式意義、解的定義與具體情境列式；等量公理求解程序及應用求解屬 A-7-3。
  - 候選值驗證必須代回原方程式並比較左右結果；情境題還要辨明單位、範圍與語意條件。
  misconceptions:
  - 把等號讀成「接下來算答案」，因此只計算左側或把 3x+2=14 誤當成 3x+2 的另一種寫法。
  - 把任何含字母的表達式都叫方程式，忽略等號、未知數個數或次數條件。
  - 代入候選值後只計算左側，沒有和原式右側比較；或把候選值誤當由求解程序所得。
  contentFlow:
  - 'hook: 從四袋徽章與散放徽章的清點紀錄寫成 4x+3=27，追問每個數量從何而來。'
  - 'activate-prerequisite: 對照重複相同物件與相加，確認 4x 表示四份各 x，而非 4+x。'
  - 'classify: 依有無等號、未知數種類數、未知數最高次數分類式子，替非例指出違反條件。'
  - 'predict: 對 2y+5=13 比較候選 y=3、4 的左右值，先預測哪一個會使原等式成立。'
  - 'manipulate: 將候選值代入原方程式，計算左側並與原式右側並列，不移項求未知數。'
  - 'observe: 檢查兩側數值是否相等，區分成立的解與不成立的候選值，保留原式條件。'
  - 'explain: 用自己的話區分方程式、候選值與解，指出等號成立作為判定證據。'
  - 'model: 將圖書室五箱書加七本共四十二本轉成 5n+7=42，逐項標出係數、常數與總量。'
  - 'guided-practice: 分類學生自編符號卡；對漏等號、誤讀重複量與次數錯置提供不同提示。'
  - 'transfer: 將六包種子與包材總重情境列成 6s+5=47，讓同伴由符號式還原故事。'
  - 'exit-ticket: 判斷方程式類型、代入一個候選值比較等號兩側，並獨立列一個新情境式；明示求解留至 A-7-3。'
  visualizations:
  - 情境量對照：四袋各 x 枚、三枚散放與總數 27，文字／式子同步對應 4x+3=27。
  - 分類矩陣：以等號、未知數數量與最高次數三欄辨認方程式／非例。
  - 候選值表：代入原式後並列左右計算值及相等判定，禁止展示求解變形鏈。
  interactiveBlocks:
  - id: CUR-MATH-CONTENT-A-7-2-I01
    component: AlgebraEquationMeaningBlock
    purpose: 以情境量卡建立方程式、辨識一元一次結構，並代入候選值檢驗原式；不展示等式變形或求解流程。
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        equalBags: 4
        looseBadges: 3
        totalBadges: 27
    studentActions:
    - 先選出表示四袋、每袋未知數量、三枚散放與總數的符號關係4x+3=27，再說明各符號代表什麼；此互動為選項操作，不描述成拖曳。
    - 以鍵盤或觸控將式子分類為一元一次方程式、代數式或非例，錯誤時指出第一個不符合的條件。
    - 選擇候選值 x=6 並代入原式，比較左側結果與右側 27；系統不得提供移項／同除解法。
    - 將新的六包種子總重情境寫成式子，並讓同伴由符號式還原量的關係。
    visualRules:
    - 情境判斷題作答後保留題幹與方程式；錯誤回饋指出缺漏或錯置的量，不顯示求解鏈。
    - 候選值代入表同時呈現原式、代入值、左側結果及右側結果，保留判斷理由。
    - 分類回饋指出等號、未知數數目或最高次數中的具體錯誤，避免只顯示對錯。
    - 顏色搭配數字、文字與符號標籤；無動畫時仍能讀到情境和式子的對應。
    - 320px 窄螢幕將情境、式子和左右比較改為直向閱讀，不隱藏量或單位。
    misconceptionChecks:
    - id: MC-CUR-MATH-CONTENT-A-7-2-I01
      trigger: 把 4x+3 當成方程式、把 4x 誤讀為 4+x，或代入候選值後沒有比較右側。
      prompt: 這個表示法缺少哪個條件？代入候選 x 後，原式左右各是多少？
      expectedEvidence: 方程式需有等號且符合一元一次條件；代入 x=6 後左側 4×6+3=27，右側 27，相等所以是解。
    feedback:
      correct: 指出分類或代入證據，接著請學生以新的符號式獨立分類／檢查。
      incorrect: 依序提示先找等號、再數未知數、再看最高次數；代入題則要求左右結果並列，不代替學生判讀。
  teachingPatternRefs:
  - refId: phet-ild
