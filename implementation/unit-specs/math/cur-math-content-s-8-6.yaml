  capTransfer:
    questionType: 已知斜邊與一直角邊的反向畢氏問題
    stemConstraint: 梯架斜長13公尺、底距5公尺，求高度並以平方和回查
    requiredResponse: 高度12公尺；13²−5²=144，取正平方根12，且5²+12²=13²
    scoring: 角色1、平方差1、回查與單位1
  exitTicket:
    prompt: 直角三角形兩股9、12，斜邊是多少？請用平方證據而非9+12。
    successCriteria:
    - 9²+12²=225
    - 斜邊=15
    - 15<21 且15²=9²+12²
  expressionExtension:
    applicable: false
    task: 用 80～120 字／英文短段落，將「S-8-6：畢氏定理」的證據、因果或觀察說給同學聽
    constraint: 學生先寫；系統只給一階回饋，不直接代寫完整答案
  mobileA11y:
    breakpoints:
    - 320
    - 375
    - 390
    - 430
    - 768
    touchTargetMinPx: 44
    keyboardAlternative: true
    screenReader: 每個控制項有名稱、目前值、操作結果與錯誤回饋
    reducedMotion: 停用自動動畫仍可逐步操作
  testCases:
  - 載入「S-8-6：畢氏定理」時不得先顯示正解；學生必須先提交對「S-8-6：畢氏定理」的預測，且預測會被保留供後續比較。
  - 操作「geometry-model：以「S-8-6：畢氏定理」作為唯一主題，至少同步呈現兩種表徵」中的主要變項後，與「表徵／證據與結論的對應」相關的圖、表、句構或因果鏈必須同步更新，文字狀態也要說明改變了什麼。
  - 學生觸發「把「S-8-6：畢氏定理」當成可直接套公式的程序，忽略量與表徵的對應」時，系統必須命中本單元的 misconception check，要求學生指出可定位證據，並先給一階提示而非直接揭露答案。
  - 在 320px、375px 與 768px 寬度，以鍵盤完成「S-8-6：畢氏定理」的預測—操作—觀察—解釋流程時，核心題幹、控制項、回饋與可讀狀態不得溢位或遺失。
  - 以新資料執行「S-8-6：畢氏定理」的 CAP transfer：換一個情境但保留「S-8-6：畢氏定理」的核心關係；不可只換名詞；學生回答必須選答後必須指出證據或推理步驟，評分同時檢查概念、證據對應與表達完整度。
  - 外部資料失效時，GeometryManipulationBlock 仍須以「S-8-6：畢氏定理」的文字與資料 fallback 完成預測、操作、觀察、解釋與 transfer，不得阻塞本課。
