  learningGoals:
  - 用多重表徵解釋「S-8-6：畢氏定理」的關係，而非只背步驟
  - 由圖表或操作結果建立符號／數值表達
  - 將概念遷移到一題新情境並說明理由
  prerequisites:
  - 能讀懂本單元使用的基本符號、圖表或短文本
  - 能依提示完成一次預測、操作、觀察、解釋循環
  coreConcepts:
  - S-8-6：畢氏定理
  - 表徵／證據與結論的對應
  - 錯誤答案所反映的概念差異
  misconceptions:
  - 把「S-8-6：畢氏定理」當成可直接套公式的程序，忽略量與表徵的對應
  - 把記憶答案當成理解證據
  - 忽略題幹中的限制條件或單位
  contentFlow:
  - 'hook: 以單元真實問題引起預測'
  - 'activate-prerequisite: 顯示先備檢核並允許補救'
  - 'visualize: 用 geometry-model 建立可觀察表徵'
  - 'predict: 學生先提交預測且答案暫不揭露'
  - 'manipulate: 改變一個變項或標記一段證據'
  - 'observe: 同步更新圖、表、句構或因果鏈'
  - 'explain: 學生用一句話說明觀察到的關係'
  - 'formalize: 再顯示本單元正式語言與記法'
  - 'transfer: 進入會考型新資料題'
  - 'exit-ticket: 一題理由題加一個自我診斷'
  visualizations:
  - geometry-model：以「S-8-6：畢氏定理」作為唯一主題，至少同步呈現兩種表徵
  - 每次變更都保留因果可追溯的標記、圖例與文字替代
  interactiveBlocks:
  - id: CUR-MATH-CONTENT-S-8-6-I01
    component: GeometryManipulationBlock
    purpose: 以直角三角形與三邊平方的面積關係建立 a²+b²=c²；操作兩股後同步更新平方和與斜邊，並用平方差處理已知斜邊的反向問題。
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        primary: 1
        secondary: 1
    studentActions:
    - 先標出直角、兩股與斜邊，再預測兩股6、8時的斜邊長
    - 揭示兩股平方36、64與斜邊平方100，將平方和連到三個正方形面積而非邊長直接相加
    - 調整兩股 a、b，觀察 a²、b²、c² 與 c=√(a²+b²) 同步；同時用 c<a+b 檢查量級
    - 遷移到斜邊13、一股5，先做 13²−5²，再取正平方根並代回 5²+12²=13²
    visualRules:
    - 第一畫面一定有直角三角形、直角標記與三個平方量；公式結論在預測前保持隱藏
    - 兩股平方和與斜邊平方同步，長度與面積不可混為同一量
    - 調整 a、b 時圖形、平方卡與近似斜邊值同步更新
    - 手機版仍看得到直角角色、a²+b² 與斜邊；不得退化成只有底高滑桿的通用三角形
    misconceptionChecks:
    - id: MC-CUR-MATH-CONTENT-S-8-6-I01
      trigger: 直接把兩股相加當斜邊，或已知斜邊時用 13−5 而不是平方差
      prompt: 先指出哪一邊是直角對面的斜邊，再比較三邊平方；用平方和／平方差而不是線段直接加減作證。
      expectedEvidence: 6²+8²=100=10²；反向題 13²−5²=144=12²，且三角不等式與正長度都成立
    feedback:
      correct: 指出直角角色與平方關係的兩層證據，再要求用另一組兩股驗證。
      incorrect: 先提示『定理連的是平方』與斜邊位置；重試仍錯才顯示局部平方值。
