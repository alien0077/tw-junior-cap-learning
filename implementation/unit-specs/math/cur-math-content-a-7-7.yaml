unitImplementationSpec:
  specVersion: '1.0'
  lessonId: cur-math-content-a-7-7
  knowledgeGraphIds:
  - kg-math-content-a-7-7
  title: A-7-7：一元一次不等式的意義
  subject: math
  socialDiscipline: null
  curriculumLevel: learning-content
  gradeRange:
  - '7'
  fusedScope:
    officialCurriculum: A-7-7：一元一次不等式的意義
    curriculumIntent: A-7-7：一元一次不等式的意義
    publisherEvidence:
      nani:
        status: pending
