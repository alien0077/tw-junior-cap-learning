  capTransfer:
    questionType: 資料判讀／概念應用／理由短答
    stemConstraint: 換一個情境但保留「S-9-1：相似形」的核心關係；不可只換名詞
    requiredResponse: 選答後必須指出證據或推理步驟
    scoring: 概念正確 1、證據對應 1、表達完整 1
  exitTicket:
    prompt: 今天的核心關係是什麼？若改變一個條件，哪個結果會跟著變，為什麼？
    successCriteria:
    - 提到本單元核心概念
    - 指出條件與結果
    - 使用一項證據或表徵
  expressionExtension:
    applicable: false
    task: 用 80～120 字／英文短段落，將「S-9-1：相似形」的證據、因果或觀察說給同學聽
    constraint: 學生先寫；系統只給一階回饋，不直接代寫完整答案
  mobileA11y:
    breakpoints:
    - 320
    - 375
    - 768
    touchTargetMinPx: 44
    keyboardAlternative: true
    screenReader: 每個控制項有名稱、目前值、操作結果與錯誤回饋
    reducedMotion: 停用自動動畫仍可逐步操作
  testCases:
  - 載入單元時顯示六段完整、單元專屬正文；各段須涵蓋定義推理、逐步例題、迷思、引導練習、遷移限制與自我檢核。
  - 互動必須有四個實際步驟，檢查多邊形邊界配對、角與邊條件、四邊統一倍率及末邊失配；錯答後可重試且回饋指向數學理由。
  - 矩形縮印例使用倍率1/2，3×4公分對應1.5×2公分；四邊與周界14→7公分均按1/2縮放。
  - 320px、375px、768px下能以鍵盤完成四題選擇、閱讀錯答提示並重試，無頁面錯誤或水平溢位。
  - 外部來源不可用時，本課已保存之原創正文、選項、答案及回饋仍可完整使用；不得要求幾何滑桿或外部模型才能學習。
  - Playwright 阻擋本地 simulations.js 時仍需顯示六段正文與四步 GuidedChoice，鍵盤作答並顯示逐題回饋；不得留下空白模擬區或 page error（fallback）。
  - Playwright 提交預測後才顯示兩倍率滑桿；鍵盤調整至相同倍率時兩邊長比同步相同，改成不同倍率時尺寸／表格同步且顯示角相等不足以判定相似。
  - Playwright 驗證按鈕須按現有兩倍率分類正誤並提供可重試提示；新5×7矩形的1/2縮印遷移需得2.5×3.5且兩邊倍率相同。
  - 重載後倍率、預測、檢核答案與遷移狀態由本地 state serialization 還原；重設清空並恢復答案鎖定初始狀態。
  definitionOfDone:
  - 課綱 ID、KG ID、標題與官方 locator 通過一致性檢查
  - 三版本章節級證據已補齊，或明確標記 pending，不得冒充完成
  - 至少一個互動操作能回答本單元明確學習問題
  - 至少一個迷思被實際誘發、診斷並以分層回饋處理
  - 會考 transfer、exit ticket 與表達延伸（適用時）可執行
  - mobile、keyboard、screen reader、reduced-motion 與 fallback 測試通過
  - 內容、教學法與版權審查通過；無 placeholder、TODO 或只換名詞模板
