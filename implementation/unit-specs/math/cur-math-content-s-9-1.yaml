        status: pending
        required: true
    fusionRule: 只融合三版本共同概念與可核對差異；章節級證據雖已記錄，融合審查前不得聲稱已完成版本融合
    currentEvidenceStatus: curriculum-and-kg-grounded; publisher-chapter-evidence-recorded; fusion-review-pending
  learningGoals:
  - 沿多邊形邊界依序配對對應頂點、角與邊，不以最近位置猜配對
  - 逐一檢查所有對應邊是否共用同一縮放倍率，並確認對應角保持不變
  - 以校園平面圖縮印資料驗算倍率，辨識單方向拉伸與局部資料錯置
  prerequisites:
  - 能辨認多邊形頂點、內角與邊界行進順序
  - 能用乘法與除法比較兩個長度的倍率
  coreConcepts:
  - 相似圖形對應角相等，且每一組對應邊使用同一長度倍率
  - 符號頂點順序決定配對；比例可整題採小圖比大圖或大圖比小圖，但方向必須一致
  - 等比例縮放時，每一組對應邊皆使用同一倍率，對應角保持不變
  - 水平與垂直方向倍率不同代表非等比例變形；不能只憑局部邊或外觀判定
  misconceptions:
  - 沿多邊形邊界配對時跳過頂點或反轉行進方向，造成對應錯置
  - 只檢查最長邊倍率，忽略其餘對應邊不一致
  - 把兩個圖形邊數相同誤當作必然相似
  - 只拉伸一個方向仍誤稱為等比例縮放
  contentFlow:
  - 'predict: 先判斷兩軸同倍率時矩形是否仍相似，提交前保留學生預測並隱藏模型數據'
  - 'manipulate: 以鍵盤可操作的水平／垂直倍率控制項分別改變縮放；初始長方形為3×4公分'
  - 'observe: 同步更新縮放後圖形、兩組對應邊長與各自倍率；角度保持90度'
  - 'explain: 依多邊形邊界順序配對後，以倍率表檢查所有對應邊，辨識角相等但兩方向倍率不同仍不相似'
  - 'verify: 選擇相似判斷並提交，依目前兩軸倍率提供錯誤提示或證據回饋'
  - 'transfer: 對5×7公分新圖按1/2等比例縮印，檢查新尺寸與兩組對應邊倍率'
  - 'fallback: 幾何腳本無法載入時保留六段原稿與文字選擇題，明確告知互動模型不可用'
  - 'self-check: 以單方向拉伸反例區分外觀相似與倍率相同'
  - 'worked-example: 將3×4公分矩形園區圖以1/2縮印，逐邊算出1.5、2、1.5、2公分，周界由14變7公分'
  - 'guided-practice: 先標配對，再固定比例方向，最後用角與邊證據判斷'
  - 'transfer: 校稿校園平面圖，以兩組獨立量測定位局部縮放或量測錯誤'
  - 'self-check: 以倍率3與2.5的長方形反例判斷單方向拉伸'
  visualizations:
  - 專屬幾何模型並列原圖與倍率後矩形，呈現水平／垂直尺度、邊長表與角度標示
  - 只顯示由 lesson simulation.similarityModel 驅動的數值；不得暗示矩形角相等足以單獨證明相似
  interactiveBlocks:
  - id: CUR-MATH-CONTENT-S-9-1-I01
    component: GeometryManipulationBlock
    purpose: 以四個逐步選擇檢查多邊形邊界配對、角邊條件、統一倍率和失配反例
    initialState:
      step: step-1
      answerVisibleAfterResponse: true
    studentActions:
    - 依鍵盤或點選操作回答目前步驟
    - 錯答後讀取針對本概念的回饋，再重試同一概念
    - 逐步完成四個問題並比較多邊形配對、縮放倍率和資料失配
    - 在專屬模型先提交預測，再分別操作水平與垂直縮放倍率
    - 觀察兩組對應邊比例及角度標示，以文字輸入解釋判斷
    - 檢查目前相似判斷，並以新長方形縮印情境完成遷移
    visualRules:
    - 每題以文字、數學符號及明確選項承載，不依賴顏色辨義
    - 錯答回饋後保留目前題目供重試
    - 窄螢幕不得裁切題幹、選項及回饋
    misconceptionChecks:
    - id: MC-CUR-MATH-CONTENT-S-9-1-I01-MATCH
      trigger: 多邊形配對跳過頂點或邊界行進方向不一致
      prompt: 依兩張園區圖的邊界順序，指出哪些頂點及邊互相對應。
      expectedEvidence: 配對順序完整保留，沒有跳點或交叉配對
    - id: MC-CUR-MATH-CONTENT-S-9-1-I01-SCALE
      trigger: 忽略一組對應邊倍率不一致
      prompt: 前三邊倍率為3、末邊倍率為2.8，這組資料支持整體等比例縮放嗎？
      expectedEvidence: 不支持；所有對應邊須共用同一倍率，應檢查末邊資料或印刷變形
    feedback:
      correct: 回扣題目中的頂點順序、對應倍率或反例數值，說明該證據支持的結論。
      incorrect: 提示重讀邊界配對並逐欄比較對應倍率；保留原題讓學生重試，不引入三角形判定或面積比。
