unitImplementationSpec:
  specVersion: '1.0'
  lessonId: cur-math-content-s-9-1
  knowledgeGraphIds:
  - kg-math-content-s-9-1
  title: S-9-1：相似形
  subject: math
  socialDiscipline: null
  curriculumLevel: learning-content
  gradeRange:
  - '9'
  fusedScope:
    officialCurriculum: S-9-1：相似形
    curriculumIntent: S-9-1：相似形
    publisherEvidence:
      nani:
        status: pending
