  - refId: w3c-aria
    reuseDecision: inspiration-only
    application: "以鍵盤可選的資料格、文字化座標和狀態提示呈現兩條限制；不以顏色作唯一判斷訊息。"
  - refId: w3c-landmarks
    reuseDecision: inspiration-only
    application: "以單一主內容、清楚標題與資料表區段協助導覽；候選數對檢查可循序閱讀，不需拖曳。"
  capTransfer:
    questionType: 雙資料限制建模與有序數對驗證
    stemConstraint: 回收站收集紙箱 x 件和寶特瓶 y 件，共 25 件；紙箱每件 2 公斤、寶特瓶每件 1 公斤，總重 46 公斤。判斷 (21,4) 是否為共同解，並說明 x、y 順序。
    requiredResponse: 寫出 x+y=25、2x+y=46，將 (21,4) 依序代入兩式，分別核對件數和公斤數。
    scoring: 兩條式各自對應正確條件 1、有序數對代入正確 1、兩項結果及單位解釋完整 1
  exitTicket:
    prompt: 候選 (10,8) 滿足 x+y=18，但 2x+y=30 不成立。它能否稱為這組聯立方程式的解？請用兩條紀錄說明。
    successCriteria:
    - 說明聯立解必須同時滿足兩條式，而不是只通過其中一式。
    - 算出 10+8=18 且 2×10+8=28≠30。
    - 結論指出 (10,8) 不是共同解。
  expressionExtension:
    applicable: true
    task: 為一次校園活動設計兩條可核對的數量條件，定義 x、y，寫出聯立式並解釋為何單獨滿足一式還不夠。
    constraint: 情境與數字由學生自行創作；系統只回饋變數順序、條件對應和兩式驗證，不直接代寫。
  mobileA11y:
    breakpoints:
    - 320
    - 375
    - 390
    - 430
    - 768
    touchTargetMinPx: 44
    keyboardAlternative: true
    screenReader: 每個控制項有名稱、目前值、操作結果與錯誤回饋
    reducedMotion: 停用自動動畫仍可逐步操作
  testCases:
  - 對原始飲品資料，(12,6) 必須同時通過 12+6=18 與 2×12+6=30；(10,8) 只通過第一條並被判為非共同解。
  - x、y 調整後表格與兩條式同步更新；切換 x/y 定義順序時，變數標籤和座標軸一致更新並保留作答紀錄。
  - 只檢查一式時觸發「另一張工作單」提示；第二次錯誤後才出現代入第二式的局部示範。
  - 在 320px、375px、768px 與鍵盤操作下完成預測、兩式檢查、解釋與回饋；縮窄時仍能讀取座標和單位。
  - 回收站 transfer 的 (21,4) 分別得到 25 件與 46 公斤；交換成 (4,21) 時兩式均不成立，且不得忽略變數定義。
  - 圖形或動態元件失效時，文字 fallback 仍以兩條條件表、候選有序數對與逐式驗算欄完成預測、共同解判定及回收物資 transfer。
  definitionOfDone:
  - 課綱 ID、KG ID、標題與官方 locator 通過一致性檢查
  - 三版本章節級證據已補齊，或明確標記 pending，不得冒充完成
  - 至少一個互動操作能回答本單元明確學習問題
  - 至少一個迷思被實際誘發、診斷並以分層回饋處理
  - 會考 transfer、exit ticket 與表達延伸（適用時）可執行
  - mobile、keyboard、screen reader、reduced-motion 與 fallback 測試通過
  - 內容、教學法與版權審查通過；無 placeholder、TODO 或只換名詞模板
