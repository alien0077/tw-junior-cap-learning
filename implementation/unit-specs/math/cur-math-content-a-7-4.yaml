    fusionRule: 依官方課綱與KG，逐一比較可讀版本標示材料的概念順序、表示法與候選解判別，再以本單元資料重新設計正文與互動；逐版標明第三方分享、閱讀定位及授權限制。無法讀到的版本不得推稱共同教法；本課僅形成康軒／翰林版本標示材料主導的原創融合草稿，南一正文未讀，三家publisher evidence均維持pending、lesson維持draft。
