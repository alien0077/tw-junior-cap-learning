  capTransfer:
    questionType: 資料判讀／概念應用／理由短答
    stemConstraint: 換一個情境但保留「Aa-Ⅳ-1：原子模型演變」的核心關係；不可只換名詞
    requiredResponse: 選答後必須指出證據或推理步驟
    scoring: 概念正確 1、證據對應 1、表達完整 1
  exitTicket:
    prompt: 金箔散射中「多數直行、極少數大角度偏折」分別支持什麼推論？這項定性模擬不能證明什麼？
    successCriteria:
    - 說明原子大部分空間及正電集中的核式推論
    - 指出觀察結果不是原子照片，模型圖是表徵
    - 說出本互動不提供真實散射率或完整原子結構
  expressionExtension:
    applicable: false
    task: 用 80～120 字／英文短段落，將「Aa-Ⅳ-1：原子模型演變」的證據、因果或觀察說給同學聽
    constraint: 學生先寫；系統只給一階回饋，不直接代寫完整答案
  mobileA11y:
    breakpoints:
    - 320
    - 375
    - 768
    touchTargetMinPx: 44
    keyboardAlternative: true
    screenReader: 每個控制項有名稱、目前值、操作結果與錯誤回饋
    reducedMotion: 停用自動動畫仍可逐步操作
  testCases:
  - 載入本課時先要求預測最近通過距離變近會如何改變路徑；未預測前不顯示正解說明。
  - 調整距離滑桿後，最近距離值、定性路徑和 aria-label 同步更新，且文案持續標示圖形不按實驗比例。
  - 以鍵盤操作滑桿能完成遠／近比較；更新後焦點保留，320／375／768px 不裁切圖、標籤或回饋。
  - 當學習者把模型圖當照片或把示意當成測量值時，命中對應診斷並要求分開寫觀察、推論與限制。
  - transfer 使用光譜線：學生說明這是可觀察證據，能支持能階差異推論，但不是電子繞行路徑的直接照片。
  - Fallback test：阻擋 simulations.js 後仍能看見六段教材、模型不可操作的明確提示及四題鍵盤文字練習；答錯可重試、答對有單元回饋，頁面無錯誤且窄螢幕不溢位。
  definitionOfDone:
  - 課綱 ID、KG ID、標題與官方 locator 通過一致性檢查
  - 三版本章節級證據已補齊，或明確標記 pending，不得冒充完成
  - 至少一個互動操作能回答本單元明確學習問題
  - 至少一個迷思被實際誘發、診斷並以分層回饋處理
  - 會考 transfer、exit ticket 與表達延伸（適用時）可執行
  - mobile、keyboard、screen reader、reduced-motion 與 fallback 測試通過
  - 內容、教學法與版權審查通過；無 placeholder、TODO 或只換名詞模板
