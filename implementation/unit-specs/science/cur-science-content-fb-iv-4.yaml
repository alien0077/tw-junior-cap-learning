  learningGoals:
  - 固定太陽光方向，說明日、月、地相對位置如何改變地球所見月面亮區比例
  - 用四個基準位置及其間連續盈虧，重建月相規律循環
  - 區分月球受光半球與地球觀察者可見亮面，並辨認示意模型不能支持的比例推論
  prerequisites:
  - 能辨識光源、球體模型與觀察者位置
  - 能比較球面受光方向與觀察視線
  coreConcepts:
  - 太陽照亮月球朝向太陽的一半，月球不自行發可見光
  - 日、月、地相對位置改變，使地球觀察者看見不同的受光比例
  - 新月、上弦、滿月、下弦是週期錨點，月相在錨點之間連續變化，循環約29.5天
  misconceptions:
  - 誤以為月球只在月相最亮時才受光，或把可見亮面當成整顆月球受光比例
  - 誤把地球影子當成日常月相盈虧的成因
  - 把示意圖畫出的天體大小、距離當成真實比例
  contentFlow:
  - 'predict：看四張只標位置與亮面的匿名月相卡，先預測各卡所處的月相順序，暫不揭曉名稱。'
  - 'manipulate：固定手電筒光向與地球觀察點，只按步移動白球代表的月球，並標出朝光半球及觀察視線。'
  - 'observe：每站分別記錄月球受光半球與地球觀察者實際看見的亮區，對照預測並找出兩者不相同之處。'
  - 'explain：以太陽—地球—月球相對位置解釋新月、兩個半亮位置及滿月；用幾何視線而非地球影子解釋日常月相。'
  - 'observe：沿公轉方向排列四個週期錨點，再記錄錨點之間可見亮面連續增加或減少，不把月相想成跳格變化。'
  - 'explain：區分受光面與可見面，並說明示意圖不可用來量真實天體大小或距離。'
  - 'transfer：評讀未標比例尺的新位置圖，說明可支持的相對位置與亮面結論，並指出不能推論的真實尺寸。'
  - 'exit-ticket：對新位置圖寫出光向、日地月相對位置、可見亮面及盈／虧方向，逐項以視線證據支持。'
  visualizations:
  - earth-system-model：同步顯示固定光源方向、月球軌道位置、受光半球和觀察者可見亮面
  - 每次變更都保留因果可追溯的標記、圖例與文字替代
  interactiveBlocks:
  - id: CUR-SCIENCE-CONTENT-FB-IV-4-I01
    component: EarthSystemBlock
    purpose: 讓學生驗證固定光源下，只改變月球軌道位置時，地球所見受光比例如何改變
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        lightDirection: fixed
        moonPosition: sunward
        observerPosition: earth
    studentActions:
    - 先提交預測，不顯示正解
    - 先預測新月、側方半亮、滿月與另一側半亮位置的可見比例
    - 固定光向和觀察點，只用按鈕或鍵盤逐站移動月球
    - 標出每站受光半球、觀察視線與可見亮面
    - 以位置—視線—可見比例解釋月相，而非只背名稱
    visualRules:
    - 操作後所有相關表徵同步更新，不得只改單一數字
    - 正解揭露前保留學生預測與操作紀錄
    - 顏色不可單獨承擔意義，必須搭配標籤、符號或文字
    - 窄螢幕不得裁切核心圖、題幹與回饋
    misconceptionChecks:
    - id: MC-CUR-SCIENCE-CONTENT-FB-IV-4-I01
      trigger: 學生把白球未朝向自己的暗面說成未受光，或稱月相由地球影子造成
      prompt: 光源固定時，白球哪一半持續受光？觀察點看到的亮面是否等於球體受光總量？
      expectedEvidence: 指出朝向光源的受光半球，並說明改變的是觀察視線相對該半球的位置
    feedback:
      correct: 以學生標示的光向、月球位置和視線回指可見亮面，再請他判讀一張未命名位置卡。
      incorrect: 先請學生分色標出「受光半球」與「觀察者看見部分」；若仍混淆，再顯示單站視線示範，不直接代答整組排序。
