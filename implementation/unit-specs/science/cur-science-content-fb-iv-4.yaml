  capTransfer:
    questionType: 資料判讀／概念應用／理由短答
    stemConstraint: 換一個情境但保留「Fb-Ⅳ-4：月相變化的規律」的核心關係；不可只換名詞
    requiredResponse: 選答後必須指出證據或推理步驟
    scoring: 概念正確 1、證據對應 1、表達完整 1
  exitTicket:
    prompt: 新位置圖中太陽光從右側照來，月球在地球軌道下方且約半亮；請指出亮面判斷依據及它屬於盈或虧的哪個基準位置。
    successCriteria:
    - 指出月球朝向太陽的一半持續受光
    - 以地球觀察視線解釋可見亮面比例
    - 依月球位置與前後錨點判斷盈／虧
  expressionExtension:
    applicable: false
    task: 用 80～120 字／英文短段落，將「Fb-Ⅳ-4：月相變化的規律」的證據、因果或觀察說給同學聽
    constraint: 學生先寫；系統只給一階回饋，不直接代寫完整答案
  mobileA11y:
    breakpoints:
    - 320
    - 375
    - 768
    touchTargetMinPx: 44
    keyboardAlternative: true
    screenReader: 每個控制項有名稱、目前值、操作結果與錯誤回饋
    reducedMotion: 停用自動動畫仍可逐步操作
  testCases:
  - 載入本單元時先顯示匿名四位置卡，不得先顯示月相答案；預測須保留供操作後比較。
  - 固定光向與觀察點，只移動月球後，軌道位置、受光半球示意與可見亮面文字／圖像必須同步更新。
  - 學生混淆受光半球與可見亮面時，系統先要求標出光源和觀察視線，再給單站提示，不能直接展示答案。
  - 在320、375、768px寬度以鍵盤操作四個月球位置時，控制項、光向圖例、亮面回饋及狀態文字不得溢位或遺失。
  - 遷移題提供無比例尺新位置圖，學生需指出可用相對位置解釋月相，但不能由圖面推算真實天體大小或距離。
  - 外部資料失效時，EarthSystemBlock 仍須以「Fb-Ⅳ-4：月相變化的規律」的文字與資料 fallback 完成預測、操作、觀察、解釋與 transfer，不得阻塞本課。
