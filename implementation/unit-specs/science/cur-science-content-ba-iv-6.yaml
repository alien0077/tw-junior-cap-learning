unitImplementationSpec:
  specVersion: '1.0'
  lessonId: cur-science-content-ba-iv-6
  knowledgeGraphIds:
  - kg-science-content-ba-iv-6
  title: Ba-Ⅳ-6：功率
  subject: science
  socialDiscipline: null
  curriculumLevel: learning-content
  gradeRange: ['7', '8', '9']
  fusedScope:
    officialCurriculum: Ba-Ⅳ-6：功率
    curriculumIntent: 以單位時間作功或能量轉換量理解功率，並區分功率與總能量
    publisherEvidence:
      nani: {status: pending, required: true}
      kanghsuan: {status: pending, required: true}
      hanlin: {status: pending, required: true}
    fusionRule: 未完成三版本章節融合前，只以官方課綱、KG 與可核對公開方向原創撰寫
    currentEvidenceStatus: curriculum-and-kg-grounded; publisher-fusion-review-pending
  learningGoals:
  - 用 P=W/t 或 P=E/t 比較不同裝置完成工作或轉換能量的快慢
  - 正確使用 W（瓦特）與 J/s，並由功率和時間反推能量
  - 分辨功率大不代表總耗能一定大；總能量還取決於運作時間
  prerequisites:
  - 已理解功與能量的焦耳單位
  - 能進行除法、乘法並讀取秒、分鐘等時間資料
  coreConcepts:
  - 功率描述單位時間內作功或轉換能量的多寡
  - 1 W = 1 J/s；同樣的功若用時較短，功率較大
  - 總能量可由功率×時間求得，因此高功率短時間與低功率長時間不能只看瓦數判斷總耗能
  misconceptions:
  - 把功率直接當成能量或電量
  - 認為瓦數較大的裝置無論使用多久一定比較耗能
  - 比較功率時只比做功量，忽略完成時間
  contentFlow:
  - 'hook: 兩人搬同樣重物上樓，做功相同但所需時間不同，誰的功率較大'
  - 'predict: 先預測固定做功量時，時間減半對功率的影響'
  - 'manipulate: 固定做功量改時間，或固定時間改做功量'
  - 'observe: 同步更新 W、t、P 算式與能量／時間圖'
  - 'explain: 用「每秒多少焦耳」而不是「總共多少焦耳」解釋功率'
  - 'transfer: 比較吹風機、電熱器或馬達的瓦數與使用時間'
  - 'exit-ticket: 判斷高功率裝置是否一定耗能較多'
  visualizations:
  - 功—時間—功率三欄表與 P=W/t 即時計算
  - 能量累積圖：相同功率不同時間及不同功率相同時間的總能量比較
  interactiveBlocks:
  - id: CUR-SCIENCE-CONTENT-BA-IV-6-I01
    component: EvidenceLabBlock
    purpose: 讓學生獨立調整做功量與時間，從每秒能量轉換量理解功率並避免把功率當總能量
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        workJ: 600
        timeS: 30
    studentActions:
    - 先預測固定 600 J 時把時間從 30 s 改成 15 s 的功率變化
    - 固定做功量只改時間，比較功率
    - 固定時間只改做功量，再比較功率
    - 最後用功率×時間比較兩裝置的總能量
    visualRules:
    - W、t 或 P 任一改變時，算式、單位與圖表同步更新
    - 功率欄明示 J/s，總能量欄明示 J，不得混用
    - 比較耗能時必須同時顯示功率與使用時間
    - 不以動畫速度單獨代表功率大小，必須有數值與文字
    misconceptionChecks:
    - id: MC-CUR-SCIENCE-CONTENT-BA-IV-6-I01
      trigger: 學生看到瓦數較大就直接判定總耗能較多，或把 W 當成 J
      prompt: 你比較的是「每秒轉換多少能量」還是「整段時間總共多少能量」？兩台裝置各用了多久？
      expectedEvidence: 能區分 W 與 J，並用 P×t 或 W/t 說明比較
    feedback:
      correct: 核對單位、時間與總能量，再換一組資料驗證。
      incorrect: 先提示把瓦特改寫成 J/s 並補上使用時間，不直接代算。
  teachingPatternRefs:
  - refId: phet-ild
    reuseDecision: inspiration-only
    application: 只借用先預測再操作的節奏；功、時間與能量資料均為本課自編。
  - refId: w3c-aria
    reuseDecision: inspiration-only
    application: 做功量、時間、功率及總能量皆有鍵盤操作與文字狀態。
  capTransfer:
    questionType: 表格判讀／計算／生活用電情境
    stemConstraint: 更換裝置或工作情境，但必須同時提供能量／功與時間才能比較功率或耗能
    requiredResponse: 寫出公式、代入量、單位與比較理由
    scoring: 公式與單位 1、計算 1、情境判讀 1
  exitTicket:
    prompt: 1200 W 吹風機用 5 分鐘與 600 W 裝置用 15 分鐘，能否只看瓦數就說前者耗能較多？為什麼？
    successCriteria:
    - 說明功率不是總能量
    - 指出必須比較使用時間
    - 能以 E=P×t 建立判斷方法
  expressionExtension:
    applicable: false
    task: 用表格比較兩個裝置的功率與總能量
    constraint: 學生先算；系統只給分層提示
  mobileA11y:
    breakpoints: [320, 375, 768]
    touchTargetMinPx: 44
    keyboardAlternative: true
    screenReader: 做功量、時間、功率與總能量均有名稱、數值與單位
    reducedMotion: 關閉動畫後仍可用表格與計算完成比較
  testCases:
  - 固定 600 J、時間減半時功率必須加倍，算式與文字同步更新。
  - 固定時間增加做功量時功率相應增加。
  - 顯示總能量比較時必須納入使用時間，不得只按瓦數排序。
  - 把 W 當 J 或忽略時間時必須命中迷思診斷。
  - mobile、keyboard、screen reader 與 fallback 可完成計算與比較。
  definitionOfDone:
  - 課綱 ID、KG ID、標題與官方 locator 一致
  - 互動實際控制 workJ 與 timeS，而非 primary／secondary 假變項
  - 功率與總能量迷思被實際診斷
  - 計算、transfer、exit ticket 與可及性流程可執行
  - 無 placeholder、TODO 或只換名詞模板
  status:
    designStatus: specified
    implementationStatus: implemented
    qaStatus: untested
