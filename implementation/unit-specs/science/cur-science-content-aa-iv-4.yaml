    currentEvidenceStatus: curriculum-and-kg-grounded; publisher-chapter-evidence-recorded; fusion-review-pending
  learningGoals:
  - 由原子序與週期表位置找出週期、族及可比較的元素
  - 從同族或同週期資料辨認性質規律，提出有條件的預測
  - 區分資料呈現的趨勢與「所有性質完全相同」等過度推論
  prerequisites:
  - 能由原子序在簡化週期表定位元素
  - 能閱讀表格與折線趨勢
  coreConcepts:
  - 週期表依原子序排列，週期性是性質隨位置呈現可重複的規律
  - 同族元素常有相近化學性質，但不代表所有物理與化學性質相同
  - 趨勢可用來預測未知元素，但預測需受資料範圍與實驗條件限制
  misconceptions:
  - 認為同族元素所有性質都相同
  - 認為原子量越大必定越活潑
  - 把資料中的趨勢當成沒有例外、無條件成立的定律
  contentFlow:
  - 'hook: 隱去一個元素資料，要求由鄰近與同族資料預測'
  - 'predict: 先選預測區間與理由'
  - 'manipulate: 切換同族／同週期比較並選擇性質欄位'
  - 'observe: 週期表位置、資料表與趨勢圖同步高亮'
  - 'explain: 指出支持趨勢的資料點與不能推出的性質'
  - 'transfer: 對新元素位置提出可檢驗預測'
  - 'exit-ticket: 寫一個有條件的週期性預測與限制'
  visualizations:
  - 簡化週期表與性質資料表同步選取
  - 趨勢圖顯示實際提供的資料點，不用平滑線暗示不存在的精確值
  interactiveBlocks:
  - id: CUR-SCIENCE-CONTENT-AA-IV-4-I01
    component: EvidenceLabBlock
    purpose: 讓學生選取同族或同週期元素，以實際資料辨認規律並預測被遮住的資料範圍
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        comparisonMode: group
        property: reactivity
    studentActions:
    - 先選擇同族或同週期比較並提交預測
    - 切換性質欄位，標記支持趨勢的至少兩個資料點
    - 揭開未知值後比較預測與資料
    - 說明趨勢能支持與不能支持的結論
    visualRules:
    - 週期表選取、資料列與圖上資料點同步
    - 缺值明示為未知，不以插值偽造測量
    - 顏色搭配族／週期文字標籤
    misconceptionChecks:
    - id: MC-CUR-SCIENCE-CONTENT-AA-IV-4-I01
      trigger: 因同族就宣稱所有性質相同，或由原子量單獨判定活性
      prompt: 請指出你使用的是哪一個性質欄位、哪些資料點，以及結論只適用在哪個比較範圍。
      expectedEvidence: 至少引用兩筆同一性質資料並保留趨勢限制
    feedback:
      correct: 肯定資料範圍與趨勢證據，再要求換另一性質檢查是否仍成立。
      incorrect: 提示只比較同一性質欄，不可用原子量代替反應資料。
