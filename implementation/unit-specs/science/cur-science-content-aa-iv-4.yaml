  capTransfer:
    questionType: 資料判讀／概念應用／理由短答
    stemConstraint: 換一個情境但保留「Aa-Ⅳ-4：元素性質週期性」的核心關係；不可只換名詞
    requiredResponse: 選答後必須指出證據或推理步驟
    scoring: 概念正確 1、證據對應 1、表達完整 1
  exitTicket:
    prompt: 今天的核心關係是什麼？若改變一個條件，哪個結果會跟著變，為什麼？
    successCriteria:
    - 提到本單元核心概念
    - 指出條件與結果
    - 使用一項證據或表徵
  expressionExtension:
    applicable: false
    task: 用 80～120 字／英文短段落，將「Aa-Ⅳ-4：元素性質週期性」的證據、因果或觀察說給同學聽
    constraint: 學生先寫；系統只給一階回饋，不直接代寫完整答案
  mobileA11y:
    breakpoints:
    - 320
    - 375
    - 768
    touchTargetMinPx: 44
    keyboardAlternative: true
    screenReader: 每個控制項有名稱、目前值、操作結果與錯誤回饋
    reducedMotion: 停用自動動畫仍可逐步操作
  testCases:
  - 載入「Aa-Ⅳ-4：元素性質週期性」時不得先顯示正解；學生必須先提交對「Aa-Ⅳ-4：元素性質週期性」的預測，且預測會被保留供後續比較。
  - 操作「evidence-lab：以「Aa-Ⅳ-4：元素性質週期性」作為唯一主題，至少同步呈現兩種表徵」中的主要變項後，與「表徵／證據與結論的對應」相關的圖、表、句構或因果鏈必須同步更新，文字狀態也要說明改變了什麼。
  - 學生觸發「把「Aa-Ⅳ-4：元素性質週期性」的相關變化誤認為因果，或忽略控制變因」時，系統必須命中本單元的 misconception check，要求學生指出可定位證據，並先給一階提示而非直接揭露答案。
  - 在 320px、375px 與 768px 寬度，以鍵盤完成「Aa-Ⅳ-4：元素性質週期性」的預測—操作—觀察—解釋流程時，核心題幹、控制項、回饋與可讀狀態不得溢位或遺失。
  - 以新資料執行「Aa-Ⅳ-4：元素性質週期性」的 CAP transfer：換一個情境但保留「Aa-Ⅳ-4：元素性質週期性」的核心關係；不可只換名詞；學生回答必須選答後必須指出證據或推理步驟，評分同時檢查概念、證據對應與表達完整度。
  - 外部資料失效時，EvidenceLabBlock 仍須以「Aa-Ⅳ-4：元素性質週期性」的文字與資料 fallback 完成預測、操作、觀察、解釋與 transfer，不得阻塞本課。
  definitionOfDone:
  - 課綱 ID、KG ID、標題與官方 locator 通過一致性檢查
  - 三版本章節級證據已補齊，或明確標記 pending，不得冒充完成
  - 至少一個互動操作能回答本單元明確學習問題
  - 至少一個迷思被實際誘發、診斷並以分層回饋處理
  - 會考 transfer、exit ticket 與表達延伸（適用時）可執行
  - mobile、keyboard、screen reader、reduced-motion 與 fallback 測試通過
  - 內容、教學法與版權審查通過；無 placeholder、TODO 或只換名詞模板
