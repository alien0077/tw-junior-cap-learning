unitImplementationSpec:
  specVersion: '1.0'
  lessonId: cur-science-content-ba
  knowledgeGraphIds:
  - kg-science-content-ba
  title: Ba：能量的形式與轉換
  subject: science
  socialDiscipline: null
  curriculumLevel: topic
  gradeRange:
  - '7'
  - '8'
  - '9'
  fusedScope:
    officialCurriculum: Ba：能量的形式與轉換
    curriculumIntent: Ba：能量的形式與轉換
    publisherEvidence:
      nani:
        status: pending
        required: true
      kanghsuan:
        status: pending
        required: true
      hanlin:
        status: pending
        required: true
    fusionRule: 只融合三版本共同概念與可核對差異；章節級證據雖已記錄，融合審查前不得聲稱已完成版本融合
    currentEvidenceStatus: curriculum-and-kg-grounded; publisher-chapter-evidence-recorded; fusion-review-pending
  learningGoals:
  - 以系統邊界追蹤能量輸入、轉換、儲存、輸出與傳到周圍的完整路徑
  - 比較力學、電池、化學反應與生命作用中的能量形式，建立跨情境的守恆觀念
  - 區分能量、功、功率與效率，避免把高功率、低效率或摩擦誤解成能量消失
  prerequisites:
  - 能閱讀簡單能量箭頭、數值表、速度／溫度／電壓資料
  - 能分辨系統內部變化與跨越系統邊界的能量傳遞
  coreConcepts:
  - 能量可改變形式、在物體間轉移或跨系統邊界傳遞；完整帳目遵守能量守恆
  - 系統邊界會影響能量被分類為內部轉換或跨界輸出，但不改變實際物理結果
  - 摩擦、電阻與散熱會把能量轉成內能、聲音等其他形式，不代表總能量消失
  - 功描述力造成的能量轉移；功率描述單位時間轉換能量的速率；效率需先定義有用輸出
  misconceptions:
  - 認為摩擦、發熱或裝置停止會把能量消滅
  - 把功率當總能量，或認為瓦數高就一定耗能多
  - 把效率低誤寫成違反能量守恆
  - 不界定系統邊界就直接比較輸入、輸出與損耗
  contentFlow:
  - 'hook: 以斜坡小車帶動發電機與燈，先畫輸入、輸出、損耗及系統邊界'
  - 'predict: 預測提高起始高度或摩擦後速度、電壓、溫度與光輸出如何改變'
  - 'manipulate: 固定其他條件，只改變高度、摩擦、負載或系統邊界之一'
  - 'observe: 同步更新速度、電壓、電流、溫度、時間與能量帳本'
  - 'explain: 以完整收支辨認重力位能、動能、電能、光能、熱與聲音的轉換'
  - 'compare: 將同一推理遷移到電池、光合作用／呼吸作用、吸放熱反應、作功與功率'
  - 'formalize: 分別整理守恆、功、功率與效率，說明它們彼此不同但可共同描述能量過程'
  - 'transfer: 以手機充電、抽水蓄能、保溫材料或家庭電器資料完成新情境判讀'
  - 'exit-ticket: 畫一個完整能量帳本並指出未量測或跨界能量'
  visualizations:
  - 能量邊界圖：可切換小車、軌道、發電機、燈與周圍是否納入系統
  - 能量帳本：重力位能、動能、電能、光／動能有用輸出、內能與聲音分欄呈現
  - 證據面板：高度、速度、電壓、電流、溫度與時間同步顯示，未量測項目不得自動當成零
  interactiveBlocks:
  - id: CUR-SCIENCE-CONTENT-BA-I01
    component: PhenomenonSimulationBlock
    purpose: 讓學生操作能量邊界模型，從斜坡小車到發電輸出建立可檢查的守恆帳本，再遷移到生命、化學與電池案例
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        startHeightCm: 20
        frictionLevel: low
        loadType: lamp
        systemBoundary: cart-generator-load
    studentActions:
    - 先畫系統邊界並預測能量輸入、主要輸出與至少一個其他輸出
    - 固定質量、軌道與負載，只改起始高度，比較速度及發電輸出
    - 回到基準只改摩擦，補列內能與聲音路徑
    - 切換燈／馬達負載，區分光、熱、動能等輸出形式
    - 最後把同一「輸入—轉換—輸出—限制」框架套用到電池或光合作用資料
    visualRules:
    - 改變高度、摩擦或負載時，速度、電壓／電流、溫度及能量帳本需同步更新
    - 切換系統邊界只能改變帳目分類與跨界箭頭，不能偷偷改變物理結果
    - 熱、聲音或未完整量測輸出必須標成估計／未量測，不可冒充精確零值
    - 電子流、能量流與物體運動需使用不同符號及文字標籤，不能只靠顏色
    misconceptionChecks:
    - id: MC-CUR-SCIENCE-CONTENT-BA-I01
      trigger: 把摩擦或裝置損耗寫成能量消失、把瓦數當總能量，或未界定系統邊界就計算效率
      prompt: 你的系統邊界包含哪些物體？未成為有用輸出的能量去哪裡？你比較的是總能量還是單位時間的轉換量？
      expectedEvidence: 能指出至少一條內能／聲音或跨界路徑，並正確區分守恆、功率與效率
    feedback:
      correct: 核對邊界、輸入輸出帳本與單位，再要求換到不同裝置驗證。
      incorrect: 先要求補列未量測路徑、時間或有用輸出定義，不直接代填完整帳本。
