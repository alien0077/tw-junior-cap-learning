unitImplementationSpec:
  specVersion: '1.0'
  lessonId: cur-science-content-bc-iv-4
  knowledgeGraphIds:
  - kg-science-content-bc-iv-4
  title: Bc-Ⅳ-4：影響光合作用的因素與探究
  subject: science
  socialDiscipline: null
  curriculumLevel: learning-content
  gradeRange:
  - '7'
  - '8'
  - '9'
  fusedScope:
    officialCurriculum: Bc-Ⅳ-4：影響光合作用的因素與探究
    curriculumIntent: 以單一變因、對照與重複量測探究光照、CO2、溫度等因素對光合作用速率的影響，並由曲線平台辨認限制因子
    publisherEvidence:
      nani:
        status: pending
        required: true
      kanghsuan:
        status: pending
        required: true
      hanlin:
        status: pending
        required: true
    fusionRule: 只融合三版本共同概念與可核對差異；章節級證據雖已記錄，融合審查前不得聲稱已完成版本融合
    currentEvidenceStatus: curriculum-and-kg-grounded; lesson-unit-specific; publisher-chapter-evidence-recorded; fusion-review-pending
  learningGoals:
  - 將光強、CO2 濃度、溫度、水分等因素轉成可測問題，正確指定自變因、應變因與控制變因
  - 由速率—因素曲線辨認上升區、平台或下降區，說明限制因子會隨條件改變
  - 評估水草氣泡、溶氧量或澱粉等指標的適用範圍，不把單一代理指標當成所有植物的精確光合作用速率
  prerequisites:
  - 已理解光合作用的原料、產物與必要條件
  - 能讀取折線圖、比較斜率或平台並辨認控制實驗
  coreConcepts:
  - 公平探究需一次只改變一項主要因素，其他條件保持一致，並有重複量測或適當對照
  - 提高某一因素只在它是限制因子時能明顯提高速率；曲線平台表示另一因素可能成為限制
  - 溫度對生物反應常有適宜範圍，過高或過低都可能降低速率，不能用「越高越快」概括
  misconceptions:
  - 同時改變光強與 CO2 後仍把速率差全部歸因於其中一項
  - 認為光越強、CO2 越多或溫度越高，光合作用速率就必定無限增加
  - 直接比較不同大小、健康狀態或不同時間的植物，忽略葉片量、溫度、時間等控制條件
  contentFlow:
  - 'hook: 給一條隨光強增加後進入平台的速率曲線，先問為何再加光仍沒有明顯增加'
  - 'predict: 選定只改變光強、CO2 或溫度之一，先預測曲線形狀'
  - 'manipulate: 鎖定葉片／水草量、溫度、時間等控制條件，只調整一個主要因素'
  - 'observe: 同步更新速率曲線、重複量測點、平均值與控制變因表'
  - 'explain: 指出上升、平台或下降區的資料證據，提出下一個可能限制因子'
  - 'formalize: 建立限制因子、適宜範圍與公平實驗概念'
  - 'transfer: 用溫室管理、水草光源距離與 CO2 補充資料判斷最合理的後續測試'
  - 'exit-ticket: 找出一個不公平實驗並改成只改一項因素的設計'
  visualizations:
  - 因素—速率曲線：光強、CO2、溫度模式分開顯示，避免把三種關係硬畫成同一形狀
  - 變因鎖定表：自變因、應變因與至少三個控制變因清楚標示目前值
  - 重複量測點與平均值：保留變異，不用單一完美曲線掩蓋資料離散
  interactiveBlocks:
  - id: CUR-SCIENCE-CONTENT-BC-IV-4-I01
    component: PhenomenonSimulationBlock
    purpose: 讓學生設計單一變因的光合作用探究，從速率曲線的平台或下降區辨認限制因子與適宜範圍
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        factor: light-intensity
        lightLevel: medium
        carbonDioxideLevel: medium
        temperatureC: 25
        sampleAmount: fixed
    studentActions:
    - 先選一個主要因素並預測其與速率的可能關係，不顯示正解
    - 鎖定 sampleAmount、測量時間及其餘環境條件，只改變所選因素
    - 執行至少三個條件與重複量測，標記曲線上升、平台或下降的資料點
    - 當曲線進入平台時，切換另一因素測試是否為新的限制因子
    - 用「控制了什麼 → 改變什麼 → 量到什麼 → 能得出什麼」說明結論
    visualRules:
    - 一次只能有一個主要自變因解鎖，其他條件在介面及 aria 摘要中明示固定
    - light／CO2 可呈現平台，temperature 可呈現適宜範圍後下降；不得全部用無限線性增加
    - 氣泡數等代理指標需有測量限制提示，不能標成精確的所有植物總光合作用率
    - 重複量測保留合理變異，不能把每次資料強制成相同數值
    misconceptionChecks:
    - id: MC-CUR-SCIENCE-CONTENT-BC-IV-4-I01
      trigger: 學生同時改兩個因素、把平台解讀為「因素完全沒有作用」，或宣稱因素越多越高速率必無限增加
      prompt: 目前到底只改了哪一個因素？平台前後哪兩筆資料支持你的判斷？若平台出現，下一步應固定原因素再測哪個可能限制條件？
      expectedEvidence: 能指出單一自變因、控制條件與平台資料，並提出合理的下一限制因子測試
    feedback:
      correct: 核對公平比較與曲線區段，再要求設計下一個限制因子測試。
      incorrect: 先鎖回其他變因並提示比較相鄰資料點，不直接告知限制因子答案。
  teachingPatternRefs:
  - refId: phet-ild
    reuseDecision: inspiration-only
    application: 本課只借用先預測、單變因操作和證據修正模型節奏；曲線與資料均為本課自編。
  - refId: phet-activity
    reuseDecision: inspiration-only
    application: 本課以水草、溫室與限制因子作原創探究，不複製外部活動數據。
  - refId: w3c-aria
    reuseDecision: inspiration-only
    application: 因素、控制值、重複量測、曲線區段與回饋皆提供鍵盤操作及文字狀態。
  - refId: w3c-landmarks
    reuseDecision: inspiration-only
    application: 預測、變因控制、曲線、資料與回饋區域可導覽。
  capTransfer:
    questionType: 探究設計／限制因子曲線／資料判讀
    stemConstraint: 更換為水草、溫室或葉片實驗，必須要求辨認變因與曲線平台／下降區，不能只背「影響因素名稱」
    requiredResponse: 指出自變因、應變因與至少兩個控制變因，引用曲線資料，再提出一項下一步可測的限制因子
    scoring: 變因設計正確 1、資料判讀正確 1、限制因子推論與後續測試合理 1
  exitTicket:
    prompt: 某水草實驗把燈從 20 cm 移到 10 cm，同時把水溫由 20°C 升到 30°C，結果氣泡數增加。這能否證明「光變強造成增加」？請指出問題並改寫成公平比較。
    successCriteria:
    - 指出同時改變光照與溫度，無法把結果只歸因於光照
    - 提出固定溫度、材料量、時間等條件，只改光強／距離的比較
    - 說明氣泡數是代理指標，應重複量測並保留其限制
  expressionExtension:
    applicable: false
    task: 用 80～120 字說明為什麼光合作用曲線出現平台時，不能直接說「再增加光完全沒有作用」，並提出一個下一步探究
    constraint: 學生先寫；系統只提示平台、限制因子與控制變因，不直接代寫完整答案
  mobileA11y:
    breakpoints:
    - 320
    - 375
    - 768
    touchTargetMinPx: 44
    keyboardAlternative: true
    screenReader: 因素、控制條件、量測點、平均值、曲線區段與回饋皆有可讀文字狀態
    reducedMotion: 停用動畫仍可用資料表與逐點曲線完成探究
  testCases:
  - 未提交因素—速率預測前不得顯示完整限制因子解說。
  - 解鎖 lightLevel 時 carbonDioxideLevel、temperatureC 與 sampleAmount 維持固定；其他模式亦同。
  - 光強／CO2 模式可出現平台，溫度模式需可出現適宜範圍及高溫下降。
  - 學生同時改兩因素時必須阻止因果結論並提示恢復公平比較。
  - 重複量測資料保留離散並可計算／比較平均，不得只顯示單次結果。
  - 320／375／768px 與鍵盤操作下，變因表、曲線、重複資料與回饋不得裁切。
  - fallback 至少保留光強、CO2、溫度三組靜態曲線與一題修正實驗設計題。
  definitionOfDone:
  - 課綱 ID、KG ID、標題與官方 locator 通過一致性檢查
  - 互動實際操作光、CO2 或溫度因素，不含 primary／secondary 假變項
  - 至少診斷一次同時改多因素、平台誤解或無限增加迷思
  - CAP transfer、exit ticket、mobile、keyboard、screen reader、reduced-motion 與 fallback 可執行
  - 內容與教學法無 placeholder、TODO 或只換名詞模板
  status:
    designStatus: specified
    implementationStatus: implemented
    qaStatus: untested
