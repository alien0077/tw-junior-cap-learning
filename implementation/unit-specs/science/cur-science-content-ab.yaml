unitImplementationSpec:
  specVersion: '1.0'
  lessonId: cur-science-content-ab
  knowledgeGraphIds:
  - kg-science-content-ab
  title: Ab：物質的形態、性質及分類
  subject: science
  socialDiscipline: null
  curriculumLevel: topic
  gradeRange:
  - '7'
  - '8'
  - '9'
  fusedScope:
    officialCurriculum: Ab：物質的形態、性質及分類
    curriculumIntent: Ab：物質的形態、性質及分類
    publisherEvidence:
      nani:
        status: pending
        required: true
      kanghsuan:
        status: pending
        required: true
      hanlin:
        status: pending
        required: true
    fusionRule: 只融合三版本共同概念與可核對差異；章節級證據雖已記錄，融合審查前不得聲稱已完成版本融合
    currentEvidenceStatus: curriculum-and-kg-grounded; publisher-chapter-evidence-recorded; fusion-review-pending
  learningGoals:
  - 以粒子排列、間距與運動解釋固態、液態、氣態的宏觀差異，並說明模型限制
  - 由溫度—時間資料判讀升溫、相變與冷卻區段，區分溫度與能量轉移
  - 用物理／化學性質、固定組成與分離證據區分純物質、混合物及物理／化學變化
  prerequisites:
  - 能讀簡單粒子圖、溫度曲線與性質資料表
  - 能區分直接觀察、模型解釋與分類結論
  coreConcepts:
  - 三態差異主要來自同種粒子的排列、間距與運動，不代表粒子種類改變
  - 相變時可持續有能量轉移而溫度暫時近似不變；溫度與熱量不是同一物理量
  - 物理／化學性質要依是否需生成新物質來判斷；純物質與混合物要看物質種類與組成固定性
  - 混合物的分離利用成分物性差異，物理分離不會把成分變成另一種物質
  misconceptions:
  - 認為氣體粒子本身膨脹、固體粒子完全不動，或物態改變會生成另一種粒子
  - 認為持續加熱必定持續升溫，或相變平台代表沒有能量轉移
  - 以透明、均勻、顏色等外觀直接判定純物質或物質種類
  - 把可燃性與燃燒、熔點與熔化混為同一層次，或把任何分離都當成化學變化
  contentFlow:
  - 'hook: 以冰、水、水蒸氣與鹽水提出「外觀相似能否直接分類」問題'
  - 'station-1: 三態粒子模型，固定粒子種類與數量，只比較排列、間距、運動與可壓縮性'
  - 'station-2: 溫度—時間曲線，判讀升溫與相變平台並連到狀態比例'
  - 'station-3: 性質證據，區分物理／化學性質及性質／變化事件'
  - 'station-4: 組成與分離，判斷純物質／混合物並選合理物理分離方法'
  - 'explain: 每站都填寫「觀察—模型／判準—限制」'
  - 'transfer: 以空氣、礦泉水、鐵硫樣品與生活標籤進行跨站判讀'
  - 'exit-ticket: 用一張因果圖串起三態、相變、性質與分類'
  visualizations:
  - 四站證據工作台：粒子模型、溫度曲線、性質卡與組成／分離表同步保留文字證據
  - 所有粒子圖均明示「模型示意、非真實比例」，顏色不得作唯一資訊
  interactiveBlocks:
  - id: CUR-SCIENCE-CONTENT-AB-I01
    component: EvidenceLabBlock
    purpose: 讓學生在三態、相變、性質與組成四站中一次只改一項條件，建立從觀察到分類的完整證據鏈
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        station: particle-state
        sample: water
        state: liquid
        temperatureC: 25
        componentCount: 1
    studentActions:
    - 先選一站並提交預測，正解揭露前保留原始預測
    - 三態站只切換物態或容器體積；相變站只移動時間游標或切換加熱／冷卻
    - 性質站逐項開啟密度、導電、溶解、可燃性或反應性資料
    - 組成站改變成分數或比例，再依題目提供的物性選過濾、蒸餾、磁選等方法
    - 每次操作後寫「我改變什麼 → 看到什麼 → 這支持什麼 → 還不能推出什麼」
    visualRules:
    - 切換物態不得改變粒子種類；調整容器體積時不可把粒子本身畫大或畫小
    - 相變平台必須顯示仍有能量轉移，且溫度與能量單位不可混用
    - 性質卡需同時呈現測試方式、觀察與分類理由；危險化學測試只用資料／模擬，不給實作指令
    - 分離結果只能根據已提供的物性差異；過濾不可被畫成能分離均勻溶液中的已溶解溶質
    misconceptionChecks:
    - id: MC-CUR-SCIENCE-CONTENT-AB-I01
      trigger: 以外觀直接分類、把相變平台當無吸熱、把粒子大小變化當物態原因，或混淆物理分離與化學分解
      prompt: 請指出你使用的是哪一站的哪一項證據，並分開寫直接觀察、模型／判準與結論限制。
      expectedEvidence: 至少引用粒子、曲線、性質或組成／分離中的一項可定位資料，且結論不超出證據範圍
    feedback:
      correct: 指出學生證據鏈中觀察與判準的對應，再換另一站驗證。
      incorrect: 先要求回到單一控制變因與原始資料，不直接揭露分類答案。
