    currentEvidenceStatus: curriculum-and-kg-grounded; publisher-chapter-evidence-recorded; fusion-review-pending
  learningGoals:
  - 以可觀察證據說明「Db-Ⅳ-6：植物維管束的運輸功能」的核心現象
  - 控制變因並解讀模型或資料
  - 用證據推理回答陌生情境題
  prerequisites:
  - 能讀懂本單元使用的基本符號、圖表或短文本
  - 能依提示完成一次預測、操作、觀察、解釋循環
  coreConcepts:
  - Db-Ⅳ-6：植物維管束的運輸功能
  - 表徵／證據與結論的對應
  - 錯誤答案所反映的概念差異
  misconceptions:
  - 把「Db-Ⅳ-6：植物維管束的運輸功能」的相關變化誤認為因果，或忽略控制變因
  - 把記憶答案當成理解證據
  - 忽略題幹中的限制條件或單位
  contentFlow:
  - 'hook: 以單元真實問題引起預測'
  - 'activate-prerequisite: 顯示先備檢核並允許補救'
  - 'visualize: 用 evidence-lab 建立可觀察表徵'
  - 'predict: 學生先提交預測且答案暫不揭露'
  - 'manipulate: 改變一個變項或標記一段證據'
  - 'observe: 同步更新圖、表、句構或因果鏈'
  - 'explain: 學生用一句話說明觀察到的關係'
  - 'formalize: 再顯示本單元正式語言與記法'
  - 'transfer: 進入會考型新資料題'
  - 'exit-ticket: 一題理由題加一個自我診斷'
  visualizations:
  - evidence-lab：以「Db-Ⅳ-6：植物維管束的運輸功能」作為唯一主題，至少同步呈現兩種表徵
  - 每次變更都保留因果可追溯的標記、圖例與文字替代
  interactiveBlocks:
  - id: CUR-SCIENCE-CONTENT-DB-IV-6-I01
    component: SystemRelationshipBlock
    purpose: 讓學生分開操作木質部水路與韌皮部來源—需求路徑，辨認「Db-Ⅳ-6：植物維管束的運輸功能」中兩種運輸不能混成固定箭頭
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        transpiration: 3
        source: leaf
        sink: fruit
    studentActions:
    - 先預測水與無機鹽、糖各應使用哪一組織及方向
    - 用按鈕選擇有機養分來源（成熟葉或儲存器官）與需求端（根、嫩梢或果實）
    - 用鍵盤可操作的滑桿切換蒸散概念情境（較弱至較強）
    - 以短句分別說明觀察、推論及單一染色／環剝證據的限制
    visualRules:
    - 選擇來源或需求端後，韌皮部文字路徑必須同步更新
    - 木質部水／無機鹽根至葉方向和韌皮部路徑分開呈現
    - 蒸散滑桿只改變定性情境標籤，不得偽裝成實測水量或流速
    - 顏色不可單獨承擔意義，必須搭配組織名稱與文字方向
    - 窄螢幕不得裁切操作鈕、路徑或證據限制
    misconceptionChecks:
    - id: MC-CUR-SCIENCE-CONTENT-DB-IV-6-I01
      trigger: 把「Db-Ⅳ-6：植物維管束的運輸功能」的相關變化誤認為因果，或忽略控制變因
      prompt: 請指出哪一個證據支持你的判斷。
      expectedEvidence: 至少一個可定位的視覺、文字、數據或時間證據
    feedback:
      correct: 指出學生使用的證據，並要求用新情境再驗證一次。
      incorrect: 先指出錯誤位於概念、證據或操作哪一層；提供一階提示，不直接代答；重試後才顯示局部示範。
