unitImplementationSpec:
  specVersion: '1.0'
  lessonId: cur-science-content-a
  knowledgeGraphIds:
  - kg-science-content-a
  title: A：物質的組成與特性
  subject: science
  socialDiscipline: null
  curriculumLevel: theme
  gradeRange:
  - '7'
  - '8'
  - '9'
  fusedScope:
    officialCurriculum: A：物質的組成與特性
    curriculumIntent: A：物質的組成與特性
    publisherEvidence:
      nani:
        status: pending
        required: true
      kanghsuan:
        status: pending
        required: true
      hanlin:
        status: pending
        required: true
    fusionRule: 只融合三版本共同概念與可核對差異；章節級證據雖已記錄，融合審查前不得聲稱已完成版本融合
    currentEvidenceStatus: curriculum-and-kg-grounded; publisher-chapter-evidence-recorded; fusion-review-pending
  learningGoals:
  - 以組成資訊與可重現性質共同辨認物質，不以顏色或外觀單獨下結論
  - 在原子序、粒子模型、化學式與週期表之間轉譯，區分直接觀察與模型推論
  - 控制溶劑體積、溫度與樣品質量等條件，比較溶解、導電或其他性質並說明證據限制
  prerequisites:
  - 能讀懂本單元使用的基本符號、圖表或短文本
  - 能依提示完成一次預測、操作、觀察、解釋循環
  coreConcepts:
  - 物質的組成與性質必須以多項可重現證據交叉判讀
  - 原子序決定元素身分；電子數改變可形成離子但不單獨改變元素種類
  - 化學式下標表示單一粒子或最簡比例的組成，係數表示粒子數量
  - 週期表提供有條件的性質趨勢線索，不能取代實際測量
  misconceptions:
  - 看到相同顏色或外觀就判定是同一物質
  - 把電子數改變誤認為元素種類改變，或混淆化學式下標與係數
  - 由單一導電、溶解或週期表位置直接推定物質全部性質
  contentFlow:
  - 'hook: 三份外觀相似的未知固體，先判斷現有證據能否辨認物質'
  - 'model-literacy: 分開記錄直接觀察、組成表徵與模型推論'
  - 'predict: 先預測哪一項性質最能排除候選物，不先揭露答案'
  - 'manipulate: 固定樣品質量、溶劑體積與溫度，一次開啟一項溶解或導電證據'
  - 'observe: 同步更新候選物、粒子示意與證據表，保留被排除理由'
  - 'explain: 以組成＋性質兩類證據說明目前能判定與不能判定的範圍'
  - 'formalize: 連回原子序、化學式下標／係數與週期表的正式表示'
  - 'transfer: 以陌生材料標示與測量資料重新辨認物質'
  - 'exit-ticket: 寫出一項直接證據、一項推論與一項仍缺資料'
  visualizations:
  - 未知物質比較台：同步呈現樣品卡、粒子／化學式組成與性質證據表
  - 開啟溶解或導電證據後，候選物清單與排除理由同步更新；不得用顏色單獨表示結果
  - 每次操作保留控制條件、目前證據與文字替代，讓學生可回溯判斷
  interactiveBlocks:
  - id: CUR-SCIENCE-CONTENT-A-I01
    component: ParticleModelBlock
    purpose: 讓學生一次只加入一項組成或性質證據，觀察候選物如何被排除，建立「外觀不足、證據交叉判讀」的物質辨認方法
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        evidenceStage: 0
        sampleMass: 1
    studentActions:
    - 先提交預測，不顯示正解
    - 以滑桿、按鈕、鍵盤或點選方式改變一個條件
    - 標記支持結論的圖形、資料、詞語或事件
    - 以短句說明「改變什麼 → 看到什麼 → 所以什麼」
    visualRules:
    - 操作後所有相關表徵同步更新，不得只改單一數字
    - 正解揭露前保留學生預測與操作紀錄
    - 顏色不可單獨承擔意義，必須搭配標籤、符號或文字
    - 窄螢幕不得裁切核心圖、題幹與回饋
    misconceptionChecks:
    - id: MC-CUR-SCIENCE-CONTENT-A-I01
      trigger: 只憑三份樣品外觀相似就判定為同一物質，或在比較溶解性時同時改變樣品質量、溫度與溶劑量
      prompt: 請指出目前真正可用的證據，並說明哪個控制條件必須固定後才能比較。
      expectedEvidence: 能指出外觀證據不足，並至少固定樣品質量、溶劑體積或溫度中的必要條件
    feedback:
      correct: 指出學生使用的證據，並要求用新情境再驗證一次。
      incorrect: 先指出錯誤位於概念、證據或操作哪一層；提供一階提示，不直接代答；重試後才顯示局部示範。
