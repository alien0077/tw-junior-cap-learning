unitImplementationSpec:
  specVersion: '1.0'
  lessonId: cur-science-content-ba-iv-1
  knowledgeGraphIds:
  - kg-science-content-ba-iv-1
  title: Ba-Ⅳ-1：能量形式、轉換與守恆
  subject: science
  socialDiscipline: null
  curriculumLevel: learning-content
  gradeRange:
  - '7'
  - '8'
  - '9'
  fusedScope:
    officialCurriculum: Ba-Ⅳ-1：能量形式、轉換與守恆
    curriculumIntent: 以系統邊界、能量形式與收支證據解釋轉換與守恆
    publisherEvidence:
      nani:
        status: pending
        required: true
      kanghsuan:
        status: pending
        required: true
      hanlin:
        status: pending
        required: true
    fusionRule: 只融合可核對概念與教學方向；未完成三版本章節融合前不得標成正式融合完成
    currentEvidenceStatus: curriculum-and-kg-grounded; lesson-unit-specific; publisher-fusion-review-pending
  learningGoals:
  - 界定系統邊界，辨認動能、位能、化學能、電能、光能與內能等形式及其轉換
  - 以輸入、輸出與儲存改變建立能量收支，解釋摩擦、發熱或聲音不是能量消失
  - 區分能量守恆與效率：守恆描述總收支，效率需先指定有用輸出
  prerequisites:
  - 能讀懂簡單能量箭頭、柱狀圖與數值表
  - 能區分研究系統內部變化與跨邊界傳遞
  coreConcepts:
  - 能量可在不同形式間轉換，也可跨系統邊界傳遞；完整收支遵守能量守恆
  - 系統邊界不同，同一筆熱或功可被描述為內部轉換或跨邊界傳遞
  - 摩擦常使機械能轉成內能並伴隨聲音；未直接量到不等於能量消失
  misconceptions:
  - 認為摩擦把能量消滅，或看到速度降低就判定總能量減少
  - 把能量守恆誤解為每一種能量形式各自保持不變
  - 把高效率與能量守恆視為同義，忽略有用輸出的定義
  contentFlow:
  - 'hook: 小車由斜坡滑下，先畫高度、速度、溫度與聲音的能量箭頭並界定系統'
  - 'predict: 預測同高度下增加摩擦會如何改變末速度、內能與聲音'
  - 'manipulate: 固定質量與起點高度，只切換摩擦大小或系統邊界'
  - 'observe: 同步更新速度、溫度、能量柱與跨邊界箭頭'
  - 'explain: 用收支表補列熱與聲音，檢查能量是否真的消失'
  - 'formalize: 由完整收支建立能量守恆，再另行定義有用輸出與效率'
  - 'transfer: 手機充電、腳踏車煞車與電池燈泡的能量路徑'
  - 'exit-ticket: 畫出一個完整收支並指出至少一個不易直接量測的路徑'
  visualizations:
  - 系統邊界圖：小車、地球、軌道可切換納入或排除，跨界能量以箭頭標示
  - 能量帳本：重力位能、動能、內能、聲能及輸出總量同步顯示，不以缺測資料冒充零
  interactiveBlocks:
  - id: CUR-SCIENCE-CONTENT-BA-IV-1-I01
    component: PhenomenonSimulationBlock
    purpose: 讓學生以同一斜坡小車比較摩擦與系統邊界，從能量帳本驗證轉換與守恆
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        startHeightM: 1.0
        frictionLevel: low
        systemBoundary: cart-earth-track
    studentActions:
    - 先預測增加摩擦後末速度、軌道溫度與總能量收支
    - 固定質量與起點高度，只改變摩擦大小
    - 切換系統邊界，觀察同一熱量在收支表中的位置如何改變
    - 標記支持守恆的速度、溫度與能量帳本證據
    - 用「哪種形式減少 → 哪種形式增加／傳出」完成解釋
    visualRules:
    - 摩擦改變時速度、內能與聲音指標必須同步更新，總帳不得憑空增減
    - 系統邊界改變只能改變能量分類與跨界箭頭，不得偷偷改變物理結果
    - 未量測的聲能或散熱明示為估計／未完整量測，不偽造精確值
    - 顏色不可單獨承擔意義，所有能量形式皆有文字與符號標籤
    misconceptionChecks:
    - id: MC-CUR-SCIENCE-CONTENT-BA-IV-1-I01
      trigger: 學生把摩擦造成的速度降低寫成能量消失，或把效率當守恆
      prompt: 速度降低後，哪些能量形式增加或跨出系統？你的系統邊界包含軌道嗎？
      expectedEvidence: 能指出內能／聲能或跨邊界熱，並以完整收支說明總量沒有憑空消失
    feedback:
      correct: 核對系統邊界、各形式增減與總收支，再要求換一個生活裝置驗證。
      incorrect: 先要求補列熱、聲音或跨界路徑，不直接揭露完整能量圖。
  teachingPatternRefs:
  - refId: phet-ild
    reuseDecision: inspiration-only
    application: 本課只借用先預測再操作的節奏；數據、能量帳本與系統邊界均為本課自編。
  - refId: w3c-aria
    reuseDecision: inspiration-only
    application: 摩擦、邊界與能量帳本變更皆提供鍵盤操作與文字狀態更新。
  capTransfer:
    questionType: 資料判讀／能量圖／理由短答
    stemConstraint: 更換裝置但仍需界定系統、追蹤能量形式及補列未直接觀察的輸出
    requiredResponse: 選答後指出至少兩項收支證據與系統邊界
    scoring: 概念正確 1、收支證據 1、邊界與限制 1
  exitTicket:
    prompt: 腳踏車煞車後速度下降且煞車片升溫。請界定系統並用能量收支說明為何不是能量消失。
    successCriteria:
    - 指出原有動能減少
    - 指出煞車片／輪胎等內能增加及可能聲能
    - 清楚交代系統邊界與跨界傳遞
  expressionExtension:
    applicable: false
    task: 用能量箭頭與 80～120 字說明一個生活裝置的能量收支
    constraint: 學生先寫；系統只給分層提示
  mobileA11y:
    breakpoints:
    - 320
    - 375
    - 768
    touchTargetMinPx: 44
    keyboardAlternative: true
    screenReader: 每個控制項有名稱、目前值、收支結果與錯誤回饋
    reducedMotion: 停用動畫仍能以數值與文字比較前後狀態
  testCases:
  - 未提交摩擦影響預測前不得顯示完整守恆解說。
  - 增加摩擦時末速度下降、內能增加，能量帳本與文字摘要同步更新。
  - 切換系統邊界時物理狀態不變，只改變跨界／內部轉換的分類。
  - 把摩擦誤寫成能量消失時，必須命中迷思診斷並要求補列熱或聲音。
  - 320／375／768px 與鍵盤操作下，邊界控制、能量帳本及回饋不得裁切。
  - fallback 狀態至少保留靜態收支表、文字邊界選擇與可重試題目。
  definitionOfDone:
  - 課綱 ID、KG ID、標題與官方 locator 一致
  - 互動能真正操作摩擦與系統邊界並回答守恆問題
  - 至少一個能量消失迷思被誘發、診斷與回饋
  - transfer、exit ticket、mobile、keyboard、screen reader 與 fallback 可執行
  - 無 placeholder、primary／secondary 假變項或只換名詞模板
  status:
    designStatus: specified
    implementationStatus: implemented
    qaStatus: untested
