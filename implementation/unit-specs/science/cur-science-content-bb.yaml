    currentEvidenceStatus: curriculum-and-kg-grounded; publisher-chapter-evidence-recorded; fusion-review-pending
  learningGoals:
  - 由溫差判斷自發熱傳方向，區分溫度、熱量與熱平衡
  - 以 Q＝mcΔT 連結熱量、質量、比熱與溫度變化，並正確處理 cal、kcal、J 等單位
  - 依介質與物質運動區分傳導、對流、輻射，並用資料判讀熱膨脹、相變與水的特殊行為
  prerequisites:
  - 能閱讀溫度—時間圖、簡單比例與基本單位
  - 能區分直接觀察、能量傳遞與模型解釋
  coreConcepts:
  - 有溫差時淨熱傳遞由高溫處朝低溫處，直到接近熱平衡；熱是因溫差造成的能量傳遞
  - Q＝mcΔT 適用於無相變且比熱可近似固定的情境；質量、比熱、溫差共同決定熱量
  - 傳導、對流、輻射可在同一設備同時存在，判斷需依接觸、流體整體移動與是否可跨真空等證據
  - 多數材料同一物態下有熱膨脹，但材料差異、相變與水在 0～4°C 的特殊性必須另行判讀
  misconceptions:
  - 認為「冷」會由低溫處流向高溫處，或把高溫直接等同含有較多熱量
  - 把 cal、J 與 °C 混成同一物理量，或忽略 m、c、ΔT 就比較吸熱量
  - 認為太陽熱需要空氣傳遞、固體會產生對流，或一個情境只能有一種傳熱方式
  - 認為受熱是粒子本身變大，或把一般熱脹冷縮規則無條件套用到水的 0～4°C 區間
  contentFlow:
  - 'hook: 熱飲與室溫湯匙接觸，先畫熱流方向並分開寫溫度與熱量'
  - 'predict: 在固定條件下預測質量、比熱或溫差改變對所需熱量與升溫的影響'
  - 'manipulate: 一次只改初溫、材料、質量、隔熱、流動或遮蔽其中一項'
  - 'observe: 同步更新溫度曲線、Q＝mcΔT 帳本、熱流箭頭與傳熱路徑'
  - 'explain: 以高低溫、控制變因、材料性質及介質／流動證據支持結論'
  - 'compare: 分辨升溫、相變平台與同物態熱膨脹，另以水 0～10°C 資料檢查例外'
  - 'transfer: 保溫杯、煮水壺、太陽照射、橋梁伸縮縫與食品熱量標示'
  - 'exit-ticket: 用一組溫度與熱量資料完成方向、計算、傳熱機制和限制判讀'
  visualizations:
  - 熱流與雙溫度曲線：顯示兩物體溫差及接近平衡的時間變化
  - 熱量帳本：m、c、ΔT、Q 與 cal/J 雙單位同步顯示，明示相變時單一 Q＝mcΔT 不足
  - 傳熱路徑圖：接觸傳導、流體對流、隔空輻射可同時標記主要／次要機制
  - 材料尺寸／密度圖：同物態熱膨脹與水 0～4°C 特殊區間分開呈現
  interactiveBlocks:
  - id: CUR-SCIENCE-CONTENT-BB-I01
    component: EvidenceLabBlock
    purpose: 讓學生以同一熱學工作台追蹤熱流方向、Q＝mcΔT、傳熱機制與受熱後尺寸／狀態變化，建立可檢查的證據鏈
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        hotTempC: 80
        coldTempC: 20
        massG: 100
        material: water
        pathway: contact
    studentActions:
    - 先依兩端初溫提交熱流方向與溫度變化預測
    - 固定材料與環境，只改質量或目標溫差，用 Q＝mcΔT 比較熱量
    - 切換接觸、流體循環與隔空情境，標記支持傳導／對流／輻射的證據
    - 切換材料與溫度區間，比較同物態熱膨脹；水模式另檢查 0～4°C 特殊趨勢
    - 每一步都寫「改變條件 → 觀察資料 → 熱學判斷 → 適用限制」
    visualRules:
    - 熱流方向只依當下高低溫決定；隔熱只能改變速率，無外加功不得反轉自發熱流
    - °C 只作溫度／溫差單位，cal、kcal、J 只作能量單位，換算前後物理量須等價
    - 對流必須有可流動介質與整體流動證據；輻射在真空仍可存在
    - 熱膨脹不得以粒子本身變大表示；相變與水 0～4°C 模式必須明示其特殊條件
    misconceptionChecks:
    - id: MC-CUR-SCIENCE-CONTENT-BB-I01
      trigger: 畫出低溫到高溫的自發熱流、混淆 °C 與能量單位、錯認傳熱機制，或把粒子本身畫成受熱膨脹
      prompt: 請先指出目前比較的物理量與控制條件，再引用一筆溫度、熱量、流動或尺寸資料支持你的判斷。
      expectedEvidence: 能正確指出熱流方向、相關單位／公式或傳熱證據，且結論不超出材料與溫度條件
    feedback:
      correct: 核對物理量、控制條件與證據，再要求換一個生活情境驗證。
      incorrect: 先要求辨認高低溫、單位或介質／流動條件，不直接提供完整答案。
