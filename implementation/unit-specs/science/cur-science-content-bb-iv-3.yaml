unitImplementationSpec:
  specVersion: '1.0'
  lessonId: cur-science-content-bb-iv-3
  knowledgeGraphIds:
  - kg-science-content-bb-iv-3
  title: Bb-Ⅳ-3：比熱與溫度變化
  subject: science
  socialDiscipline: null
  curriculumLevel: learning-content
  gradeRange:
  - '7'
  - '8'
  - '9'
  fusedScope:
    officialCurriculum: Bb-Ⅳ-3：比熱與溫度變化
    curriculumIntent: 以 Q＝mcΔT 與受熱資料比較比熱、質量、熱量和溫度變化，並說明模型適用限制
    publisherEvidence:
      nani:
        status: pending
        required: true
      kanghsuan:
        status: pending
        required: true
      hanlin:
        status: pending
        required: true
    fusionRule: 只融合三版本共同概念與可核對差異；章節級證據雖已記錄，融合審查前不得聲稱已完成版本融合
    currentEvidenceStatus: curriculum-and-kg-grounded; lesson-unit-specific; publisher-chapter-evidence-recorded; fusion-review-pending
  learningGoals:
  - 說明比熱是單位質量物質升高單位溫度所需熱量的材料特性，不把它當成物體含有的總熱量
  - 以 Q＝mcΔT 比較在 Q、m 或 c 固定時另一變因如何影響 ΔT，並用比例關係回查答案
  - 由相同供熱條件下水與金屬、不同質量樣品的溫升資料推論比熱差異，並指出散熱、容器吸熱與相變限制
  prerequisites:
  - 已理解熱量單位與 Q＝mcΔT 中 Q、m、c、ΔT 的基本意義
  - 能閱讀溫度—時間表格或折線圖並進行比例比較
  coreConcepts:
  - 比熱 c 描述材料單位質量升高單位溫度所需的熱量；在 Q 與 m 相同時，c 越大，理想 ΔT 越小
  - 同一材料在 Q 固定時，質量越大，理想 ΔT 越小；不能只看最後溫度判斷比熱
  - 實驗推論比熱時必須控制質量、輸入熱量、初始條件和量測時間，並處理散熱與容器吸熱
  misconceptions:
  - 認為升溫較快或最後溫度較高的材料比熱一定較大
  - 把比熱當成樣品的總熱量，忽略比熱是材料性質而總能量還受質量與溫差影響
  - 比較兩材料時同時改變質量或供熱時間，仍直接把溫升差歸因於比熱
  contentFlow:
  - 'hook: 相同質量的水與金屬接受相同理想熱量，先預測哪一個溫升較大並說理由'
  - 'predict: 固定 Q 與 m，先預測 c 加倍時 ΔT 如何改變'
  - 'manipulate: 每次只改材料比熱、樣品質量或輸入熱量中的一項'
  - 'observe: 同步更新 Q＝mcΔT 帳本、溫度—時間曲線與比例提示'
  - 'explain: 用控制條件和至少兩筆數據說明比熱與溫升的反向關係'
  - 'formalize: 建立 c＝Q/(mΔT) 的意義及 Q＝mcΔT 的適用條件'
  - 'transfer: 以海陸受熱、熱水袋、鍋具材料或未知樣品資料判讀'
  - 'exit-ticket: 由同熱量、同質量資料比較兩材料比熱並指出一項實驗限制'
  visualizations:
  - 變因鎖定表：Q、m、c、ΔT 四欄顯示目前固定與改變的量，避免同時改兩項仍做因果推論
  - 雙材料溫度—時間曲線：共用座標尺度，標示相同供熱與質量條件
  - 比例帳本：顯示 c 或 m 改變後 ΔT 的理想比例，不以觸感或顏色代替數據
  interactiveBlocks:
  - id: CUR-SCIENCE-CONTENT-BB-IV-3-I01
    component: EvidenceLabBlock
    purpose: 讓學生在固定其他條件下改變比熱、質量或輸入熱量，從 Q＝mcΔT 與溫升曲線建立可檢查的比熱模型
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        heatInputJ: 840
        massG: 100
        specificHeatJPerG_C: 4.2
    studentActions:
    - 先預測同 Q、同 m 下把 c 改成一半時 ΔT 如何變化
    - 鎖定兩個量，只改 heatInputJ、massG 或 specificHeatJPerG_C 其中一項
    - 比較水樣與自編金屬樣的理想溫升，標記支持判斷的 Q、m、c、ΔT 數據
    - 切換到實測模式後辨認容器吸熱或散熱造成的偏差，不把偏差直接歸因於比熱改變
    - 用比例句「Q、m 固定時，c 越大 → ΔT 越小」完成解釋
    visualRules:
    - 每次只能指定一個主要比較變因；其他被鎖定的量需在畫面與文字摘要明示
    - 任一變因改變後公式帳本、ΔT、曲線終點與可及性摘要同步更新
    - 不把「導熱快」或「摸起來冷」當成比熱大小的直接視覺編碼
    - 相變情境需阻止直接使用單一 Q＝mcΔT 解釋全部能量
    misconceptionChecks:
    - id: MC-CUR-SCIENCE-CONTENT-BB-IV-3-I01
      trigger: 學生以升溫較快判定比熱較大，或比較時忽略質量／輸入熱量不同
      prompt: 你比較的兩組 Q 和 m 是否相同？在 Q、m 固定時，哪一個 c 對應較小的 ΔT？請引用數值。
      expectedEvidence: 明確確認控制條件並引用 Q、m、c、ΔT，得出比熱較大時理想溫升較小
    feedback:
      correct: 核對控制條件與比例，再要求把質量改變一次驗證模型。
      incorrect: 先要求鎖定 Q、m 並比較 ΔT，不直接告知哪個材料比熱較大。
  teachingPatternRefs:
  - refId: phet-ild
    reuseDecision: inspiration-only
    application: 本課只借用先預測、單變因操作和證據修正節奏；材料資料與公式帳本均為本課自編。
  - refId: phet-activity
    reuseDecision: inspiration-only
    application: 本課以水、金屬與質量變化作原創比較，不複製外部活動數據。
  - refId: w3c-aria
    reuseDecision: inspiration-only
    application: Q、m、c、ΔT 的鎖定狀態、目前值與結果皆有鍵盤操作及文字公告。
  - refId: w3c-landmarks
    reuseDecision: inspiration-only
    application: 預測、變因控制、曲線、公式帳本與回饋分區可導覽。
  capTransfer:
    questionType: 比熱資料判讀／比例推理／理由短答
    stemConstraint: 更換海陸、熱水袋、鍋具或未知樣品情境；必須提供可控制 Q、m、ΔT 的資料，不能只以生活印象猜比熱
    requiredResponse: 指出被控制與被比較的變因，引用至少兩筆資料，再以 Q＝mcΔT 或比例關係判定
    scoring: 控制變因正確 1、數據／公式推理正確 1、限制說明完整 1
  exitTicket:
    prompt: 兩個 100 g 樣品各吸收 840 J，樣品甲升高 2°C，樣品乙升高 4°C。哪個樣品比熱較大？請用 Q＝mcΔT 或比例關係說明；再寫一個實驗中會讓理想推論偏離的因素。
    successCriteria:
    - 判定甲比熱較大，因在相同 Q、m 下其 ΔT 較小
    - 能用 c＝Q/(mΔT) 或等價比例說明，而非只看材料名稱
    - 指出散熱、容器吸熱、供熱不均或量測誤差之一
  expressionExtension:
    applicable: false
    task: 用 80～120 字說明「為什麼海水和陸地接受相近能量時溫度變化可以不同」，並明確區分比熱、質量與散熱條件
    constraint: 學生先寫；系統只提示 Q、m、c、ΔT 與控制條件，不直接代寫完整答案
  mobileA11y:
    breakpoints:
    - 320
    - 375
    - 768
    touchTargetMinPx: 44
    keyboardAlternative: true
    screenReader: Q、m、c、ΔT、鎖定變因、曲線趨勢與限制皆有可讀文字狀態
    reducedMotion: 停用動畫仍可用數值表與逐步曲線資料完成比較
  testCases:
  - 未提交 c 對 ΔT 的預測前不得顯示完整解說。
  - 固定 Q、m 時 c 加倍，理想 ΔT 應減半；固定 Q、c 時 m 加倍亦應使 ΔT 減半。
  - 改變主要比較變因時，其他鎖定量不得偷偷改變。
  - 學生以升溫較快判定比熱較大時命中迷思診斷並要求檢查 Q、m。
  - 實測模式須清楚區分模型預測與散熱／容器吸熱造成的差異。
  - 相變情境不可繼續把所有 Q 解釋為 mcΔT。
  - 320／375／768px 與鍵盤操作下，變因鎖定、公式、曲線與回饋不得裁切。
  - fallback 至少保留三組 Q/m/c/ΔT 靜態資料，可完成預測—比較—解釋—transfer。
  definitionOfDone:
  - 課綱 ID、KG ID、標題與官方 locator 通過一致性檢查
  - 互動實際操作 Q、m、c 並同步呈現 ΔT，不含 primary／secondary 假變項
  - 至少診斷一次「升溫快＝比熱大」或忽略控制變因的迷思
  - CAP transfer、exit ticket、mobile、keyboard、screen reader、reduced-motion 與 fallback 可執行
  - 內容與教學法無 placeholder、TODO 或只換名詞模板
  status:
    designStatus: specified
