unitImplementationSpec:
  specVersion: '1.0'
  lessonId: cur-science-content-ba-iv-5
  knowledgeGraphIds:
  - kg-science-content-ba-iv-5
  title: Ba-Ⅳ-5：力作功與能量改變
  subject: science
  socialDiscipline: null
  curriculumLevel: learning-content
  gradeRange: ['7', '8', '9']
  fusedScope:
    officialCurriculum: Ba-Ⅳ-5：力作功與能量改變
    curriculumIntent: 由力與位移的關係判斷作功，並連結作功與物體能量改變
    publisherEvidence:
      nani: {status: pending, required: true}
      kanghsuan: {status: pending, required: true}
      hanlin: {status: pending, required: true}
    fusionRule: 未完成三版本章節融合前，只以官方課綱、KG 與可核對公開方向原創撰寫
    currentEvidenceStatus: curriculum-and-kg-grounded; publisher-fusion-review-pending
  learningGoals:
  - 在力與位移同方向的國中情境中用 W=F×s 計算作功並正確使用焦耳
  - 判斷有施力但沒有位移，或力與位移垂直時，該力不對物體作功
  - 由正作功造成的動能或位能改變，建立作功是能量轉移／改變的量化描述
  prerequisites:
  - 能讀取力、位移與方向資訊
  - 能進行乘法並辨認 N、m、J 等單位
  coreConcepts:
  - 作功同時需要力與沿該力方向的位移；施力本身不等於作功
  - 在力與位移同方向時 W=F×s，單位 J=N·m
  - 外力對物體作功可改變其動能、重力位能或其他能量形式
  misconceptions:
  - 認為只要很用力或很累就一定有物理學上的作功
  - 忽略位移方向，把垂直於運動方向的支持力也直接代入 F×s
  - 把功與功率混淆，認為做功較多就一定功率較大
  contentFlow:
  - 'hook: 推牆、提著書水平走、抬高書本三情境先判斷是否作功'
  - 'predict: 先標出力與位移方向再決定是否可用 F×s'
  - 'manipulate: 固定方向，單獨改變力或位移，比較功的變化'
  - 'observe: 同步更新向量箭頭、W=F×s 算式與物體能量變化'
  - 'explain: 用位移方向證明某個力有作功或沒有作功'
  - 'transfer: 推車、爬樓梯與水平搬物等陌生情境'
  - 'exit-ticket: 判斷一個有施力但不作功的例子並說明理由'
  visualizations:
  - 力與位移雙箭頭圖，清楚標示同向、反向或垂直關係
  - 作功計算卡：力、沿力方向位移、乘積及 J 單位同步呈現
  interactiveBlocks:
  - id: CUR-SCIENCE-CONTENT-BA-IV-5-I01
    component: PhenomenonSimulationBlock
    purpose: 讓學生先判斷力與位移方向，再調整力或位移量，觀察作功與能量改變
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        forceN: 20
        displacementM: 2
        directionRelation: same
    studentActions:
    - 先標出力與位移箭頭並預測是否作功
    - 固定位移只改變力，或固定力只改變位移
    - 切換同向／垂直情境，比較同一個力是否作功
    - 用算式與能量變化說明結果
    visualRules:
    - 只有沿力方向的位移可進入本單元簡化 W=F×s 計算
    - 切換垂直情境時不得仍顯示 F×s 為該力所作的功
    - 算式、單位與能量變化必須同步更新
    - 箭頭方向須有文字標籤，不只靠顏色
    misconceptionChecks:
    - id: MC-CUR-SCIENCE-CONTENT-BA-IV-5-I01
      trigger: 學生只因有施力就判定有作功，或把垂直力直接代入 F×s
      prompt: 物體是否沿這個力的方向產生位移？請先畫出兩個方向再計算。
      expectedEvidence: 能指出沿力方向的位移，並在無位移或垂直情況判定該力不作功
    feedback:
      correct: 核對方向、算式與能量改變，再換情境驗證。
      incorrect: 先提示比較力箭頭與位移箭頭，不直接給數值答案。
  teachingPatternRefs:
  - refId: phet-ild
    reuseDecision: inspiration-only
    application: 只借用預測—操作—證據節奏；力、位移與功的資料均為本課自編。
  - refId: w3c-aria
    reuseDecision: inspiration-only
    application: 力、位移、方向與計算結果提供鍵盤操作和文字摘要。
  capTransfer:
    questionType: 圖像判讀／計算／理由短答
    stemConstraint: 更換施力與移動情境，但需先判斷方向再決定是否可計算作功
    requiredResponse: 指出力、位移方向、算式與單位
    scoring: 方向判讀 1、計算 1、能量解釋 1
  exitTicket:
    prompt: 手提書包等速水平走一段路，手對書包的主要向上支持力是否對書包作功？請用方向說明。
    successCriteria:
    - 指出支持力向上而位移水平
    - 說明兩者垂直，因此該向上力不作功
    - 不以主觀疲勞程度作判準
  expressionExtension:
    applicable: false
    task: 畫出力與位移箭頭並以短句判斷是否作功
    constraint: 學生先寫；系統只給分層提示
  mobileA11y:
    breakpoints: [320, 375, 768]
    touchTargetMinPx: 44
    keyboardAlternative: true
    screenReader: 力、位移、方向關係與作功結果皆有文字狀態
    reducedMotion: 關閉動畫後仍能用向量圖與數值表完成比較
  testCases:
  - 未標示方向前不得直接顯示完整答案。
  - 同向情境改變力或位移時 W=F×s 與能量變化同步更新。
  - 垂直情境不得把 F×s 當作該力所作的功。
  - 只因「很用力」判定有作功時必須命中迷思診斷。
  - mobile、keyboard、screen reader 與 fallback 均可完成方向判讀及計算。
  definitionOfDone:
  - 課綱 ID、KG ID、標題與官方 locator 一致
  - 互動實際控制力、位移與方向，而非 primary／secondary 假變項
  - 施力不等於作功的迷思被實際診斷
  - 計算、transfer、exit ticket 與可及性流程可執行
  - 無 placeholder、TODO 或只換名詞模板
  status:
    designStatus: specified
    implementationStatus: implemented
    qaStatus: untested
  sourceRefs:
  - url: https://www.naer.edu.tw/upload/1/16/doc/820/%E5%8D%81%E4%BA%8C%E5%B9%B4%E5%9C%8B%E6%B0%91%E5%9F%BA%E6%9C%AC%E6%95%99%E8%82%B2%E8%AA%B2%E7%A8%8B%E7%B6%B1%E8%A6%81%E5%9C%8B%E6%B0%91%E4%B8%AD%E5%B0%8F%E5%AD%B8%E6%9A%A8%E6%99%AE%E9%80%9A%E5%9E%8B%E9%AB%98%E7%B4%9A%E4%B8%AD%E7%AD%89%E5%AD%B8%E6%A0%A1-%E8%87%AA%E7%84%B6%E7%A7%91%E5%AD%B8%E9%A0%98%E5%9F%9F.pdf
    locator: 正文第 22～30 頁／PDF 第 26～34 頁；主題 B、次主題 Ba；官方代碼 Ba-Ⅳ-5
    role: official-curriculum-source-of-truth
