unitImplementationSpec:
  specVersion: '1.0'
  lessonId: cur-science-content-bd-iv-2
  knowledgeGraphIds:
  - kg-science-content-bd-iv-2
  title: Bd-Ⅳ-2：碳在生物與非生物間循環
  subject: science
  socialDiscipline: null
  curriculumLevel: learning-content
  gradeRange:
  - '7'
  - '8'
  - '9'
  fusedScope:
    officialCurriculum: Bd-Ⅳ-2：碳在生物與非生物間循環
    curriculumIntent: 以碳庫、通量與時間尺度追蹤碳在大氣、生物、土壤、水與岩石間的轉移，並用收支資料判斷碳庫淨變化
    publisherEvidence:
      nani:
        status: pending
        required: true
      kanghsuan:
        status: pending
        required: true
      hanlin:
        status: pending
        required: true
    fusionRule: 只融合三版本共同概念與可核對差異；章節級證據雖已記錄，融合審查前不得聲稱已完成版本融合
    currentEvidenceStatus: curriculum-and-kg-grounded; lesson-unit-specific; publisher-chapter-evidence-recorded; fusion-review-pending
  learningGoals:
  - 說明光合作用、呼吸、分解、燃燒、海氣交換與沉積如何使碳在生物與非生物碳庫間轉移
  - 區分碳庫存量與單位時間通量，利用流入減流出的收支判斷某碳庫是淨增加、淨減少或近似平衡
  - 比較短期生物碳循環與較長期地質儲存，並用資料說明化石燃料燃燒如何增加由長期碳庫流向大氣的通量
  prerequisites:
  - 已理解光合作用、細胞呼吸與食物鏈的基本物質轉移
  - 能讀取箭頭圖、庫存量與每年通量等不同單位資料
  coreConcepts:
  - 碳原子不會在循環中憑空消失；它在不同碳庫間因生物、化學與地質過程轉移
  - 碳庫大小是某時點的存量，通量是單位時間內的轉移量，兩者單位不同不能直接相加比較
  - 某碳庫的淨變化取決於所有主要流入與流出通量；單看一條吸收或排放路徑不足以判定總收支
  misconceptions:
  - 把光合作用吸收 CO2 說成「碳消失」，或把呼吸／燃燒說成創造新的碳原子
  - 把碳庫的總量與每年通量混為一談，看到大庫就認為它一定交換最快
  - 只看植樹吸收或單一排放來源就宣稱某區域必定淨減碳／淨增碳，忽略其他流入與流出
  contentFlow:
  - 'hook: 給大氣、森林、土壤三個碳庫與數條年度通量，先判斷森林碳庫是增是減'
  - 'predict: 先選一個過程（光合作用、呼吸、分解、燃燒）預測碳箭頭起點與終點'
  - 'manipulate: 調整光合作用、呼吸／分解或燃燒通量其中一項，保持其他值不變'
  - 'observe: 同步更新碳庫收支表、箭頭粗細與淨變化數值'
  - 'explain: 用流入總和減流出總和說明碳庫增減，並區分存量與通量'
  - 'formalize: 建立碳庫、通量、淨收支與短／長時間尺度概念'
  - 'transfer: 森林火災、城市交通、海氣交換或土壤分解資料的碳收支判讀'
  - 'exit-ticket: 修正一張把碳庫大小當作通量的錯誤圖並計算一個簡單淨收支'
  visualizations:
  - 碳庫—通量圖：大氣、生物、土壤、海洋、岩石／化石燃料分區，箭頭標明過程與單位時間通量
  - 收支表：每個碳庫分列流入、流出與淨變化，庫存量使用不同欄位與單位
  - 時間尺度切換：短期生物交換與長期沉積／化石燃料路徑分層顯示，不暗示所有路徑同速
  interactiveBlocks:
  - id: CUR-SCIENCE-CONTENT-BD-IV-2-I01
    component: SystemRelationshipBlock
    purpose: 讓學生操作碳通量並用收支表判斷碳庫淨變化，區分碳庫存量、通量與能量流動
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        photosynthesisFlux: 120
        respirationDecompositionFlux: 110
        fossilFuelFlux: 10
        unit: model-carbon-per-year
    studentActions:
    - 先判斷光合作用、呼吸／分解、燃燒三條碳箭頭的方向，不顯示正解
    - 固定其他路徑，只改一項通量，觀察大氣與生物碳庫淨變化
    - 依收支表計算至少一個碳庫的「流入總和－流出總和」
    - 切換庫存量與通量視圖，說明為何兩者不能直接用數值大小比較
    - 將前一單元能量圖與碳循環圖並列，指出碳可循環但能量不會沿同一路徑封閉循環
    visualRules:
    - 通量調整後，來源庫減少方向、目的庫增加方向、收支表與文字摘要同步更新
    - 庫存量與通量必須使用不同欄位與單位標記，不得混成一個總數
    - 所有數值標示為教學模型資料，不冒充全球實測最新值
    - 能量比較圖只用於概念對照，不將碳的循環箭頭複製成能量循環
    misconceptionChecks:
    - id: MC-CUR-SCIENCE-CONTENT-BD-IV-2-I01
      trigger: 學生把碳說成消失／生成、混淆庫存量與通量，或只看單一吸收路徑判斷淨收支
      prompt: 這個數值是「庫裡有多少」還是「每年轉移多少」？此碳庫還有哪些流入與流出？請用流入總和減流出總和重新判斷。
      expectedEvidence: 能正確辨認單位與箭頭，並至少列出一個完整碳庫收支
    feedback:
      correct: 核對庫存／通量與收支，再要求換一個人類活動情境驗證。
      incorrect: 先提示查看單位與所有箭頭，不直接告知淨增減答案。
  teachingPatternRefs:
  - refId: phet-ild
    reuseDecision: inspiration-only
    application: 本課只借用先預測、操作通量與資料修正模型的節奏；碳庫與收支數據均為本課自編。
  - refId: phet-activity
    reuseDecision: inspiration-only
    application: 本課以森林、城市、海洋與土壤情境作原創碳收支遷移，不複製外部數據。
  - refId: w3c-aria
    reuseDecision: inspiration-only
    application: 碳庫、通量、收支、單位與箭頭方向皆提供鍵盤操作及文字狀態。
  - refId: w3c-landmarks
    reuseDecision: inspiration-only
    application: 預測、通量控制、收支表、時間尺度與回饋區域可導覽。
  capTransfer:
    questionType: 碳庫收支／箭頭圖／理由短答
    stemConstraint: 更換為森林、城市、農田或海洋情境，至少提供兩條流入與兩條流出或清楚的庫存／通量單位，不能只背碳循環名詞
    requiredResponse: 指出至少兩條碳轉移路徑、正確區分庫存與通量，並用收支判斷淨變化
    scoring: 路徑方向正確 1、庫存／通量區分正確 1、淨收支推理正確 1
  exitTicket:
    prompt: 某森林一年由光合作用固定 120 單位碳，植物與土壤呼吸／分解共釋放 105 單位，另因火災釋放 10 單位。只看這三項時，森林生物／土壤碳庫的簡化淨變化是多少？為什麼不能把「森林目前存有 5000 單位碳」直接加進這個年度收支？
    successCriteria:
    - 算出簡化淨變化為 +5 單位／年
    - 說明 5000 是庫存量而前三者是單位時間通量，量綱不同不能直接相加
    - 指出真實碳收支可能還有未列出的其他流入／流出，因此結論只限於題目所給路徑
  expressionExtension:
    applicable: false
    task: 用 80～120 字比較「碳循環」和「能量流動」，並說明為什麼化石燃料燃燒是在改變碳通量而不是創造碳元素
    constraint: 學生先寫；系統只提示碳庫、通量、能量散失與收支，不直接代寫完整答案
  mobileA11y:
    breakpoints:
    - 320
    - 375
    - 768
    touchTargetMinPx: 44
    keyboardAlternative: true
    screenReader: 碳庫、每條通量、收支結果、單位與限制皆有可讀文字狀態
    reducedMotion: 停用動畫仍可用靜態箭頭與收支表完成判讀
  testCases:
  - 未提交碳箭頭方向預測前不得顯示完整循環解說。
  - 單獨調整 photosynthesisFlux、respirationDecompositionFlux 或 fossilFuelFlux 時相關碳庫與收支同步更新。
  - 庫存量與通量視圖必須使用不同單位標示，不能讓使用者直接相加。
  - 學生只看單一路徑判斷碳庫淨變化時命中迷思診斷並要求列完整收支。
  - 能量對照圖不得畫成隨碳一同循環回生產者或太陽。
  - 320／375／768px 與鍵盤操作下，碳庫圖、控制項、收支表與回饋不得裁切。
  - fallback 至少保留一組碳庫／通量資料表與兩題收支判讀，可完成預測—證據—解釋—transfer。
  definitionOfDone:
  - 課綱 ID、KG ID、標題與官方 locator 通過一致性檢查
  - 互動實際操作碳通量與收支，不含 primary／secondary 假變項
  - 至少診斷一次碳消失、庫存／通量或單一路徑淨收支迷思
  - CAP transfer、exit ticket、mobile、keyboard、screen reader、reduced-motion 與 fallback 可執行
  - 內容與教學法無 placeholder、TODO 或只換名詞模板
  status:
    designStatus: specified
    implementationStatus: implemented
    qaStatus: untested
