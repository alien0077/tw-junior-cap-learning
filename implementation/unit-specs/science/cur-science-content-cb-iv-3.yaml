    currentEvidenceStatus: curriculum-and-kg-grounded; publisher-chapter-evidence-recorded; fusion-review-pending
  learningGoals:
  - 從 C₂H₆O 等分子式讀出元素種類與原子數，並說明分子式本身不能完整表示原子連接方式
  - 建立乙醇 CH₃CH₂OH 與二甲醚 CH₃OCH₃ 的連接模型，確認兩者原子清單相同但連接關係不同
  - 區分真正不同的連接結構與同一模型的旋轉、翻轉或不同畫法，避免把視角差異誤判成不同物質
  - 用沸點、互溶性或其他可重現物性作為結構差異的支持證據，同時保留單一物性不足以唯一鑑定的限制
  prerequisites:
  - 能由分子式計數 C、H、O 等元素的原子數
  - 能閱讀簡單結構簡式與球棒／連線模型，知道連線代表原子間的連接關係
  coreConcepts:
  - 相同分子式表示元素種類與各元素原子數相同，不代表原子一定以相同方式連接
  - 同分異構物具有相同分子式但不同原子連接或空間排列，因此可以是性質不同的不同物質
  - 單純旋轉、翻轉或改變畫面方向而未改變連接關係，仍代表同一結構，不會產生新的同分異構物
  - 結構式補充分子式未表達的連接資訊；—OH、C—O—C 等結構部位可成為解釋部分物性差異的線索
  - 物性資料可支持結構模型，但單一沸點或單一觀察通常不足以直接證明唯一分子結構
  misconceptions:
  - 認為分子式相同就一定是同一物質
  - 只要模型方向或畫法不同就判成不同同分異構物
  - 把分子式中文字書寫順序直接當作真實鍵結順序
  - 只憑一項物性差異或相同，就宣稱已唯一鑑定結構
  contentFlow:
  - 'hook: 顯示兩瓶分子式都為 C₂H₆O、但沸點與互溶性資料不同的未知物，先問「分子式相同是否一定同物質」'
  - 'inventory: 將 C₂H₆O 拆成 2 C、6 H、1 O 的固定原子清單，所有候選模型都必須使用同一清單'
  - 'predict: 在看到完整結構前，預測「改連接」和「只旋轉模型」哪一種會產生不同物質'
  - 'build: 使用固定原子清單建立 C—C—O 與 C—O—C 兩種連接骨架，再補足氫原子'
  - 'compare-connectivity: 以鄰接關係表逐原子比較，不以畫面位置或左右方向判斷是否相同'
  - 'property-evidence: 對照沸點、互溶性等資料，判斷哪些差異可支持結構不同，哪些仍只是待驗線索'
  - 'model-limit: 說明結構簡式與球棒模型是表徵，無法單靠一張模型圖直接量得沸點或安全性'
  - 'transfer: 對另一組相同分子式模型判斷是同一結構重畫、真正不同連接，或資料仍不足'
  - 'exit-ticket: 以乙醇與二甲醚說明「同分子式、不同連接、不同物質」並指出一項證據限制'
  visualizations:
  - 原子清單固定顯示 C×2、H×6、O×1，建立每個模型時同步核對元素與原子總數
  - 結構比較板以「原子鄰接關係」而非畫面座標比較模型，旋轉後連接不變者標示為同一結構
  - 性質資料表與結構模型分欄呈現，明確區分實測資料與模型推論
  interactiveBlocks:
  - id: CUR-SCIENCE-CONTENT-CB-IV-3-I01
    component: ParticleModelBlock
    purpose: 讓學生在固定 C₂H₆O 原子清單下建立、旋轉與比較結構，辨認真正不同的原子連接，並用物性資料檢查結構—性質推論
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        molecularFormula: C2H6O
        structurePreset: hidden
        displayMode: connectivity
    studentActions:
    - 先計數 C₂H₆O 的元素種類與原子數，再提交「相同分子式是否保證同一物質」的預測
    - 用固定原子清單建立 C—C—O 與 C—O—C 骨架，系統同步檢查每個原子是否使用一次且價鍵配置合理
    - 旋轉或翻轉模型，觀察鄰接關係不變時仍判為同一結構
    - 對照乙醇與二甲醚的定性物性資料，標記「支持不同結構」與「仍不足以唯一證明」的證據
    - 在新模型組合中先比原子清單，再比連接關係，最後才使用物性資料
    visualRules:
    - 不允許為了形成第二種模型而增加或刪除 C、H、O 原子；兩候選必須維持 C₂H₆O
    - 模型旋轉、翻轉或整體平移不得自動被判為新結構；判定以鄰接關係為準
    - 分子式、結構簡式與球棒模型同步呈現，但明示三者提供的資訊層級不同
    - 物性欄標示為資料證據，不由模型操作自動偽造測量值
    - 元素以文字標籤搭配形狀／顏色，不可只靠顏色識別
    misconceptionChecks:
    - id: MC-CB-IV-3-SAME-FORMULA
      trigger: 看到兩個模型都為 C₂H₆O 就直接判為同一物質
      prompt: 分子式只核對了哪些資訊？請再比較氧原子分別連接到哪些原子。
      expectedEvidence: 指出原子總數相同，但一種具有 C—C—O／O—H 連接，另一種具有 C—O—C 連接
    - id: MC-CB-IV-3-ROTATION
      trigger: 把同一結構旋轉、翻轉或換畫法後誤判為新的同分異構物
      prompt: 忽略畫面方向後，每個原子的鄰居是否改變？若沒有，為何不是新的結構？
      expectedEvidence: 連接關係不變即為同一結構的不同視角／畫法
    - id: MC-CB-IV-3-FORMULA-ORDER
      trigger: 只因化學式中文字順序不同就宣稱原子連接不同
      prompt: 哪一種表示法真正提供原子相鄰與連接資訊？請用結構式或鄰接表回答。
      expectedEvidence: 分子式只給組成；結構式／模型才提供連接資訊
    - id: MC-CB-IV-3-SINGLE-PROPERTY
      trigger: 只靠一個沸點或一項物性就聲稱已唯一證明分子結構
      prompt: 這項資料支持哪個模型？是否仍可能有其他結構或實驗誤差能產生相似結果？
      expectedEvidence: 將物性視為支持／排除證據，而非單獨的唯一身分證明
    feedback:
      correct: 指出學生核對了原子清單、連接關係與哪一項物性證據，再要求說出一項仍需額外資料確認的限制。
      incorrect: 依「只看分子式、把旋轉當新結構、把書寫順序當鍵結、單一物性過度推論」提供一階提示，不直接顯示完整結構答案。
  teachingPatternRefs:
  - refId: phet-ild
    reuseDecision: inspiration-only
    application: "本課只吸收先預測、再操作模型、再用證據修正的流程；C₂H₆O 模型、資料與文字均由本課自行設計。"
  - refId: phet-activity
    reuseDecision: inspiration-only
    application: "互動以原子清單、鄰接關係與性質資料建立可檢查證據，不複製外部模擬畫面或活動腳本。"
  - refId: w3c-aria
    reuseDecision: inspiration-only
    application: "每個原子、連接操作、原子清單與結構判定都有可鍵盤操作與螢幕閱讀器文字描述。"
  - refId: w3c-landmarks
    reuseDecision: inspiration-only
    application: "原子清單、結構建模、連接比較、性質證據與 transfer 分區導覽。"
  capTransfer:
    questionType: 分子式—結構模型判讀／證據限制短答
    stemConstraint: 提供一組相同分子式的兩個模型與一至兩項性質資料，其中可能包含只是旋轉重畫的同一結構；不得直接重用乙醇／二甲醚題幹
    requiredResponse: 先核對原子清單，再比較鄰接關係，判斷是否真正不同結構；最後引用性質資料並說明其證據限制
    scoring: 分子式／原子清單正確 1、連接關係判斷正確 1、性質證據與限制完整 1
  exitTicket:
    prompt: 乙醇 CH₃CH₂OH 與二甲醚 CH₃OCH₃ 都可寫成 C₂H₆O。請說明它們為何仍可視為不同物質，並指出一項可支持差異但不能單獨完成唯一鑑定的物性資料。
    successCriteria:
    - 說出兩者分子式與原子清單相同
    - 指出氧原子的連接關係不同，而不是只說畫法不同
    - 引用沸點、互溶性等可重現資料並說明單一物性仍有證據限制
  expressionExtension:
    applicable: false
    task: 用 80～120 字向同學解釋「分子式相同不一定是同一物質」，至少比較一次分子式資訊與結構式資訊。
    constraint: 學生先寫；系統只給一階回饋，不直接代寫完整答案
  mobileA11y:
    breakpoints:
    - 320
    - 375
    - 768
    touchTargetMinPx: 44
    keyboardAlternative: true
    screenReader: 原子清單、目前連接、旋轉前後鄰接關係、性質資料與判定結果都有等價文字
    reducedMotion: 停用旋轉動畫後仍可用「旋轉前／後鄰接關係不變」的文字狀態完成判斷
  testCases:
  - 初始 C₂H₆O 原子清單固定為 C×2、H×6、O×1；未提交預測前不得顯示乙醇／二甲醚名稱答案。
  - 建立 C—C—O 與 C—O—C 骨架時，兩者原子總數都必須維持 C₂H₆O，不能用新增／刪除原子製造差異。
  - 旋轉或翻轉同一模型後，鄰接表不變且系統判定為同一結構；不得只依畫面座標判新物質。
  - 將同分子式直接判為同一物質時命中 SAME-FORMULA 診斷，要求比較氧原子鄰居。
  - 只改分子式書寫順序但連接未變時命中 FORMULA-ORDER 診斷，不得顯示為新同分異構物。
  - 性質資料只能更新證據欄，不得反向改寫模型原子清單或偽造結構。
  - CAP transfer 必須先評原子清單與連接關係，再評性質資料；不能只看最終選項。
  - 320px、375px、768px 下以鍵盤完成選原子、建立連接、旋轉比較與查看性質資料時，焦點與文字狀態均保留且不溢位。
  - 外部資源失效時，ParticleModelBlock 仍由本地 lesson/spec 的原子清單、結構資料與文字 fallback 完成預測、比較、解釋與 transfer。
  definitionOfDone:
  - 課綱 ID、KG ID、標題與官方 locator 通過一致性檢查
  - 三版本章節級證據已補齊，或明確標記 pending，不得冒充完成
  - 至少一個互動操作能回答本單元明確學習問題
  - 至少一個迷思被實際誘發、診斷並以分層回饋處理
  - 會考 transfer、exit ticket 與表達延伸（適用時）可執行
  - mobile、keyboard、screen reader、reduced-motion 與 fallback 測試通過
  - 內容、教學法與版權審查通過；無 placeholder、TODO 或只換名詞模板
