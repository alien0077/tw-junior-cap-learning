  - '9'
  fusedScope:
    officialCurriculum: Cb-Ⅳ-3：原子排列與同分子式的不同物質
    curriculumIntent: 分子式只描述元素種類與原子數；原子連接方式不同時，即使分子式相同也可能形成不同物質並呈現不同性質。
