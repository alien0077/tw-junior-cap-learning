unitImplementationSpec:
  specVersion: '1.0'
  lessonId: cur-science-content-ca-iv-2
  knowledgeGraphIds:
  - kg-science-content-ca-iv-2
  title: Ca-Ⅳ-2：以化學性質鑑定化合物
  subject: science
  socialDiscipline: null
  curriculumLevel: learning-content
  gradeRange:
  - '7'
  - '8'
  - '9'
  fusedScope:
    officialCurriculum: Ca-Ⅳ-2：以化學性質鑑定化合物
    curriculumIntent: 以可檢驗的化學性質鑑定候選化合物；本課用未知溶液及其產氣反應示範如何由特徵反應、對照與交叉檢驗逐步縮小候選。
    publisherEvidence:
      nani:
        status: pending
        required: true
      kanghsuan:
        status: pending
        required: true
      hanlin:
        status: verified
        required: true
    fusionRule: 目前僅翰林官方教師用手冊有可定位的本單元探究證據；南一與康軒直接內容未取得，故不宣稱三版共識。以課綱、KG及翰林氣體性質鑑定方向重組原創課文，其餘延伸明確標示為先備概念補充。
    currentEvidenceStatus: curriculum-and-kg-grounded; hanlin-teacher-guide-verified; nani-and-knsh-direct-unit-evidence-pending; original-synthesis-draft
  learningGoals:
  - 為食鹽水、稀鹽酸與稀碳酸鈉等候選溶液預測指示劑及產氣檢驗結果，區分直接觀察與物質身分推論
  - 以空白與已知對照固定樣品量、試劑量及觀察條件，辨別試劑本身、污染或操作造成的假陽性
  - 用不同原理的反應證據交叉檢查替代解釋，寫出支持、排除與仍待驗的候選
  prerequisites:
  - 能區分物理性質與物質發生反應時呈現的化學性質
  - 能讀取指示劑、沉澱與產氣等觀察紀錄，並知道未知物不可品嚐或直接嗅聞
  coreConcepts:
  - 化學鑑定不是由單一外觀或單一陽性反應直接命名，而是比較候選物在相同條件下的可重複反應證據
  - 指示劑變色、產氣或沉澱是直接觀察；酸性、特定氣體或化合物身分則是需要額外證據支持的推論
  - 空白對照用來檢查試劑與操作背景，已知對照用來確認檢驗在相同條件下能產生預期反應
  - 當多個候選能產生相同現象時，必須選擇第二項不同原理的檢驗，逐步縮小候選而不是過度宣稱唯一身分
  misconceptions:
  - 看到氣泡便認定特定氣體，未排除沸騰、溶解氣體逸出或其他產氣來源
  - 把單一指示劑、沉澱或木條結果當作唯一身分證明，忽略不同物質可能產生相似現象
  - 把直接觀察（變色、變濁、復燃、熄滅）直接改寫成未經交叉檢驗的物質名稱
  - 忽略空白與已知對照，或在比較時同時改變樣品量、試劑量與溫度
  contentFlow:
  - 'hook: 三瓶外觀相同的無色溶液可能為食鹽水、稀鹽酸或稀碳酸鈉；先列候選而不是猜名稱'
  - 'predict: 對每個候選預測指示劑與產氣檢驗的直接觀察，答案暫不揭露'
  - 'control: 先執行清水空白與已知酸／鹼對照，確認背景與檢驗是否正常'
  - 'manipulate: 選擇指示劑或產氣檢驗，固定樣品量、試劑量與觀察條件'
  - 'observe: 只記錄變色、氣泡、沉澱等直接可見現象，不先寫物質名稱'
  - 'evidence-link: 將每項觀察標成支持、排除或無法區分哪些候選'
  - 'cross-check: 若多個候選仍相容，選第二項不同原理的檢驗排除替代解釋'
  - 'explain: 以「條件—觀察—推論—限制」寫出有條件結論'
  - 'transfer: 對未知固體與稀酸產氣的資料設計安全後續氣體檢驗與對照'
  - 'exit-ticket: 用一個陽性結果說明為何仍不能直接指定唯一化合物'
  visualizations:
  - 反應證據矩陣：列出候選、檢驗、直接觀察、支持／排除狀態與尚未解決的替代解釋
  - 對照區明示空白、已知樣品與未知樣品，並顯示是否保持相同體積、試劑量及溫度條件
  - 顏色變化同時提供文字名稱；產氣與沉澱使用圖示加文字，不以顏色單獨傳意
  interactiveBlocks:
  - id: CUR-SCIENCE-CONTENT-CA-IV-2-I01
    component: EvidenceLabBlock
    purpose: 讓學生對未知溶液候選選擇虛擬檢驗，從預測、觀察、對照與替代解釋形成可檢查的鑑定判斷
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        candidateSolution: unknown
        selectedTest: none
        controlRun: false
    studentActions:
    - 先對食鹽水、稀鹽酸與稀碳酸鈉的預期結果提交預測，不顯示正解
    - 選擇指示劑或產氣檢驗，先做清水空白與已知對照
    - 讀取未知樣本的直接觀察，標記各候選為支持、排除或仍可能
    - 若剩餘候選共享同一現象，選擇第二項檢驗而不是立即命名
    - 以短句說明「檢驗條件 → 直接觀察 → 候選推論 → 尚存限制」
    visualRules:
    - 執行檢驗後證據矩陣、候選狀態與文字摘要同步更新，不得只顯示一個結果燈號
    - 正解揭露前保留學生預測、控制組與檢驗順序
    - 顏色不可單獨承擔酸鹼或反應意義，必須搭配文字標籤
    - 未做第二項檢驗前，不得把相容候選自動縮成唯一物質
    - 窄螢幕不得裁切候選、觀察、對照與限制欄位
    misconceptionChecks:
    - id: MC-CUR-SCIENCE-CONTENT-CA-IV-2-GAS
      trigger: 僅憑氣泡便斷定未知氣體或化合物名稱
      prompt: 氣泡之外還有哪些可能來源？哪一項後續檢驗能直接測試你的氣體假說？
      expectedEvidence: 指出至少一個替代來源，並提出安全、可比較的後續氣體性質檢驗
    - id: MC-CUR-SCIENCE-CONTENT-CA-IV-2-SINGLE
      trigger: 只憑一次指示劑變色或沉澱便宣稱唯一身分
      prompt: 哪些候選仍可能產生相同現象？請選一項不同原理的第二檢驗。
      expectedEvidence: 至少保留一個相容候選並用第二項獨立證據再縮小範圍
    - id: MC-CUR-SCIENCE-CONTENT-CA-IV-2-CONTROL
      trigger: 未跑空白／已知對照，或比較時同時改變多項條件
      prompt: 若試劑本身污染或樣品量不同，你如何知道差異來自未知物？
      expectedEvidence: 指出空白或已知對照用途，並固定樣品量、試劑量與觀察條件
    feedback:
      correct: 指出學生使用了哪一項直接觀察、哪一個對照及哪個候選被排除，再要求換一組未知樣本重新驗證。
      incorrect: 依「未分開觀察與推論／缺對照／單一證據過度推論」給不同一階提示，重試前不揭露完整鑑定流程。
  teachingPatternRefs:
  - refId: phet-ild
    reuseDecision: inspiration-only
    application: "本課 EvidenceLabBlock 只吸收先預測再操作、保留學生想法與證據表達流程；未知樣本、反應資料、題目與回饋均為本課自行設計。"
  - refId: phet-activity
    reuseDecision: inspiration-only
    application: "本課借用探究活動的預測—觀察—解釋節奏，不複製外部活動腳本或數據。"
  - refId: w3c-aria
    reuseDecision: inspiration-only
    application: "檢驗按鈕、候選狀態與觀察結果均提供可由鍵盤及螢幕閱讀器取得的文字狀態。"
  - refId: w3c-landmarks
    reuseDecision: inspiration-only
    application: "預測、對照、未知樣本、證據矩陣與結論區使用清楚區域結構，方便鍵盤與輔助科技導覽。"
  capTransfer:
    questionType: 實驗資料判讀／檢驗設計／理由短答
    stemConstraint: 提供未知固體與稀酸反應產氣、空白組無反應及兩種候選氣體的性質資料；不得直接給氣體名稱
    requiredResponse: 先寫直接觀察，再選一項安全的後續檢驗與已知對照；依結果說明支持哪個候選以及仍不能宣稱的部分
    scoring: 觀察與推論分離 1、檢驗／對照合理 1、結論含證據與限制 1
  exitTicket:
    prompt: 某未知液加入碳酸鈉後出現氣泡，清水空白組沒有氣泡。請寫出「一項可直接觀察的事實、目前可支持的推論、以及仍需做的一項檢驗」。
    successCriteria:
    - 直接觀察只描述未知液產氣與空白組結果，不把氣泡直接寫成物質名稱
    - 推論限定為樣品可能含能與碳酸根產氣的酸性物質，而非指定唯一酸
    - 提出一項可排除替代解釋或鑑定氣體性質的安全後續檢驗
  expressionExtension:
    applicable: false
    task: 用 80～120 字說明為什麼「看到一個陽性反應」通常不足以鑑定未知化合物，並引用一項對照或交叉檢驗。
    constraint: 學生先寫；系統只給一階回饋，不直接代寫完整答案
  mobileA11y:
    breakpoints:
    - 320
    - 375
    - 768
    touchTargetMinPx: 44
    keyboardAlternative: true
    screenReader: 每個檢驗控制項有名稱、目前選擇、執行後觀察與候選狀態；表格提供等價文字摘要
    reducedMotion: 停用自動動畫仍可逐步執行檢驗並查看文字結果
  testCases:
  - 初始載入只顯示三個候選與待選檢驗，未提交預測前不得標示正確候選。
  - 執行清水空白與已知對照後，證據矩陣須分開記錄三類樣本，不得把對照結果寫入未知樣本。
  - 對未知液加入碳酸鈉出現氣泡時，系統只把酸性候選標成「受到支持」，不得直接顯示唯一酸名稱。
  - 若學生未做對照就提交結論，命中 CONTROL misconception，要求先固定樣品量、試劑量與觀察條件。
  - 若學生只靠指示劑變色指定唯一化合物，命中 SINGLE misconception，要求指出仍相容候選並選第二檢驗。
  - 若學生把氣泡直接命名為二氧化碳，命中 GAS misconception，要求提出替代來源與後續氣體性質檢驗。
  - CAP transfer 換成未知固體產氣情境；評分必須分別檢查觀察、檢驗／對照及結論限制，不能只看選項。
  - 320px、375px、768px 下以鍵盤完成預測、對照、未知檢驗與交叉檢驗時，候選、觀察、控制項及回饋均不得溢位或失去焦點。
  - 外部資源失效時，EvidenceLabBlock 仍由本地 lesson/spec 資料完成候選矩陣、對照與文字回饋，不阻塞本課。
  definitionOfDone:
  - 課綱 ID、KG ID、標題與官方 locator 通過一致性檢查
  - 三版本章節級證據已補齊，或明確標記 pending，不得冒充完成
  - 至少一個互動操作能回答本單元明確學習問題
  - 至少一個迷思被實際誘發、診斷並以分層回饋處理
  - 會考 transfer、exit ticket 與表達延伸（適用時）可執行
  - mobile、keyboard、screen reader、reduced-motion 與 fallback 測試通過
  - 內容、教學法與版權審查通過；無 placeholder、TODO 或只換名詞模板
  status:
    designStatus: specified
    implementationStatus: implemented
    qaStatus: untested
