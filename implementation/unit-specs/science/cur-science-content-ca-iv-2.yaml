unitImplementationSpec:
  specVersion: '1.0'
  lessonId: cur-science-content-ca-iv-2
  knowledgeGraphIds:
  - kg-science-content-ca-iv-2
  title: Ca-Ⅳ-2：以化學性質鑑定化合物
  subject: science
  socialDiscipline: null
  curriculumLevel: learning-content
  gradeRange:
  - '7'
  - '8'
  - '9'
  fusedScope:
    officialCurriculum: Ca-Ⅳ-2：以化學性質鑑定化合物
    curriculumIntent: 以可檢驗的化學性質鑑定候選化合物；本課用未知溶液及其產氣反應示範如何由特徵反應、對照與交叉檢驗逐步縮小候選。
    publisherEvidence:
      nani:
        status: pending
        required: true
      kanghsuan:
        status: pending
        required: true
      hanlin:
        status: verified
        required: true
    fusionRule: 目前僅翰林官方教師用手冊有可定位的本單元探究證據；南一與康軒直接內容未取得，故不宣稱三版共識。以課綱、KG及翰林氣體性質鑑定方向重組原創課文，其餘延伸明確標示為先備概念補充。
    currentEvidenceStatus: curriculum-and-kg-grounded; hanlin-teacher-guide-verified; nani-and-knsh-direct-unit-evidence-pending; original-synthesis-draft
  learningGoals:
  - 為食鹽水、稀鹽酸與稀碳酸鈉等候選溶液預測石蕊及產氣檢驗結果，區分觀察與推論
  - 以空白與已知對照固定樣品量、試劑量及觀察條件，辨別假陽性
  - 用不同原理的反應證據檢查替代解釋，寫出支持、排除與待驗候選
  prerequisites:
  - 能讀懂本單元使用的基本符號、圖表或短文本
  - 能依提示完成一次預測、操作、觀察、解釋循環
  coreConcepts:
  - Ca-Ⅳ-2：以化學性質鑑定化合物
  - 表徵／證據與結論的對應
  - 錯誤答案所反映的概念差異
  misconceptions:
  - 看到氣泡便認定特定氣體，未排除沸騰或其他產氣來源
  - 把單一檢驗結果當作唯一身分證明，忽略其他物質可能產生相似現象
  - 把直接觀察（變濁、復燃、熄滅）誤寫成未經檢驗的物質名稱
  contentFlow:
  - 'hook: 以單元真實問題引起預測'
  - 'activate-prerequisite: 顯示先備檢核並允許補救'
  - 'visualize: 呈現食鹽水／酸／碳酸鹽候選與石蕊、產氣檢驗的觀察矩陣'
  - 'predict: 學生先提交預測且答案暫不揭露'
  - 'manipulate: 選擇虛擬檢驗並先做空白與已知對照'
  - 'observe: 記錄反應現象並縮小候選集合'
  - 'explain: 以觀察、推論與替代解釋寫出有條件結論'
  - 'formalize: 再顯示本單元正式語言與記法'
  - 'transfer: 進入會考型新資料題'
  - 'exit-ticket: 一題理由題加一個自我診斷'
  visualizations:
  - 反應證據矩陣：同步呈現檢驗方法、直接觀察及候選判讀，不以單一訊號當作身分證明
  - 每次變更都保留因果可追溯的標記、圖例與文字替代
  interactiveBlocks:
  - id: CUR-SCIENCE-CONTENT-CA-IV-2-I01
    component: EvidenceLabBlock
    purpose: 讓學生對未知溶液候選選擇虛擬檢驗，從預測、觀察、對照與替代解釋形成可檢查的判斷
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        candidateSolution: unknown
        selectedTest: none
        controlRun: false
    studentActions:
    - 先提交預測，不顯示正解
    - 選擇指示劑或產氣檢驗並先提交結果預測
    - 執行空白與已知對照，再讀取未知樣本觀察
    - 標記支持或反駁候選的現象，並選擇下一項交叉檢驗
    - 以短句說明「檢驗條件 → 直接觀察 → 候選推論 → 尚存限制」
    visualRules:
    - 操作後所有相關表徵同步更新，不得只改單一數字
    - 正解揭露前保留學生預測與操作紀錄
    - 顏色不可單獨承擔意義，必須搭配標籤、符號或文字
    - 窄螢幕不得裁切核心圖、題幹與回饋
    misconceptionChecks:
    - id: MC-CUR-SCIENCE-CONTENT-CA-IV-2-I01
      trigger: 僅憑氣泡或木條現象就斷定未知氣體名稱
      prompt: 這項現象是否只可能由你的候選氣體造成？請指出對照或第二項檢驗。
      expectedEvidence: 指出一項直接觀察、一項對照及可排除替代解釋的交叉檢驗
    feedback:
      correct: 指出學生使用的證據，並要求用新情境再驗證一次。
      incorrect: 先指出錯誤位於概念、證據或操作哪一層；提供一階提示，不直接代答；重試後才顯示局部示範。
