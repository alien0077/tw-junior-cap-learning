    reuseDecision: inspiration-only
    application: "本課「Ca-Ⅳ-2：以化學性質鑑定化合物」的 EvidenceLabBlock 只吸收預測、操作、證據表達或可及性呈現方法；資料、文字、題目與視覺內容由本課自行設計。"
