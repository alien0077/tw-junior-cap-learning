unitImplementationSpec:
  specVersion: '1.0'
  lessonId: cur-science-content-b
  knowledgeGraphIds:
  - kg-science-content-b
  title: B：能量的形式、轉換及流動
  subject: science
  socialDiscipline: null
  curriculumLevel: theme
  gradeRange:
  - '7'
  - '8'
  - '9'
  fusedScope:
    officialCurriculum: B：能量的形式、轉換及流動
    curriculumIntent: B：能量的形式、轉換及流動
    publisherEvidence:
      nani:
        status: pending
        required: true
      kanghsuan:
        status: pending
        required: true
      hanlin:
        status: pending
        required: true
    fusionRule: 只融合三版本共同概念與可核對差異；章節級證據雖已記錄，融合審查前不得聲稱已完成版本融合
    currentEvidenceStatus: curriculum-and-kg-grounded; publisher-chapter-evidence-recorded; fusion-review-pending
  learningGoals:
  - 設定系統邊界，辨認能量來源、儲存、轉換與流向
  - 以能量帳本同時說明守恆與效率，追蹤有效輸出及熱、聲等其他輸出
  - 區分能量與功率，利用功率與時間比較不同裝置的總能量轉換
  prerequisites:
  - 能讀懂本單元使用的基本符號、圖表或短文本
  - 能依提示完成一次預測、操作、觀察、解釋循環
  coreConcepts:
  - 能量可在熱、光、聲、電、化學能與力學能等形式間轉換並跨系統邊界流動
  - 能量守恆追蹤總量；效率描述指定有效輸出占輸入能量的比例
  - 功率是單位時間的能量轉換量，總能量仍取決於作用時間
  misconceptions:
  - 把效率低說成能量消失，忽略熱、聲等其他輸出
  - 把功率與能量視為同一物理量，或只看瓦數比較總耗能
  - 未先設定系統邊界就把流入／流出的能量重複計算
  contentFlow:
  - 'hook: 從煞車、手電筒或馬達追問「能量去哪裡」並先畫系統邊界'
  - 'predict: 給定固定輸入，先預測提高有效輸出時其他輸出如何改變'
  - 'manipulate: 調整有效輸出比例或作用時間，一次只改一項條件'
  - 'observe: 同步更新能量流向箭頭、數值帳本與效率／總能量讀值'
  - 'explain: 說明守恆與效率為何不矛盾，並指出熱、聲等能量流向'
  - 'formalize: 區分能量、功率與效率的定義及單位關係'
  - 'transfer: 比較兩個不同功率與使用時間的裝置，或追蹤較大尺度能量流'
  - 'exit-ticket: 完成一張輸入＝有效輸出＋其他輸出的能量帳本'
  visualizations:
  - 能量流向圖：以箭頭同步呈現輸入、有效輸出與熱／聲等其他輸出
  - 能量帳本：輸入固定時，有效輸出與其他輸出同步更新且總和保持一致
  - 功率—時間讀值：改變時間時同步更新總能量，並提供非色彩文字標籤
  interactiveBlocks:
  - id: CUR-SCIENCE-CONTENT-B-I01
    component: PhenomenonSimulationBlock
    purpose: 讓學生調整有效輸出比例與作用時間，直接看見能量守恆、效率與功率三者的不同角色
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        usefulOutputPercent: 40
        durationHours: 1
    studentActions:
    - 先提交預測，不顯示正解
    - 以滑桿、按鈕、鍵盤或點選方式改變一個條件
    - 標記支持結論的圖形、資料、詞語或事件
    - 以短句說明「改變什麼 → 看到什麼 → 所以什麼」
    visualRules:
    - 操作後所有相關表徵同步更新，不得只改單一數字
    - 正解揭露前保留學生預測與操作紀錄
    - 顏色不可單獨承擔意義，必須搭配標籤、符號或文字
    - 窄螢幕不得裁切核心圖、題幹與回饋
    misconceptionChecks:
    - id: MC-CUR-SCIENCE-CONTENT-B-I01
      trigger: 把未成為有效輸出的能量說成消失，或只用功率大小判定總耗能
      prompt: 請先完成能量帳本，再指出比較總能量時還需要哪一個時間條件。
      expectedEvidence: 能寫出輸入＝有效輸出＋其他輸出，並指出總能量比較需要功率與時間
    feedback:
      correct: 指出學生使用的證據，並要求用新情境再驗證一次。
      incorrect: 先指出錯誤位於概念、證據或操作哪一層；提供一階提示，不直接代答；重試後才顯示局部示範。
