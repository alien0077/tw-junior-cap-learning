unitImplementationSpec:
  specVersion: '1.0'
  lessonId: cur-science-content-bc-iv-2
  knowledgeGraphIds:
  - kg-science-content-bc-iv-2
  title: Bc-Ⅳ-2：呼吸作用釋放能量
  subject: science
  socialDiscipline: null
  curriculumLevel: learning-content
  gradeRange:
  - '7'
  - '8'
  - '9'
  fusedScope:
    officialCurriculum: Bc-Ⅳ-2：呼吸作用釋放能量
    curriculumIntent: 以有機物、氧氣、二氧化碳與能量證據解釋細胞呼吸，並區分細胞呼吸、氣體交換與缺氧代謝
    publisherEvidence:
      nani:
        status: pending
        required: true
      kanghsuan:
        status: pending
        required: true
      hanlin:
        status: pending
        required: true
    fusionRule: 只融合三版本共同概念與可核對差異；章節級證據雖已記錄，融合審查前不得聲稱已完成版本融合
    currentEvidenceStatus: curriculum-and-kg-grounded; lesson-unit-specific; publisher-chapter-evidence-recorded; fusion-review-pending
  learningGoals:
  - 用物質與能量箭頭說明有氧呼吸消耗有機物與氧氣，產生二氧化碳、水並釋放可供細胞利用的能量
  - 由活材料、滅活材料與空白對照的 O2、CO2、溫度或產物時間資料判斷呼吸作用證據
  - 區分細胞呼吸與肺部吸氣吐氣，說明植物、動物與微生物都可進行細胞呼吸，且植物有光時仍會呼吸
  prerequisites:
  - 能閱讀氣體濃度或溫度隨時間變化的圖表
  - 能辨認實驗組、滅活／無材料對照與控制變因
  coreConcepts:
  - 細胞呼吸是細胞內分解有機物並釋放能量的代謝過程，不等同個體層級的呼吸運動或氣體交換
  - 有氧呼吸需要氧氣並產生二氧化碳與水；可利用能量與散失為熱的能量需和氣體證據分開表達
  - 缺氧時部分生物或細胞可改以其他代謝路徑取得較少可利用能量；氣體變化需配合材料、條件與對照判讀
  misconceptions:
  - 認為只有有肺的動物才會呼吸作用，或植物白天因光合作用而停止呼吸
  - 把「吸氣、吐氣」直接等同細胞呼吸，忽略氣體交換只是取得／排出物質的一環
  - 看到二氧化碳增加就宣稱已直接測得能量釋放量，忽略氣體只是代謝證據之一
  contentFlow:
  - 'hook: 比較發芽種子、煮熟種子與空瓶的 O2／CO2／溫度資料，先判斷哪組有活躍代謝'
  - 'predict: 預測活種子在密閉短時間內 O2、CO2 與溫度可能如何改變'
  - 'manipulate: 固定材料量、容器體積、溫度與時間，只切換活／滅活材料或氧氣供應條件'
  - 'observe: 同步更新 O2、CO2、溫度與物質—能量路徑圖'
  - 'explain: 分開標示直接量測、呼吸作用推論與不能由資料直接得到的能量數值'
  - 'formalize: 建立有氧呼吸的反應物、產物與能量轉換，並區分氣體交換'
  - 'transfer: 運動肌肉、酵母、發芽種子與水生植物情境的代謝證據判讀'
  - 'exit-ticket: 由一組活／滅活對照資料說明何者支持細胞呼吸，並指出一項資料限制'
  visualizations:
  - 三組時間曲線：活材料、滅活材料、空白對照共用 O2／CO2 尺度與時間軸
  - 物質—能量路徑：有機物、O2、CO2、H2O、可利用能量與熱分層標示，避免把能量畫成物質
  - 有氧／缺氧比較卡：只呈現課程所需的物質與相對能量結果，不把模型當成完整生化途徑
  interactiveBlocks:
  - id: CUR-SCIENCE-CONTENT-BC-IV-2-I01
    component: PhenomenonSimulationBlock
    purpose: 讓學生控制材料活性與氧氣條件，從 O2／CO2／溫度資料和對照組判斷細胞呼吸與能量釋放證據
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        materialState: germinating-seeds
        oxygenCondition: available
        durationMin: 30
        sampleMassG: 20
    studentActions:
    - 先提交活種子相對煮熟種子的 O2、CO2 與溫度變化預測，不顯示正解
    - 固定樣品質量、容器與時間，只切換 materialState 或 oxygenCondition
    - 標記至少兩筆氣體／溫度資料，並與滅活或空白對照比較
    - 在路徑圖中放置有機物、O2、CO2 與能量箭頭，區分物質和能量
    - 用一句話說明「觀察到什麼 → 支持哪個代謝推論 → 還不能證明什麼」
    visualRules:
    - 切換活／滅活材料時曲線、路徑與文字摘要同步更新，不能讓滅活材料保留同等代謝訊號
    - 二氧化碳或溫度讀值不得直接標成 ATP 或能量數值；只能作為代謝相關證據
    - 植物／種子情境不得暗示只有夜間才呼吸；有光時若另有光合作用需明示兩作用可能同時存在
    - O2／CO2 顏色必須搭配化學式與文字標籤
    misconceptionChecks:
    - id: MC-CUR-SCIENCE-CONTENT-BC-IV-2-I01
      trigger: 學生把肺部吸氣吐氣等同細胞呼吸、認為植物白天不呼吸，或把 CO2 讀值直接當能量值
      prompt: 哪一項是細胞內代謝，哪一項是個體層級氣體交換？這組資料實際量到 O2、CO2、溫度還是能量？對照組如何支持你的判斷？
      expectedEvidence: 能以活／滅活或空白對照及時間資料支持呼吸作用，並承認氣體／溫度不是直接的能量量測
    feedback:
      correct: 核對物質路徑、對照與證據限制，再要求換成另一生物情境驗證。
      incorrect: 先提示「量到的物理量是什麼？」與「活材料和滅活材料差在哪裡？」再讓學生重試。
  teachingPatternRefs:
  - refId: phet-ild
    reuseDecision: inspiration-only
    application: 本課只借用先預測、操作與資料修正模型的節奏；氣體、溫度與對照資料均為本課自編。
  - refId: phet-activity
    reuseDecision: inspiration-only
    application: 本課以發芽種子、滅活對照與氧氣條件設計原創探究，不複製外部活動數據。
  - refId: w3c-aria
    reuseDecision: inspiration-only
    application: 材料狀態、氧氣條件、時間、O2／CO2／溫度與路徑皆提供鍵盤控制及文字狀態。
  - refId: w3c-landmarks
    reuseDecision: inspiration-only
    application: 預測、變因控制、曲線、路徑圖與回饋區域可導覽。
  capTransfer:
    questionType: 代謝資料判讀／對照實驗／理由短答
    stemConstraint: 更換成運動肌肉、酵母、發芽種子或其他活材料，至少提供一組活／滅活或氧氣條件對照資料，不能只背反應式
    requiredResponse: 指出至少一筆 O2／CO2／溫度證據、一組對照及能量推論的限制
    scoring: 呼吸概念正確 1、資料與對照正確 1、證據限制說明 1
  exitTicket:
    prompt: 等量發芽種子與煮熟種子放在相同密閉容器 30 分鐘。發芽種子組 O2 下降、CO2 上升，煮熟種子組幾乎不變。哪一組資料支持細胞呼吸較活躍？這些氣體資料本身能否直接告訴你釋放了多少 ATP？
    successCriteria:
    - 以發芽種子 O2 下降、CO2 上升及滅活對照支持呼吸作用較活躍
    - 說明細胞呼吸不等於肺部呼吸運動，種子也可進行
    - 明確指出氣體資料不能直接換算成 ATP 量，除非另有模型與量測條件
  expressionExtension:
    applicable: false
    task: 用 80～120 字向同學解釋「植物白天也會呼吸」及「氣體交換不等於細胞呼吸」，至少引用一項可量測證據
    constraint: 學生先寫；系統只提示作用層級、O2／CO2 與對照，不直接代寫完整答案
  mobileA11y:
    breakpoints:
    - 320
    - 375
    - 768
    touchTargetMinPx: 44
    keyboardAlternative: true
    screenReader: 材料、氧氣條件、O2／CO2／溫度曲線與能量路徑皆有可讀文字狀態
    reducedMotion: 停用動畫仍可逐時間點閱讀資料
  testCases:
  - 未提交活種子氣體變化預測前不得顯示完整呼吸作用解說。
  - 切換 germinating-seeds／killed-seeds 時 O2、CO2、溫度與文字摘要同步更新。
  - 學生把 CO2 直接當能量值時命中迷思診斷並要求指出實際量測物理量。
  - 植物情境不得顯示「白天呼吸＝0」；若同時有光合作用則需標示淨氣體變化與兩作用並存。
  - 缺氧模式需改變代謝路徑與相對能量提示，但不得宣稱所有生物都使用同一發酵產物。
  - 320／375／768px 與鍵盤操作下，曲線、控制項、路徑與回饋不得裁切。
  - fallback 至少保留活／滅活／空白三組靜態氣體資料與可重試代謝證據題。
  definitionOfDone:
  - 課綱 ID、KG ID、標題與官方 locator 通過一致性檢查
  - 互動實際操作材料活性與氧氣條件，不含 primary／secondary 假變項
  - 至少診斷一次細胞呼吸／氣體交換、植物白天或氣體／能量混淆
  - CAP transfer、exit ticket、mobile、keyboard、screen reader、reduced-motion 與 fallback 可執行
  - 內容與教學法無 placeholder、TODO 或只換名詞模板
  status:
    designStatus: specified
    implementationStatus: implemented
    qaStatus: untested
