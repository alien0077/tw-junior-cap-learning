unitImplementationSpec:
  specVersion: '1.0'
  lessonId: cur-science-content-ab-iv-2
  knowledgeGraphIds:
  - kg-science-content-ab-iv-2
  title: Ab-Ⅳ-2：溫度與物質狀態
  subject: science
  socialDiscipline: null
  curriculumLevel: learning-content
  gradeRange:
  - '7'
  - '8'
  - '9'
  fusedScope:
    officialCurriculum: Ab-Ⅳ-2：溫度與物質狀態
    curriculumIntent: Ab-Ⅳ-2：溫度與物質狀態
    publisherEvidence:
      nani:
        status: pending
        required: true
      kanghsuan:
        status: pending
        required: true
      hanlin:
        status: pending
        required: true
    fusionRule: 只融合三版本共同概念與可核對差異；章節級證據雖已記錄，融合審查前不得聲稱已完成版本融合
    currentEvidenceStatus: curriculum-and-kg-grounded; publisher-chapter-evidence-recorded; fusion-review-pending
  learningGoals:
  - 由溫度—時間資料判讀加熱或冷卻過程中的物態與相變區段
  - 說明同一純物質在一定壓力下相變溫度具有特徵性，並區分「持續供熱」與「溫度一定持續上升」
  - 用粒子運動與排列的改變連結溫度、加熱與物態變化，但不把溫度誤當成熱量本身
  prerequisites:
  - 能讀取溫度計與溫度—時間折線圖
  - 已理解固態、液態、氣態的基本粒子模型
  coreConcepts:
  - 溫度描述物體冷熱程度；加熱或冷卻可使溫度改變，也可能造成物態改變
  - 純物質在一定壓力下熔化或沸騰時，可出現持續吸收能量而溫度暫時維持不變的相變區段
  - 相變前後物質種類不因物態改變而改變；粒子排列、間距與運動狀態改變
  misconceptions:
  - 認為只要持續加熱，溫度就必定持續等速上升
  - 把沸騰時的氣泡一律當成外界空氣，而非依情境判斷其中可能是物質蒸氣
  - 把溫度與熱量視為同一物理量，或以單一溫度值直接代表含有多少熱
  contentFlow:
  - 'hook: 給一段加熱曲線，問為何加熱器仍開著但溫度出現平台'
  - 'predict: 先標出可能的固態、熔化、液態、沸騰、氣態區段'
  - 'manipulate: 移動時間游標或切換加熱／冷卻資料，觀察目前溫度與物態'
  - 'observe: 同步更新溫度曲線、粒子模型與相變標籤'
  - 'explain: 對平台區寫出「仍有能量轉移，但能量用於物態改變」的定性說明'
  - 'compare: 比較純物質與含雜質樣品的示意資料，避免把所有平台都當成絕對常數'
  - 'transfer: 判讀陌生冷卻曲線或不同壓力條件資料'
  - 'exit-ticket: 指出一段相變區、物態與不能由圖直接推出的資訊'
  visualizations:
  - 溫度—時間曲線：時間游標同步標出目前斜率、平台區與物態文字
  - 粒子模型：只呈現定性的排列與運動差異，明示非真實比例
  interactiveBlocks:
  - id: CUR-SCIENCE-CONTENT-AB-IV-2-I01
    component: ParticleModelBlock
    purpose: 讓學生沿加熱／冷卻曲線移動時間游標，將溫度資料、物態與粒子模型一一對應
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        process: heating
        timeMinute: 0
        sampleType: pure
    studentActions:
    - 先預測曲線平台代表的物態變化，不顯示正解
    - 以鍵盤可操作時間游標掃過升溫、相變平台與再升溫區段
    - 切換加熱／冷卻資料，標記熔化、凝固、沸騰或凝結區段
    - 用一句話區分「溫度變化」與「持續能量轉移」
    visualRules:
    - 游標移動時溫度讀值、曲線位置、物態標籤與粒子模型同步更新
    - 平台區不得顯示「沒有能量轉移」；只描述在該資料與條件下溫度暫時近似不變
    - 不把溫度單位 °C 與能量單位混用
    - 粒子圖明示示意性，不以粒子本身變大／變小表示升降溫
    misconceptionChecks:
    - id: MC-CUR-SCIENCE-CONTENT-AB-IV-2-I01
      trigger: 認為持續加熱一定升溫，或把相變平台解讀成停止吸收能量
      prompt: 請指出加熱器是否仍工作、曲線斜率如何，以及樣品正在發生哪一種物態變化。
      expectedEvidence: 能以平台區與相變對應說明持續能量轉移不等於溫度持續上升
    feedback:
      correct: 指出曲線區段與物態證據，再要求用冷卻曲線反向驗證。
      incorrect: 先提示比較「是否仍在加熱」與「溫度曲線是否上升」兩件不同的事，再讓學生重試。
  teachingPatternRefs:
  - refId: phet-ild
    reuseDecision: inspiration-only
    application: "本課只吸收先預測曲線、再操作游標驗證的教學節奏；曲線、粒子模型與文字皆為本專案自製。"
  - refId: phet-activity
    reuseDecision: inspiration-only
    application: "以相變平台與反向冷卻資料做概念轉移，不複製外部活動內容。"
  - refId: w3c-aria
    reuseDecision: inspiration-only
    application: "時間、溫度、物態與曲線趨勢均有同步文字狀態，圖形不是唯一資訊來源。"
  - refId: w3c-landmarks
    reuseDecision: inspiration-only
    application: "預測、曲線操作、粒子模型、證據與回饋分區可定位。"
  capTransfer:
    questionType: 溫度曲線判讀／相變推理／理由短答
    stemConstraint: 使用新的加熱或冷卻曲線資料，要求由平台、斜率與物態推理，不可只問名詞定義
    requiredResponse: 選答後指出曲線區段與物態證據
    scoring: 曲線判讀正確 1、物態／相變對應 1、理由完整且不混淆溫度與能量 1
  exitTicket:
    prompt: 一杯純物質持續加熱時出現近似水平的溫度區段。這段期間可能正在發生什麼？為什麼不能說「沒有吸收能量」？
    successCriteria:
    - 指出可能處於熔化或沸騰等相變
    - 指出持續加熱仍有能量轉移
    - 不把溫度與熱量視為同一物理量
  expressionExtension:
    applicable: false
    task: 用 80～120 字解釋一段相變平台，至少引用一個曲線證據並說明一項限制。
    constraint: 學生先寫；系統只給一階回饋，不直接代寫完整答案
  mobileA11y:
    breakpoints:
    - 320
    - 375
    - 768
    touchTargetMinPx: 44
    keyboardAlternative: true
    screenReader: 時間游標、溫度讀值、物態與曲線趨勢均有可讀名稱與變更摘要
    reducedMotion: 停用動畫時可用離散時間點逐步切換曲線與粒子狀態
  testCases:
  - 載入時先要求預測平台區，不得先顯示相變答案。
  - 時間游標進入平台區時，溫度、物態標籤與粒子模型同步更新，且不顯示「停止吸熱」。
  - 切換冷卻曲線後，凝固／凝結方向與粒子模型變化必須正確反轉。
  - 學生回答「加熱中溫度一定上升」時，命中迷思診斷並要求引用曲線平台證據。
  - 320px、375px、768px 與鍵盤操作下，曲線關鍵資料須有文字替代，不得靠滑鼠 hover 才能讀值。
  - Fallback 模式至少提供時間—溫度表、物態欄與三題平台判讀，不得只顯示通用說明。
  definitionOfDone:
  - 課綱 ID、KG ID、標題與官方 locator 通過一致性檢查
  - 三版本章節級證據已補齊，或明確標記 pending，不得冒充完成
  - 加熱／冷卻曲線互動可回答相變平台與物態判讀問題
  - 「持續加熱一定升溫」迷思被實際誘發、診斷並回饋
  - 會考 transfer、exit ticket 可執行
  - mobile、keyboard、screen reader、reduced-motion 與 fallback 測試通過
  - 內容、教學法與版權審查通過；無 placeholder、TODO 或只換名詞模板
  status:
    designStatus: specified
    implementationStatus: implemented
    qaStatus: untested
