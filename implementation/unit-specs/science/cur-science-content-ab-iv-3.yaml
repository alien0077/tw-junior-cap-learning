unitImplementationSpec:
  specVersion: '1.0'
  lessonId: cur-science-content-ab-iv-3
  knowledgeGraphIds:
  - kg-science-content-ab-iv-3
  title: Ab-Ⅳ-3：物理與化學性質
  subject: science
  socialDiscipline: null
  curriculumLevel: learning-content
  gradeRange:
  - '7'
  - '8'
  - '9'
  fusedScope:
    officialCurriculum: Ab-Ⅳ-3：物理與化學性質
    curriculumIntent: Ab-Ⅳ-3：物理與化學性質
    publisherEvidence:
      nani:
        status: pending
        required: true
      kanghsuan:
        status: pending
        required: true
      hanlin:
        status: pending
        required: true
    fusionRule: 只融合三版本共同概念與可核對差異；章節級證據雖已記錄，融合審查前不得聲稱已完成版本融合
    currentEvidenceStatus: curriculum-and-kg-grounded; publisher-chapter-evidence-recorded; fusion-review-pending
  learningGoals:
  - 依「是否需要形成新物質才能觀察」區分物理性質與化學性質
  - 從密度、熔點、導電性、溶解性、可燃性、與酸反應等資料選出能支持物質鑑別的證據
  - 區分性質與變化：可燃性是化學性質，燃燒是化學變化；熔點是物理性質，熔化是物理變化
  prerequisites:
  - 能區分物質、性質與事件描述
  - 能閱讀簡單性質資料表並比較兩種材料
  coreConcepts:
  - 物理性質可在不改變物質化學身分的條件下觀察或測量；化學性質描述物質發生化學變化的傾向或能力
  - 同一物質可同時具有多種物理與化學性質；分類依觀察方式，不依「是否危險」或「是否肉眼可見」
  - 鑑別物質通常需組合多項可重複量測的性質，單一外觀往往不足
  misconceptions:
  - 認為只要會改變外觀就是化學性質，或只要看得到就是物理性質
  - 把「燃燒」與「可燃性」、「熔化」與「熔點」混成同一層次
  - 以顏色或形狀單一線索就斷定未知物質身分
  contentFlow:
  - 'hook: 三個外觀相似樣品，只給部分性質資料，先選最有鑑別力的證據'
  - 'predict: 先將性質卡分類為物理／化學，不揭露答案'
  - 'manipulate: 逐張開啟密度、熔點、導電、溶解、可燃性或反應性證據'
  - 'observe: 分類板同步顯示「是否形成新物質才可觀察」與測試限制'
  - 'explain: 將一項性質與對應測試、觀察層次連起來'
  - 'contrast: 把性質名詞與實際變化事件配對，避免層次混淆'
  - 'transfer: 用新的材料資料表判斷哪組證據足以排除候選物質'
  - 'exit-ticket: 分類兩個性質並說出判準，不只背例子'
  visualizations:
  - 性質證據板：物理性質與化學性質兩欄，卡片包含測試方式與是否形成新物質
  - 未知物質比較表：以多項性質逐步排除候選，不用顏色作唯一依據
  interactiveBlocks:
  - id: CUR-SCIENCE-CONTENT-AB-IV-3-I01
    component: EvidenceLabBlock
    purpose: 讓學生選擇測試並依證據分類物理／化學性質，同時用多項性質鑑別未知物質
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        selectedTest: density
        sample: A
        evidenceStage: 0
    studentActions:
    - 先將「熔點、導電性、可燃性、與酸反應」分類並提交理由
    - 每次只開啟一項測試證據，記錄是否需要生成新物質才能判讀
    - 依證據逐步排除未知樣品候選
    - 將「性質」與「變化事件」各選一例並說明差別
    visualRules:
    - 每張證據卡同時顯示測試、觀察與分類理由，不只顯示答案標籤
    - 化學性質測試不得以危險實驗作真實操作指示；以資料或安全模擬呈現
    - 外觀相同的樣品仍保留文字代號，避免顏色成為答案線索
    - 未提供的性質明示未知，不可自動補值
    misconceptionChecks:
    - id: MC-CUR-SCIENCE-CONTENT-AB-IV-3-I01
      trigger: 依「看不看得到」分類，或把燃燒／熔化事件當成性質名稱
      prompt: 請改用「是否需要形成新物質才能觀察這項性質」判斷，並指出你寫的是性質還是變化事件。
      expectedEvidence: 能用形成新物質的判準區分物理／化學性質，並分開性質與變化
    feedback:
      correct: 指出分類判準與測試證據，再要求用另一張性質卡驗證。
      incorrect: 先提示不要用「肉眼可見／不可見」判準，要求檢查測試是否需發生化學變化。
  teachingPatternRefs:
  - refId: phet-ild
    reuseDecision: inspiration-only
    application: "本課採先分類、再開證據、最後修正判準的節奏；資料與題目由本專案自行設計。"
  - refId: phet-activity
    reuseDecision: inspiration-only
    application: "只借用證據導向探究結構，不複製外部實驗或素材。"
  - refId: w3c-aria
    reuseDecision: inspiration-only
    application: "每張性質卡的名稱、測試、結果與分類均有文字，不以顏色單獨傳達。"
  - refId: w3c-landmarks
    reuseDecision: inspiration-only
    application: "分類、測試證據、未知樣品與回饋區域皆可定位。"
  capTransfer:
    questionType: 性質資料判讀／物質鑑別／理由短答
    stemConstraint: 提供陌生材料的多項性質資料，要求依分類判準或排除證據推理，不可只問名詞定義
    requiredResponse: 選答後指出至少一項性質證據及其物理／化學分類理由
    scoring: 分類正確 1、證據對應 1、理由完整且分清性質與變化 1
  exitTicket:
    prompt: 「酒精可燃」和「酒精正在燃燒」哪一句描述性質、哪一句描述變化？可燃性為何屬於化學性質？
    successCriteria:
    - 指出可燃是性質、燃燒是變化事件
    - 說明可燃性需透過形成新物質的化學變化表現
    - 不以可見／不可見作分類判準
  expressionExtension:
    applicable: false
    task: 用 80～120 字說明如何用兩項以上性質鑑別一個未知樣品，並標明哪些是物理性質、哪些是化學性質。
    constraint: 學生先寫；系統只給一階回饋，不直接代寫完整答案
  mobileA11y:
    breakpoints:
    - 320
    - 375
    - 768
    touchTargetMinPx: 44
    keyboardAlternative: true
    screenReader: 每張證據卡與分類結果有名稱、測試方式、目前狀態與錯誤回饋
    reducedMotion: 不依賴動畫，分類與證據揭露可逐步操作
  testCases:
  - 載入時先要求分類性質卡，不得先顯示正解。
  - 開啟密度／熔點等物理性質證據時，不應標示形成新物質；化學性質卡須說明需透過化學變化觀察。
  - 學生用「看得見」判斷物理性質時，命中迷思診斷並要求改用形成新物質判準。
  - 未知樣品至少需兩項獨立性質才能完成排除，單一外觀不可直接判定。
  - 320px、375px、768px 與鍵盤操作下，卡片、分類與回饋均可讀取。
  - Fallback 模式提供性質資料表與文字分類題，不得只顯示通用互動說明。
  definitionOfDone:
  - 課綱 ID、KG ID、標題與官方 locator 通過一致性檢查
  - 三版本章節級證據已補齊，或明確標記 pending，不得冒充完成
  - 性質分類與未知物質鑑別互動可執行
  - 至少一項「可見＝物理」或「性質＝事件」迷思被診斷並回饋
  - 會考 transfer、exit ticket 可執行
  - mobile、keyboard、screen reader、reduced-motion 與 fallback 測試通過
  - 內容、教學法與版權審查通過；無 placeholder、TODO 或只換名詞模板
  status:
    designStatus: specified
    implementationStatus: implemented
    qaStatus: untested
