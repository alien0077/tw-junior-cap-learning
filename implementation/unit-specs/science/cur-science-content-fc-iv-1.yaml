  capTransfer:
    questionType: 資料判讀／概念應用／理由短答
    stemConstraint: 換一個情境但保留「Fc-Ⅳ-1：生物圈的生態系與組成層次」的核心關係；不可只換名詞
    requiredResponse: 選答後必須指出證據或推理步驟
    scoring: 概念正確 1、證據對應 1、表達完整 1
  exitTicket:
    prompt: 今天的核心關係是什麼？若改變一個條件，哪個結果會跟著變，為什麼？
    successCriteria:
    - 提到本單元核心概念
    - 指出條件與結果
    - 使用一項證據或表徵
  expressionExtension:
    applicable: false
    task: 用 80～120 字／英文短段落，將「Fc-Ⅳ-1：生物圈的生態系與組成層次」的證據、因果或觀察說給同學聽
    constraint: 學生先寫；系統只給一階回饋，不直接代寫完整答案
  mobileA11y:
    breakpoints:
    - 320
    - 375
    - 768
    touchTargetMinPx: 44
    keyboardAlternative: true
    screenReader: 每個控制項有名稱、目前值、操作結果與錯誤回饋
    reducedMotion: 停用自動動畫仍可逐步操作
  testCases:
  - 初始模型選取池塘／個體；鍵盤選取潮間帶與生態系後，場域標籤、證據摘要及 aria-pressed 狀態均更新，焦點仍留在操作按鈕。
  - 切換五種尺度時，各自顯示符合 lesson 概念的證據；族群需含同種／地區／時間，生態系需含生物群集與非生物環境，生物圈需標示全球範圍及局部樣本限制。
  - 以鍵盤作答 lesson JSON 四步 GuidedChoiceBlock；每步答錯顯示該步 retryHint，答對顯示該步 feedback，不可把尺度概念、功能角色或全球外推混為一談。
  - 在 320px、375px 與 768px 寬度操作所有場域／尺度按鈕並完成四步選擇題；文字證據、控制項與回饋不溢位或遺失，控制項可鍵盤操作且有清晰焦點。
  - fallback：外部資料不可用時，池塘／潮間帶資料、尺度切換、guided-choice 與解釋仍由本地 lesson JSON 運作，不得阻塞本課或假稱已連上外部資料。
  definitionOfDone:
  - 課綱 ID、KG ID、標題與官方 locator 通過一致性檢查
  - 三版本章節級證據已補齊，或明確標記 pending，不得冒充完成
  - 至少一個互動操作能回答本單元明確學習問題
  - 至少一個迷思被實際誘發、診斷並以分層回饋處理
  - 會考 transfer、exit ticket 與表達延伸（適用時）可執行
  - mobile、keyboard、screen reader、reduced-motion 與 fallback 測試通過
  - 內容、教學法與版權審查通過；無 placeholder、TODO 或只換名詞模板
