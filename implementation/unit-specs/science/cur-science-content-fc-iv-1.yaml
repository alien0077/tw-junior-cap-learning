    currentEvidenceStatus: curriculum-and-kg-grounded; publisher-chapter-evidence-recorded; fusion-review-pending
  learningGoals:
  - 以可觀察證據說明「Fc-Ⅳ-1：生物圈的生態系與組成層次」的核心現象
  - 控制變因並解讀模型或資料
  - 用證據推理回答陌生情境題
  prerequisites:
  - 能讀懂本單元使用的基本符號、圖表或短文本
  - 能依提示完成一次預測、操作、觀察、解釋循環
  coreConcepts:
  - Fc-Ⅳ-1：生物圈的生態系與組成層次
  - 表徵／證據與結論的對應
  - 錯誤答案所反映的概念差異
  misconceptions:
  - 把「Fc-Ⅳ-1：生物圈的生態系與組成層次」的相關變化誤認為因果，或忽略控制變因
  - 把記憶答案當成理解證據
  - 忽略題幹中的限制條件或單位
  contentFlow:
  - 'predict：看到池塘和潮間帶兩種樣區時，先預測個體、族群、群集、生態系與生物圈各自需要哪些範圍證據。'
  - 'manipulate：用場域按鈕在池塘／潮間帶間切換，再逐一操作五種觀察尺度，讓同一地點的證據邊界隨選擇改變。'
  - 'observe：每次切換後記錄出現的生物、同種個體範圍、共存物種，以及生態系需包含的非生物環境資訊。'
  - 'explain：依個體到生物圈的包含關係說明尺度判斷，另將生產者／消費者等功能角色和空間層級分開分類。'
  - 'observe：完成四步 guided-choice，根據每題的場域、物種數、時空範圍及環境條件核對錯答提示與正答解釋。'
  - 'explain：指出池塘或潮間帶的局部樣本能支持哪些生態系主張，及為何不能單憑它外推整個生物圈。'
  - 'transfer：改看陌生場域時，先標明觀察與取樣邊界，再選擇相符尺度並提出仍需補取的證據。'
  - 'exit-ticket：用個體到生物圈的層級語言說明判斷依據，並指出局部觀察推及全球前的證據缺口。'
  visualizations:
  - 以可及的按鈕切換池塘／潮間帶及五種尺度，更新文字化證據摘要；不宣稱存在拖曳鏡頭、滑桿或同步圖表
  - 每一尺度均顯示層級名稱、判斷條件及場域證據；生態系特別呈現生物群集與非生物環境，生物圈特別標示局部資料限制
  interactiveBlocks:
  - id: CUR-SCIENCE-CONTENT-FC-IV-1-I01
    component: SystemRelationshipBlock
    purpose: 切換觀察場域與尺度，直接比較層級判斷需要的生物名單、同種範圍及非生物環境證據
    initialState:
      site: pond
      scale: individual
    studentActions:
    - 以鍵盤或指標選擇池塘或潮間帶
    - 以鍵盤或指標切換個體、族群、群集、生態系與生物圈
    - 比較選取尺度所呈現的生物、時空範圍及非生物證據
    - 使用四步 guided-choice 檢核尺度判讀並讀取重試提示與解釋
    visualRules:
    - 場域或尺度按鈕變更後，更新文字證據、標題及 aria-pressed 狀態
    - 當前結果以 aria-live 區域宣讀；重繪後焦點留在原操作按鈕
    - 所有選項以文字標示，不以顏色單獨表意；觸控目標至少 44px
    - 窄螢幕不得裁切按鈕、核心證據、題幹與回饋
    misconceptionChecks:
    - id: MC-CUR-SCIENCE-CONTENT-FC-IV-1-I01
      trigger: 把局部池塘或潮間帶資料直接當成生物圈證據，或將生態角色當成尺度層級
      prompt: 指出資料涵蓋的場域／時間，並說明還缺少哪類範圍或環境證據。
      expectedEvidence: 說明局部取樣邊界及生物圈的全球尺度；或清楚區分功能分類與層級分類。
    feedback:
      correct: 具體指出其使用的時空範圍、生物組成或非生物環境證據。
      incorrect: 先提示檢查場域範圍、物種數或環境條件，讓學生重選後再讀解析；不宣稱不存在的動態因果診斷器。
  - id: CUR-SCIENCE-CONTENT-FC-IV-1-I02
    component: GuidedChoiceBlock
    purpose: 以四個選擇題逐步檢核族群條件、生態系組成、生物圈外推界線及分層取樣限制
    sourceData: lessons/science/lesson-science-content-fc-iv-1.json interactive.steps
    initialState:
      step: 0
      completed: false
    visualRules:
    - 每題選項、提交狀態、重試提示與正解解釋均以文字呈現，不依賴顏色。
    - 回答錯誤時保留目前步驟並顯示專屬 retryHint；答對才可進入下一步。
    - 進度與回饋使用可及文字狀態，鍵盤可操作所有選項與提交控制。
    studentActions:
    - 逐步作答四個單元專屬問題
    - 答錯時讀取該步重試提示後重新判讀
    - 答對時讀取概念解釋並進入後續情境
    misconceptionChecks:
    - id: MC-CUR-SCIENCE-CONTENT-FC-IV-1-I02
      trigger: 將「同種個體數量多」誤判為群集或生態系，或以局部樣區直接代表生物圈
      prompt: 指出題目給定的種類、時空範圍，以及是否納入非生物環境。
      expectedEvidence: 依同種／多種、生物群集／非生物環境及局部／全球邊界選出層級。
    feedback:
      correct: 呈現該步生態層級、環境證據或取樣邊界的解釋。
      incorrect: 優先呈現 lesson JSON retryHint；未提供提示時使用通用回看提示。
