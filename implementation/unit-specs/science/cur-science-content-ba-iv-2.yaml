unitImplementationSpec:
  specVersion: '1.0'
  lessonId: cur-science-content-ba-iv-2
  knowledgeGraphIds:
  - kg-science-content-ba-iv-2
  title: Ba-Ⅳ-2：光合作用與呼吸作用的能量轉換
  subject: science
  socialDiscipline: null
  curriculumLevel: learning-content
  gradeRange: ['7', '8', '9']
  fusedScope:
    officialCurriculum: Ba-Ⅳ-2：光合作用與呼吸作用的能量轉換
    curriculumIntent: 用物質與能量路徑分辨光合作用、呼吸作用及觀測到的淨變化
    publisherEvidence:
      nani: {status: pending, required: true}
      kanghsuan: {status: pending, required: true}
      hanlin: {status: pending, required: true}
    fusionRule: 只融合可核對概念與教學方向；未完成三版本章節融合前不得標成正式融合完成
    currentEvidenceStatus: curriculum-and-kg-grounded; lesson-unit-specific; publisher-fusion-review-pending
  learningGoals:
  - 以物質與能量箭頭比較光合作用與呼吸作用，說明光能儲存在有機物及有機物能量被細胞利用的方向
  - 由氧氣、二氧化碳或澱粉資料判讀淨變化，不把淨值誤當成單一作用速率
  - 設計有光／無光、葉片／無材料等對照，控制葉面積、溫度、時間與起始氣體條件
  prerequisites:
  - 知道光合作用與呼吸作用的基本反應物／產物
  - 能閱讀氣體濃度隨時間變化的簡單折線圖
  coreConcepts:
  - 光合作用把光能轉成有機物中的化學能；呼吸作用釋出有機物中的能量供細胞利用
  - 植物在有光時也會呼吸；觀察到的氣體變化通常是兩種作用疊加後的淨結果
  - 單一氧氣或二氧化碳讀值不足以直接等同某一作用的絕對速率
  misconceptions:
  - 認為植物白天只做光合作用、晚上才呼吸
  - 看到氧氣增加就判定呼吸作用完全停止
  - 把植物增重或單次氣體讀值直接當成光合作用速率，忽略水分、溫度與材料量
  contentFlow:
  - 'hook: 比較照光葉片、遮光葉片與黑暗發芽種子的氣體資料'
  - 'predict: 先預測各組氧氣與二氧化碳的淨變化，不揭露作用速率'
  - 'manipulate: 固定葉面積、溫度、容器體積與時間，只切換光照或材料狀態'
  - 'observe: 同步更新 O2、CO2 時間曲線與物質／能量箭頭'
  - 'explain: 分開寫直接觀察、光合作用推論、呼吸作用推論與淨效果'
  - 'formalize: 連結光能、有機物化學能及兩種作用的反應物／產物'
  - 'transfer: 以溫室通風、光照與夜間氣體資料判讀兩作用的相對大小'
  - 'exit-ticket: 說明為何照光葉片 O2 上升不能證明呼吸停止'
  visualizations:
  - 三組氣體折線圖：照光葉片、遮光葉片、黑暗發芽種子，共用座標尺度與測量時間
  - 物質／能量雙路徑：CO2、H2O、有機物、O2 與光能／化學能方向同步標示
  interactiveBlocks:
  - id: CUR-SCIENCE-CONTENT-BA-IV-2-I01
    component: PhenomenonSimulationBlock
    purpose: 讓學生控制光照與材料條件，從 O2／CO2 時序資料分辨光合作用、呼吸作用與淨效果
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        material: leaf
        lightLevel: bright
        temperatureC: 25
        durationMin: 20
    studentActions:
    - 先提交三組氣體變化預測
    - 固定材料量、溫度與時間，只切換光照或材料狀態
    - 標記折線中可直接觀察的 O2／CO2 變化
    - 將直接觀察與兩種作用的推論分欄記錄
    - 用「淨變化＝兩種作用共同結果」說明資料限制
    visualRules:
    - 切換光照時 O2、CO2 曲線與能量箭頭同步更新，但不得顯示不存在的精確生理速率
    - 照光葉片仍須保留呼吸作用路徑，不可把其隱藏成零
    - 無材料對照須清楚標示以協助辨認容器／感測器背景變化
    - 顏色必須搭配 O2、CO2 與作用名稱文字，不可只靠紅綠區分
    misconceptionChecks:
    - id: MC-CUR-SCIENCE-CONTENT-BA-IV-2-I01
      trigger: 學生由照光時 O2 增加推論植物停止呼吸，或把淨氣體變化當單一作用速率
      prompt: 這個讀值是兩種作用共同造成的淨結果嗎？哪一組對照能幫你分辨？
      expectedEvidence: 指出照光時呼吸仍存在，並引用遮光或無材料對照及時間曲線
    feedback:
      correct: 核對兩條反應路徑、淨值與對照，再要求用另一材料情境驗證。
      incorrect: 先提示「照光是否會讓呼吸停止？」並要求比較遮光組，不直接代答。
  teachingPatternRefs:
  - refId: phet-ild
    reuseDecision: inspiration-only
    application: 只借用先預測、操作、再以證據修正模型的節奏；本課氣體資料與代謝路徑均自編。
  - refId: w3c-aria
    reuseDecision: inspiration-only
    application: 光照、材料與折線狀態皆提供鍵盤控制及文字摘要。
  capTransfer:
    questionType: 實驗資料判讀／折線圖／理由短答
    stemConstraint: 更換植物材料或環境，但必須保留光合作用與呼吸作用同時存在及淨值判讀
    requiredResponse: 指出至少一筆氣體資料、一組對照及推論限制
    scoring: 概念正確 1、資料與對照 1、限制 1
  exitTicket:
    prompt: 照光葉片容器中 O2 上升、CO2 下降，為什麼不能直接說葉片沒有呼吸作用？
    successCriteria:
    - 說明兩種作用可同時進行
    - 說明讀值是淨變化而非單一作用速率
    - 指出可加入遮光或無材料對照
  expressionExtension:
    applicable: false
    task: 以物質／能量箭頭與短文解釋一組植物氣體資料
    constraint: 學生先寫；系統只給分層提示
  mobileA11y:
    breakpoints: [320, 375, 768]
    touchTargetMinPx: 44
    keyboardAlternative: true
    screenReader: 光照、材料、時間與兩條氣體曲線皆有可讀文字狀態
    reducedMotion: 關閉動畫後仍可逐時間點閱讀資料
  testCases:
  - 未提交預測前不得顯示完整作用判讀。
  - 切換照光／遮光時兩條氣體曲線與文字摘要同步更新。
  - 照光模式仍顯示呼吸作用存在，不得把呼吸設為零。
  - 把 O2 增加當成呼吸停止時必須命中迷思診斷。
  - 320／375／768px 與鍵盤操作下，曲線、控制項與文字摘要不得裁切。
  - fallback 至少保留三組靜態資料表與可重試的淨變化判讀題。
  definitionOfDone:
  - 課綱 ID、KG ID、標題與官方 locator 一致
  - 互動能實際比較光照／遮光與材料狀態，而非 primary／secondary 假變項
  - 淨值與單一作用速率迷思被實際診斷
  - transfer、exit ticket、mobile、keyboard、screen reader 與 fallback 可執行
  - 無 placeholder、TODO 或只換名詞模板
  status:
    designStatus: specified
    implementationStatus: implemented
    qaStatus: untested
