  capTransfer:
    questionType: 資料判讀／概念應用／理由短答
    stemConstraint: 換一個情境但保留「Gc-Ⅳ-2：生物多樣性與生態系穩定」的核心關係；不可只換名詞
    requiredResponse: 選答後必須指出證據或推理步驟
    scoring: 概念正確 1、證據對應 1、表達完整 1
  exitTicket:
    prompt: 今天的核心關係是什麼？若改變一個條件，哪個結果會跟著變，為什麼？
    successCriteria:
    - 提到本單元核心概念
    - 指出條件與結果
    - 使用一項證據或表徵
  expressionExtension:
    applicable: false
    task: 用 80～120 字／英文短段落，將「Gc-Ⅳ-2：生物多樣性與生態系穩定」的證據、因果或觀察說給同學聽
    constraint: 學生先寫；系統只給一階回饋，不直接代寫完整答案
  mobileA11y:
    breakpoints:
    - 320
    - 375
    - 768
    touchTargetMinPx: 44
    keyboardAlternative: true
    screenReader: 每個控制項有名稱、目前值、操作結果與錯誤回饋
    reducedMotion: 停用自動動畫仍可逐步操作
  testCases:
  - 初始狀態須為水草擾動等級0，且須先讓學生提交「哪些關係可能改變」的預測；預測前不得顯示結論性回饋。
  - 將滑桿由0調至1或2時，標籤與關係敘述同步更新；level 2 必須明示「假設情境」且不得輸出真實族群數值。
  - 迷思測試以「物種多就一定穩定」和「模型箭頭等於實測因果」為錯誤輸入，驗收回饋要求指出待測資料，不得直接宣告池塘會崩解或已恢復。
  - 在320px、375px與768px寬度，以鍵盤逐級調整水草擾動並讀取即時說明；控制項可聚焦、名稱與目前值可讀，頁面不得橫向溢位。
  - 遷移題改用潮間帶：學生至少提出一項生物指標、一項棲地／環境條件及重複觀察安排，答案需說明池塘模型不能直接代替潮間帶測量。
  - fallback：封鎖外部網路請求時，本地載入的角色卡、三種擾動情境、限制提示與學生文字解釋仍可操作；不依賴外部圖片或服務，也不得假稱取得即時池塘資料。
  definitionOfDone:
  - 課綱 ID、KG ID、標題與官方 locator 通過一致性檢查
