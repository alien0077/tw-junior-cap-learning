  learningGoals:
  - 區分遺傳、物種與生態系多樣性，並以池塘生物的生產、取食、分解等角色說明它們如何參與生態系功能
  - 從自編池塘調查比較物種數、角色／取食關係及一次局部擾動後的觀察，分清資料、推論和未測量條件
  - 將「多樣性高所以一定穩定」改寫成附有時間、擾動與功能範圍的證據式判斷，並遷移到潮間帶調查設計
  prerequisites:
  - 能讀懂本單元使用的基本符號、圖表或短文本
  - 能依提示完成一次預測、操作、觀察、解釋循環
  coreConcepts:
  - 多樣性有遺傳、物種、生態系三個尺度；三者不能用單一「物種數」互相替代
  - 生產者、消費者、分解者各自參與能量傳遞或物質循環；生物間與生物—環境關係共同影響系統功能
  - 穩定性判斷須指定觀察時間、空間、擾動和功能指標；物種數增加本身不足以證明穩定
  misconceptions:
  - 把種類數較多直接等同於生態系較穩定，忽略相對數量、物種角色、取食關係與棲地條件
  - 把一次局部擾動後的短期觀察推成所有季節、所有擾動下都成立的因果結論
  - 看到外來種增加「種類」便判定多樣性／穩定性提升，忽略它可能壓低原生生物或改變原有關係
  contentFlow:
  - 'predict：對照池塘生物名錄與漂浮植物覆蓋，先預測局部移除水草後哪條取食或棲地關係可能改變，並指出依據的角色。'
  - 'manipulate：用控制項切換未移除、局部移除及大幅減少水草三種情境；這是概念模型，不代表已操弄真實池塘。'
  - 'observe：同步查看兩個自編池塘樣區的物種數、角色連線和擾動後魚類活動紀錄，區分模型箭頭與實際調查資料。'
  - 'explain：各寫一項直接觀察、一項受樣區與時間限制的推論，以及一個尚未測量的替代條件。'
  - 'observe：辨認生產者、消費者、分解者與取食方向，追蹤水草／藻類到水生昆蟲、小魚及分解者回到環境的物質路徑。'
  - 'explain：連結遺傳、物種、生態系三層多樣性及生產／取食／分解功能；角色多元可能提供替代路徑，但物種數本身不保證穩定。'
  - 'transfer：將調查方法搬到潮間帶，另外記錄棲地面積、潮位、踩踏干擾及重複觀察，避免把池塘模型當成新場域實測。'
  - 'exit-ticket：用觀察時間、擾動類型、功能指標與資料界線組成條件式結論，避免單次樣本外推所有生態系。'
  visualizations:
  - system-model：以「Gc-Ⅳ-2：生物多樣性與生態系穩定」作為唯一主題，至少同步呈現兩種表徵
  - 每次變更都保留因果可追溯的標記、圖例與文字替代
  interactiveBlocks:
  - id: CUR-SCIENCE-CONTENT-GC-IV-2-I01
    component: SystemRelationshipBlock
    purpose: 操作池塘水草擾動情境，追蹤生產者、消費者、分解者之間哪些取食或物質關係可能改變，並明辨概念模型和實地證據
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        pond: 1
        disturbance: 0
    studentActions:
    - 先提交預測，不顯示正解
    - 以鍵盤或滑桿切換未移除、局部移除、大幅減少三種水草擾動情境
    - 觀察水草／藻類到水生昆蟲、小魚的示意取食路徑，以及枯葉／遺體經分解者回到環境的物質路徑
    - 以短句指出可能受影響的連線、需要在池塘實測的項目與不能由模型推出的結論
    visualRules:
    - 操作後所有相關表徵同步更新，不得只改單一數字
    - 正解揭露前保留學生預測與操作紀錄
    - 顏色不可單獨承擔意義，必須搭配標籤、符號或文字
    - 窄螢幕不得裁切核心圖、題幹與回饋
    misconceptionChecks:
    - id: MC-CUR-SCIENCE-CONTENT-GC-IV-2-I01
      trigger: 學生宣稱「物種數較多必然穩定」或把示意連線當成擾動造成族群變化的實測因果證據
      prompt: 指出目前看到的是模型連線還是池塘觀察資料；要判斷擾動效果，還需要記錄哪個生物或環境條件？
      expectedEvidence: 至少指出一條可能受擾動影響的角色關係，並舉出一項需實地觀察的生物／棲地資料與模型限制
    feedback:
      correct: 肯定其區分模型與實測的依據，再請學生把觀察計畫遷移到潮間帶。
      incorrect: 若把示意關係當作族群實測因果，先提示補記調查時間、棲地或生物數量；重答後再顯示局部例子，不直接替學生下結論。
