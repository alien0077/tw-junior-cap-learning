unitImplementationSpec:
  specVersion: '1.0'
  lessonId: cur-science-content-bb-iv-5
  knowledgeGraphIds:
  - kg-science-content-bb-iv-5
  title: Bb-Ⅳ-5：熱造成物質形態與體積改變
  subject: science
  socialDiscipline: null
  curriculumLevel: learning-content
  gradeRange:
  - '7'
  - '8'
  - '9'
  fusedScope:
    officialCurriculum: Bb-Ⅳ-5：熱造成物質形態與體積改變
    curriculumIntent: 以溫度、物態、材料與壓力條件解釋相變和熱膨脹，並以粒子模型與資料區分體積、質量及密度變化
    publisherEvidence:
      nani:
        status: pending
        required: true
      kanghsuan:
        status: pending
        required: true
      hanlin:
        status: pending
        required: true
    fusionRule: 只融合三版本共同概念與可核對差異；章節級證據雖已記錄，融合審查前不得聲稱已完成版本融合
    currentEvidenceStatus: curriculum-and-kg-grounded; lesson-unit-specific; publisher-chapter-evidence-recorded; fusion-review-pending
  learningGoals:
  - 區分熔化、凝固、汽化、凝結等物態改變與同一物態中的熱膨脹／收縮，不把兩者混為同一現象
  - 由溫度、材料與尺寸資料判斷熱膨脹趨勢，說明質量未改變時體積變化會連帶影響密度
  - 說明水在 0～4°C 附近的反常體積／密度行為是重要例外，不能用「所有物質熱脹冷縮」一語帶過
  prerequisites:
  - 能閱讀溫度—體積或溫度—長度資料表
  - 已理解粒子運動、粒子間距、物態及密度的基本概念
  coreConcepts:
  - 多數材料在同一物態、一定溫度範圍內受熱會膨脹、冷卻會收縮，但膨脹程度依材料而異
  - 相變涉及粒子排列與作用狀態改變；熱膨脹則可在物態不變時發生，兩者需由資料分開判讀
  - 固定質量下，體積增加會使平均密度下降；水在 0～4°C 附近具有反常膨脹與密度最大值約在 4°C 的特殊性
  misconceptions:
  - 認為所有物質受熱都以相同比例膨脹，或把材料差異忽略
  - 把體積變大誤認為質量增加，或把熱膨脹直接當成產生新物質
  - 用一般「熱脹冷縮」規則硬套水結冰或 0～4°C 區間，忽略水的特殊行為
  contentFlow:
  - 'hook: 比較橋梁伸縮縫、酒精溫度計、結冰水瓶與熱氣球，先分類是相變、體積變化或兩者皆涉及'
  - 'predict: 預測同長度鋁棒與玻璃棒升高相同溫度後的尺寸變化是否相同'
  - 'manipulate: 固定材料後改變溫度，或固定溫度變化後切換材料；水模式另切換 0～10°C 區間'
  - 'observe: 同步更新長度／體積、粒子間距示意、密度與物態標記'
  - 'explain: 用材料、溫度區間與是否相變說明尺寸或體積變化，並標出水的例外'
  - 'formalize: 建立熱膨脹、相變、密度與水反常行為的關係'
  - 'transfer: 以鐵軌伸縮縫、雙金屬片、溫度計、熱氣球與結冰容器做工程／生活判讀'
  - 'exit-ticket: 由一組溫度—體積資料判斷一般熱膨脹或水的反常區段並說明安全意義'
  visualizations:
  - 材料尺寸圖：同初始長度下比較金屬、玻璃等材料隨溫度的相對尺寸變化，數值明示為模型資料
  - 粒子／體積雙表徵：物態不變時粒子種類與數量不變，尺寸或平均間距隨溫度變化
  - 水 0～10°C 資料圖：明確標示 4°C 附近密度最大及冷卻至 0°C 前後的特殊趨勢，不用單一直線誤導
  interactiveBlocks:
  - id: CUR-SCIENCE-CONTENT-BB-IV-5-I01
    component: ParticleModelBlock
    purpose: 讓學生控制材料與溫度區間，觀察尺寸／體積、粒子表徵與密度如何改變，並辨認水的反常行為
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        material: aluminum
        startTempC: 20
        endTempC: 80
        phaseMode: same-phase
    studentActions:
    - 先預測鋁與玻璃在相同溫升下是否有相同尺寸變化，不顯示正解
    - 固定材料，只改變 endTempC，比較尺寸與粒子間距示意
    - 固定溫差，切換材料，比較不同膨脹程度
    - 切換 water-0-to-10 模式，標記 0～4°C 與 4～10°C 的體積／密度趨勢
    - 切換到相變情境，說明為何不能只用同一物態的熱膨脹規則解釋
    visualRules:
    - 材料與溫度改變後，尺寸／體積、密度、粒子間距文字摘要同步更新
    - 不得把粒子畫成受熱後本身變大的球；以平均間距／排列變化表徵體積改變
    - 水模式必須明確標示特殊區間，不得套用單調熱脹冷縮直線
    - 若進入相變模式，物態標籤與能量用途提示同步出現，避免將平台誤判為不再吸熱
    misconceptionChecks:
    - id: MC-CUR-SCIENCE-CONTENT-BB-IV-5-I01
      trigger: 學生說粒子本身受熱變大、所有材料膨脹量都一樣，或以一般熱脹冷縮解釋水在 0～4°C 的全部行為
      prompt: 目前改變的是粒子本身大小，還是粒子平均間距／排列？這個材料或溫度區間是否符合一般趨勢？請指出一筆尺寸或密度資料。
      expectedEvidence: 能以材料／溫度資料說明尺寸或密度變化，並正確辨認水 0～4°C 的特殊性
    feedback:
      correct: 核對材料、溫度區間與資料，再要求換一個工程情境驗證。
      incorrect: 先提示「粒子數量與本身大小是否改變？」或「水 4°C 附近資料是否例外？」再讓學生重試。
  teachingPatternRefs:
  - refId: phet-ild
    reuseDecision: inspiration-only
    application: 本課只借用先預測、單變因操作與證據修正節奏；材料尺寸與水密度資料均自編。
  - refId: phet-activity
    reuseDecision: inspiration-only
    application: 本課以工程伸縮縫、溫度計與水反常行為作原創遷移，不複製外部活動數據。
  - refId: w3c-aria
    reuseDecision: inspiration-only
    application: 材料、溫度、物態、尺寸、體積與密度變化皆提供鍵盤控制及文字狀態。
  - refId: w3c-landmarks
    reuseDecision: inspiration-only
    application: 預測、材料／溫度控制、粒子表徵、資料圖與回饋區域可導覽。
  capTransfer:
    questionType: 溫度—尺寸／體積資料判讀／粒子模型／理由短答
    stemConstraint: 更換為橋梁、鐵軌、雙金屬片、溫度計、熱氣球或結冰容器，必須提供材料與溫度條件，不能只背「熱脹冷縮」四字
    requiredResponse: 指出是否相變、材料／溫度區間與尺寸或體積趨勢，並在適用時說明密度或水的例外
    scoring: 現象分類正確 1、資料／粒子模型證據 1、例外或工程限制說明 1
  exitTicket:
    prompt: 某密閉水瓶裝滿液態水後放入冷凍庫，最後結冰造成瓶身受力。為什麼不能只用「冷縮」預測結果？請用水的特殊體積變化與物態改變說明。
    successCriteria:
    - 指出水在接近 0°C 及結冰時不符合簡化的「所有物質冷卻都收縮」敘述
    - 說明結冰涉及物態與排列改變，體積可增加而對瓶身施力
    - 不把體積增加說成水的質量增加或粒子本身變大
  expressionExtension:
    applicable: false
    task: 用 80～120 字說明為什麼橋梁需要伸縮縫，但裝滿水的玻璃瓶冷凍破裂又不能只用一般熱脹冷縮解釋
    constraint: 學生先寫；系統只提示材料、溫度區間、物態與水的例外，不直接代寫完整答案
  mobileA11y:
    breakpoints:
    - 320
    - 375
    - 768
    touchTargetMinPx: 44
    keyboardAlternative: true
    screenReader: 材料、溫度、物態、尺寸／體積、密度與水例外皆有可讀文字狀態
    reducedMotion: 停用動畫仍可用數值表與靜態粒子圖完成比較
  testCases:
  - 未提交材料熱膨脹預測前不得顯示完整解說。
  - 固定材料提高溫度時，同一物態模型依材料規則更新尺寸／體積，粒子本身大小保持不變。
  - 固定溫差切換材料時膨脹程度可不同，不得所有材料共用同一數值。
  - water-0-to-10 模式須正確呈現 4°C 附近密度最大與 0～4°C 特殊趨勢。
  - 相變模式需明確區分相變與同一物態熱膨脹，不能以一條熱膨脹直線跨越全部狀態。
  - 學生以「粒子受熱變大」或「水一定冷縮」作答時命中迷思診斷。
  - 320／375／768px 與鍵盤操作下，材料、溫度、資料圖、粒子圖與回饋不得裁切。
  - fallback 至少保留三組材料尺寸資料、水 0～10°C 表格及相變辨識題，可完成預測—比較—解釋—transfer。
  definitionOfDone:
  - 課綱 ID、KG ID、標題與官方 locator 通過一致性檢查
  - 互動實際操作材料、溫度或物態，不含 primary／secondary 假變項
  - 至少診斷一次粒子變大、所有材料同膨脹或水例外迷思
  - CAP transfer、exit ticket、mobile、keyboard、screen reader、reduced-motion 與 fallback 可執行
  - 內容與教學法無 placeholder、TODO 或只換名詞模板
  status:
    designStatus: specified
    implementationStatus: implemented
    qaStatus: untested
