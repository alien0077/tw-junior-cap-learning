  - '8'
  - '9'
  fusedScope:
    officialCurriculum: Aa-Ⅳ-5：元素與化合物符號
    curriculumIntent: Aa-Ⅳ-5：元素與化合物符號
    publisherEvidence:
      nani:
        status: pending
        required: true
      kanghsuan:
        status: pending
        required: true
      hanlin:
        status: pending
        required: true
    fusionRule: 只融合三版本共同概念與可核對差異；章節級證據雖已記錄，融合審查前不得聲稱已完成版本融合
    currentEvidenceStatus: curriculum-and-kg-grounded; publisher-chapter-evidence-recorded; fusion-review-pending
  learningGoals:
  - 正確辨認元素符號大小寫與常見化學式中的元素種類
  - 區分元素符號、化學式下標與前方係數所代表的層次
  - 由化學式重建粒子組成，並由粒子圖寫回符號表示
  prerequisites:
  - 能辨認英文字母大小寫
  - 已理解元素與化合物的基本差別
  coreConcepts:
  - 元素符號第一字母大寫，第二字母若有則小寫
  - 化學式下標表示單一粒子或最簡比例中的原子數／比例
  - 係數表示有多少個粒子，不改變單一粒子的化學式
  misconceptions:
  - 把 Co 與 CO、Cl 與 CI 等大小寫或字母混淆
  - 把 2H2O 寫成 H4O2 並誤認為同一個水分子
  - 看到化學式含多種元素就把它當成混合物
  contentFlow:
  - 'hook: 用 Co、CO、Cl 等易混符號測試大小寫是否改變意義'
  - 'predict: 先把符號配對到粒子卡'
  - 'manipulate: 拖曳元素符號、下標與係數組成化學式'
  - 'observe: 同步更新粒子圖與元素／原子計數'
  - 'explain: 說明每個數字位於哪裡、代表哪個層次'
  - 'transfer: 由陌生粒子圖反寫化學式並檢查大小寫'
  - 'exit-ticket: 修正一個含大小寫或係數錯誤的表示'
  visualizations:
  - 符號拼裝器：元素符號、右下標與前方係數使用不同位置與文字標籤
  - 粒子圖同步顯示每個粒子內的原子組成與整批粒子數
  interactiveBlocks:
  - id: CUR-SCIENCE-CONTENT-AA-IV-5-I01
    component: EvidenceLabBlock
    purpose: 讓學生實際組裝與拆解化學符號，從位置辨認元素符號、下標與係數的不同意義
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        formula: H2O
        coefficient: 1
    studentActions:
    - 先判斷 Co、CO 等符號是否代表相同內容
    - 拖曳符號與數字建立指定粒子
    - 由同步粒子圖核對元素種類與原子數
    - 加入係數後說明單一粒子組成是否改變
    visualRules:
    - 大小寫、下標位置與係數位置必須視覺及文字雙重標示
    - 粒子圖與原子計數隨符號操作同步更新
    - 錯誤拼法不得自動靜默修正，需顯示可理解的錯誤原因
    misconceptionChecks:
    - id: MC-CUR-SCIENCE-CONTENT-AA-IV-5-I01
      trigger: 混淆元素符號大小寫，或把係數當成下標
      prompt: 請先圈出元素符號，再分別指出右下角數字與化學式前方數字代表什麼。
      expectedEvidence: 正確辨認元素符號、下標與係數三層資訊
    feedback:
      correct: 指出符號位置與粒子圖一致，再用另一個化學式驗證。
      incorrect: 先提示大小寫與數字位置，再要求重建，不直接給完整答案。
