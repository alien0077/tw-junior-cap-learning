    currentEvidenceStatus: curriculum-and-kg-grounded; hanlin-direct-content-read; nani-kanghsuan-content-pending; unit-fusion-authored; global-review-pending
  learningGoals:
  - 依序利用磁性、溶解度與粒徑，設計鐵屑、食鹽及細砂的分離流程
  - 預測各步驟濾渣、濾液、洗液與回收物的成分，並解釋為何乾鹽砂不可直接靠過濾分開
  - 依回收目標區分蒸發結晶與蒸餾的物質去向；以質量、殘留及再檢驗證據說明回收率與純度限制
  - 說明簡易濾紙色層分析與漏斗過濾利用的物性差異不同
  prerequisites:
  - 能區分混合物成分，辨認物質的磁性、溶解性與顆粒大小
  - 能依操作順序記錄材料、觀察及回收結果
  coreConcepts:
  - 分離流程必須由目標成分和可利用的物性差異決定
  - 溶解度使鹽進入液相；過濾再按顆粒大小截留未溶砂
  - 蒸發結晶與蒸餾的回收物不同；蒸餾在本課僅作目標導向延伸
  - 濾渣、濾液、洗液、晶體和器材殘留構成物料去向證據
  - 紙層析依不同吸附／移動差異分離色素，不等同漏斗過濾
  misconceptions:
  - 以為乾食鹽和乾細砂可直接用濾紙彼此分開
  - 以為濾液只有水，或以為溶解已等同完成分離
  - 以為洗下來的鹽水可以丟棄而不影響回收量
  - 以白色外觀直接判定鹽晶純，或把蒸發散失的水算作已回收
  - 把色層分析說成只依顆粒大小的普通過濾
  contentFlow:
  - 'predict: 從混合採樣罐辨認欲回收成分及物性差異，先預測分離順序和可能物料去向'
  - 'manipulate: 依序磁選鐵屑、溶解食鹽、過濾細砂並洗滌殘渣；依回收目標選結晶或蒸餾'
  - 'observe: 逐項盤點磁鐵殘留、濾渣、濾液、洗液、晶體與冷凝水，核對質量差及可能損失'
  - 'explain: 以磁性、溶解度、顆粒大小與揮發差異說明各步依據，辨別結晶／蒸餾產物和證據限制'
  - 'transfer: 以紙層析分離墨水色素，引用固定相／溶劑造成移動差異的證據，說明其不同於漏斗過濾'
  visualizations:
  - 以操作序列和物質流向表同步呈現每一成分的分流位置
  - 用標籤明示磁鐵、濾渣、濾液、洗液、晶體與冷凝水，不以顏色單獨傳意
  - 各階段顯示利用的物性、目標回收物與可能殘留；未操作蒸餾時不得假裝有實測冷凝水
  interactiveBlocks:
  - id: CUR-SCIENCE-CONTENT-CA-IV-1-I01
    component: EvidenceLabBlock
    purpose: 讓學生逐站追蹤鐵屑—鹽—砂的分離去向，並以回收目標判斷何時結晶、何時才需要蒸餾
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        processStep: 0
        recoveryTarget: salt-only
    studentActions:
    - 先預測磁選及溶解過濾後各容器中的成分
    - 逐步操作磁選、加水攪拌、過濾／洗滌與回收選擇
    - 切換「只回收鹽／鹽和水都回收」，比較蒸發與蒸餾的去向差異
    - 以物料流向和回收質量說明可能損失、污染及未能確認的純度
    visualRules:
    - 操作後所有相關表徵同步更新，不得只改單一數字
    - 正解揭露前保留學生預測與操作紀錄
    - 顏色不可單獨承擔意義，必須搭配標籤、符號或文字
    - 窄螢幕不得裁切核心圖、題幹與回饋
    misconceptionChecks:
    - id: MC-CA-IV-1-DRY-FILTER
      trigger: 學生選擇直接過濾乾燥食鹽與細砂
      prompt: 兩種乾燥顆粒都比濾紙孔隙大時，各自會留在哪裡？過濾能否讓它們分流？
      expectedEvidence: 指出兩者都留在濾紙，並提出先用水溶解食鹽再過濾的替代流程
    - id: MC-CA-IV-1-FILTRATE
      trigger: 學生把濾液判為只有水或把洗液丟棄
      prompt: 食鹽在溶解後去了哪個容器？洗砂時流出的鹽水要如何處理？
      expectedEvidence: 說明濾液／洗液含水與溶解食鹽，應併回以保留目標物
    - id: MC-CA-IV-1-EVAPORATION
      trigger: 學生把蒸發皿殘留當成已回收的水，或只憑白色判純
      prompt: 蒸氣去了哪裡？白色外觀足以證明單一成分嗎？
      expectedEvidence: 區分蒸發的鹽殘留與散失水，並指出外觀不足以證明純度
    feedback:
      correct: 具體指出物性、物質去向與回收目標彼此吻合之處，再要求在紙層析色素任務中遷移。
      incorrect: 對應乾過濾、濾液成分或蒸發去向給不同提示；先要求追蹤一種物質，不直接揭露整條流程。
