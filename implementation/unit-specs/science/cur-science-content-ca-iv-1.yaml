  capTransfer:
    questionType: 分離流程資料判讀與理由短答
    stemConstraint: 用有色墨水與濾紙的新情境，判斷色層分析和漏斗過濾的差異，不重用食鹽砂例題
    requiredResponse: 說明色帶分開與溶劑前緣、紙上吸附／移動差異的關係，並指出本模型無法代替實驗量測
    scoring: 方法依據正確 1、證據對應 1、限制說明 1
  exitTicket:
    prompt: 若洗砂液被倒掉，哪一種回收物會減少？用流程中的物質去向說明原因。
    successCriteria:
    - 指出洗液仍含溶解食鹽
    - 說明丟棄洗液使鹽未進入回收步驟
    - 以濾液／洗液去向或質量差支持判斷
  expressionExtension:
    applicable: false
    task: 用 80～120 字／英文短段落，將「Ca-Ⅳ-1：實驗分離混合物」的證據、因果或觀察說給同學聽
    constraint: 學生先寫；系統只給一階回饋，不直接代寫完整答案
  mobileA11y:
    breakpoints:
    - 320
    - 375
    - 768
    touchTargetMinPx: 44
    keyboardAlternative: true
    screenReader: 每個控制項有名稱、目前值、操作結果與錯誤回饋
    reducedMotion: 停用自動動畫仍可逐步操作
  testCases:
  - 初始頁顯示採樣罐三成分與任務，不提前列出完整流程答案；操作步驟可由鍵盤逐步前進及返回。
  - 磁選後標示鐵屑與鹽砂殘料；加水過濾後標示細砂濾渣、鹽水濾液及洗液去向。
  - 觸發直接乾過濾時回饋指出兩種固體同留濾紙；觸發丟棄洗液時回饋指出鹽的回收損失。
  - 「只取鹽／還要取水」選擇必須更新產物去向與回饋，不能把蒸發散失水標為回收物。
  - 轉移至獨立色層情境，要求學生指出固定相／溶劑造成不同移動的證據及模型限制。
  - 320px、375px、768px 下以鍵盤完成流程，題幹、階段按鈕、物質去向及回饋均不溢位。
  - 無外部資料時，所有文字、流程與回饋由本地 lesson data 完成，不依賴遠端服務。
  - fallback：外部資料或流程圖失效時，使用本地原創混合物資料及文字物料流表完成分離判斷；不得把未回收成分標成已回收。
