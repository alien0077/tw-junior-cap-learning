unitImplementationSpec:
  specVersion: '1.0'
  lessonId: cur-science-content-ba-iv-7
  knowledgeGraphIds:
  - kg-science-content-ba-iv-7
  title: Ba-Ⅳ-7：力學能、動能與位能互換
  subject: science
  socialDiscipline: null
  curriculumLevel: learning-content
  gradeRange: ['7', '8', '9']
  fusedScope:
    officialCurriculum: Ba-Ⅳ-7：力學能、動能與位能互換
    curriculumIntent: 由高度、速度與摩擦條件追蹤動能、重力位能及力學能的互換
    publisherEvidence:
      nani: {status: pending, required: true}
      kanghsuan: {status: pending, required: true}
      hanlin: {status: pending, required: true}
    fusionRule: 未完成三版本章節融合前，只以官方課綱、KG 與可核對公開方向原創撰寫
    currentEvidenceStatus: curriculum-and-kg-grounded; publisher-fusion-review-pending
  learningGoals:
  - 由物體高度與速度判讀重力位能和動能的相對變化
  - 在忽略摩擦的模型中說明動能與位能互換、力學能保持不變
  - 加入摩擦後辨認力學能減少所對應的內能等其他能量增加，不說成總能量消失
  prerequisites:
  - 能區分速度、高度與質量等物理量
  - 已理解能量守恆及摩擦可使機械能轉成內能
  coreConcepts:
  - 動能與運動狀態有關，重力位能與相對高度及物體—地球系統有關
  - 無摩擦模型中，下降時位能減少、動能增加；上升時相反，力學能維持
  - 有摩擦時力學能可轉成內能等其他形式，因此力學能不一定守恆，但總能量仍守恆
  misconceptions:
  - 認為物體下降時位能消失而不是轉成其他能量
  - 認為速度最大的位置必定也是位能最大的位置
  - 把「力學能不守恆」誤寫成「總能量不守恆」
  contentFlow:
  - 'hook: 小球由斜坡高處釋放，先預測頂端、中段與底端的速度及能量分配'
  - 'predict: 在無摩擦與有摩擦兩種條件下先畫能量柱'
  - 'manipulate: 固定質量與起點，只改變位置或摩擦大小'
  - 'observe: 同步更新高度、速度、動能、位能、內能及力學能柱狀圖'
  - 'explain: 比較無摩擦的動位能互換與有摩擦的力學能轉出路徑'
  - 'transfer: 雲霄飛車、單擺與滑板坡道的能量判讀'
  - 'exit-ticket: 說明有摩擦時為何力學能變少但總能量不消失'
  visualizations:
  - 軌道位置圖與速度箭頭同步顯示
  - 動能、重力位能、力學能與內能柱狀圖；無摩擦時 KE+PE 固定，有摩擦時另列內能
  interactiveBlocks:
  - id: CUR-SCIENCE-CONTENT-BA-IV-7-I01
    component: PhenomenonSimulationBlock
    purpose: 讓學生移動物體位置並切換摩擦，直接比較動能、位能與力學能的互換及轉出
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        position: top
        frictionLevel: none
        massKg: 1
    studentActions:
    - 先預測頂端、中段、底端的動能與位能相對大小
    - 在無摩擦模式逐點移動位置，觀察速度與能量柱
    - 只切換摩擦大小，重做相同位置比較
    - 用能量柱說明力學能減少時哪一種其他能量增加
    visualRules:
    - 無摩擦模式中動能與位能可以互換，但 KE+PE 柱總和須保持一致
    - 有摩擦模式不得把缺少的力學能刪除，必須另列內能或跨界能量
    - 速度、高度與能量柱同步，不得只靠動畫快慢呈現
    - 所有能量形式均有文字及數值／相對量標記，不只靠顏色
    misconceptionChecks:
    - id: MC-CUR-SCIENCE-CONTENT-BA-IV-7-I01
      trigger: 學生把位能或力學能減少說成能量消失，或認為速度最大處位能也最大
      prompt: 這個位置的高度與速度各是多少？少掉的力學能在有摩擦模式下轉成哪種能量？
      expectedEvidence: 能以高度、速度和能量柱指出動位能互換，並在有摩擦時補列內能
    feedback:
      correct: 核對位置、速度與能量分配，再換到另一軌道情境。
      incorrect: 先提示分別看高度、速度與內能柱，不直接給完整答案。
  teachingPatternRefs:
  - refId: phet-ild
    reuseDecision: inspiration-only
    application: 只借用預測—操作—能量圖對照的節奏；軌道與數據均為本課自編。
  - refId: w3c-aria
    reuseDecision: inspiration-only
    application: 位置、摩擦、速度與各能量柱提供鍵盤操作及文字摘要。
  capTransfer:
    questionType: 能量圖／軌跡圖／理由短答
    stemConstraint: 更換雲霄飛車、單擺或坡道，但需同時判讀高度、速度與摩擦條件
    requiredResponse: 指出動能、位能、力學能與其他能量的變化
    scoring: 動位能判讀 1、摩擦處理 1、守恆解釋 1
  exitTicket:
    prompt: 小車由相同高度滑下，粗糙軌道底端速度較小。能否說能量消失？請用力學能與內能說明。
    successCriteria:
    - 指出粗糙軌道底端動能較小
    - 指出一部分力學能轉成小車／軌道內能等形式
    - 說明總能量仍遵守守恆
  expressionExtension:
    applicable: false
    task: 用能量柱與短文比較無摩擦和有摩擦坡道
    constraint: 學生先寫；系統只給分層提示
  mobileA11y:
    breakpoints: [320, 375, 768]
    touchTargetMinPx: 44
    keyboardAlternative: true
    screenReader: 位置、高度、速度、摩擦及各能量值都有文字狀態
    reducedMotion: 關閉動畫後仍可逐位置閱讀能量資料
  testCases:
  - 無摩擦模式逐位置切換時 KE+PE 總和保持一致。
  - 有摩擦模式中力學能減少必須伴隨內能等其他形式增加。
  - 速度最大處不得同時錯誤顯示為最高重力位能。
  - 把力學能減少說成總能量消失時必須命中迷思診斷。
  - mobile、keyboard、screen reader 與 fallback 均可完成位置與能量比較。
  definitionOfDone:
  - 課綱 ID、KG ID、標題與官方 locator 一致
  - 互動實際控制位置與摩擦，而非 primary／secondary 假變項
  - 力學能與總能量守恆的差異被實際診斷
  - transfer、exit ticket 與可及性流程可執行
  - 無 placeholder、TODO 或只換名詞模板
  status:
    designStatus: specified
    implementationStatus: implemented
    qaStatus: untested
