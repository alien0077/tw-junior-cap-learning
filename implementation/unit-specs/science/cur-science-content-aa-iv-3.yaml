    fusionRule: 只融合三版本共同概念與可核對差異；章節級證據雖已記錄，融合審查前不得聲稱已完成版本融合
    currentEvidenceStatus: curriculum-and-kg-grounded; publisher-chapter-evidence-recorded; fusion-review-pending
  learningGoals:
  - 由粒子種類與固定組成區分元素、化合物與混合物
  - 說明化合物形成後具有不同於組成元素的整體性質
  - 依分離方式與組成是否固定判斷混合物與純物質
  prerequisites:
  - 能辨認粒子模型中的不同原子種類
  - 能區分物理分離與形成新物質的化學變化
  coreConcepts:
  - 元素由同一種元素的原子構成；化合物由不同元素依固定比例化合
  - 混合物含兩種以上物質且組成比例可變，通常可用物理性質分離
  - 化合物的性質不能由組成元素的單獨性質直接相加推得
  misconceptions:
  - 認為只要含兩種元素就是混合物
  - 認為化合物一定保留各元素原本的顏色、導電或反應性
  - 把均勻外觀當成單一純物質的充分證據
  contentFlow:
  - 'hook: 比較鐵與硫的混合物、反應後產物與單一元素粒子圖'
  - 'predict: 先依粒子模型分類，不先看名稱'
  - 'manipulate: 改變粒子是否固定成組、種類數與組成比例'
  - 'observe: 同步更新分類樹、可否物理分離與比例是否固定'
  - 'explain: 用粒子證據說明元素／化合物／混合物分類'
  - 'transfer: 判讀陌生粒子圖與實驗分離資料'
  - 'exit-ticket: 寫出分類與兩項支持證據'
  visualizations:
  - 粒子分類工作台：同種原子、固定異種組合、可變混合三種模型並列
  - 證據卡：組成是否固定、能否物理分離、是否形成新性質
  interactiveBlocks:
  - id: CUR-SCIENCE-CONTENT-AA-IV-3-I01
    component: EvidenceLabBlock
    purpose: 讓學生拖入不同粒子並改變比例，依固定組成與可分離性判斷元素、化合物或混合物
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        particleTypes: 1
        bondedPattern: false
        ratioLocked: false
    studentActions:
    - 先依粒子圖預測分類
    - 改變粒子種類、是否固定成組及比例是否可變
    - 選取支持分類的組成與分離證據
    - 用一句話說明為何均勻外觀仍不足以分類
    visualRules:
    - 改變固定成組或比例後，分類提示與粒子圖同步更新
    - 不以顏色單獨區分元素，粒子必須有 A、B 等文字標記
    - 顯示「模型證據」而非宣稱為真實粒子照片
    misconceptionChecks:
    - id: MC-CUR-SCIENCE-CONTENT-AA-IV-3-I01
      trigger: 看到兩種元素就一律選混合物，或以均勻外觀判定純物質
      prompt: 請檢查不同原子是否以固定比例形成同一種粒子，以及組成比例能否任意改變。
      expectedEvidence: 能以固定組成／可變比例而非外觀完成分類
    feedback:
      correct: 指出固定組成或可分離性證據，再要求以新粒子圖驗證。
      incorrect: 先提示觀察「是否固定成組」與「比例能否改變」，再讓學生重試。
