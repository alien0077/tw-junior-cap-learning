        status: pending
        required: true
    fusionRule: 只融合三版本共同概念與可核對差異；章節級證據雖已記錄，融合審查前不得聲稱已完成版本融合
    currentEvidenceStatus: curriculum-and-kg-grounded; publisher-chapter-evidence-recorded; fusion-review-pending
  learningGoals:
  - 讀懂相對原子質量是以碳-12 為基準的比較值，不把它當成單一原子的克數
  - 依化學式下標逐項加總相對原子質量，求相對分子質量或式量
  - 分辨下標與係數：下標改變單一粒子組成，係數只改變粒子數量
  prerequisites:
  - 能辨認元素符號與化學式下標
  - 能完成整數與小數的乘加運算
  coreConcepts:
  - 相對原子質量是無單位的相對比較值
  - 相對分子質量或式量等於化學式中各原子的相對原子質量乘下標後加總
  - 係數不改變單一分子的相對分子質量
  misconceptions:
  - 把相對原子質量寫成 g 或當成樣品實際質量
  - 把 3H2O 的係數 3 併入單一 H2O 分子的下標
  - 漏乘下標或只加元素種類而不計原子數
  contentFlow:
  - 'hook: 比較 H2O、H2O2 與 3H2O，先預測哪個改變單一粒子質量'
  - 'predict: 先選擇下標或係數改變的效果，不揭露答案'
  - 'manipulate: 調整 H、O 等元素下標或粒子係數'
  - 'observe: 同步更新粒子圖、逐項算式與單一粒子／整批總相對量'
  - 'explain: 說明為何下標會改變單一粒子組成而係數不會'
  - 'transfer: 以 CO2、CaCO3 等陌生化學式重做質量帳本'
  - 'exit-ticket: 寫出一個逐項加總算式並指出是否有單位'
  visualizations:
  - 化學式積木：元素符號、下標與前方係數分層呈現
  - 質量帳本：每列顯示相對原子質量 × 下標，最後加總；係數另列整批粒子數
  interactiveBlocks:
  - id: CUR-SCIENCE-CONTENT-AA-IV-2-I01
    component: ParticleModelBlock
    purpose: 讓學生操作下標與係數，直接比較單一粒子組成、相對分子質量與整批粒子數的差別
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        hydrogenSubscript: 2
        oxygenSubscript: 1
        coefficient: 1
    studentActions:
    - 先預測把 H2O 改成 H2O2 或 3H2O 時，哪一種操作會改變單一粒子的相對分子質量
    - 以鍵盤可操作控制項分別改變下標與係數
    - 對照粒子圖與逐項加總算式
    - 說明單一粒子與整批粒子兩個層次
    visualRules:
    - 下標改變時粒子圖與單一粒子質量同步更新；係數改變時只複製粒子數並另算整批總量
    - 相對質量欄明示「無單位比較值」，不得顯示 g
    - 顏色須搭配元素符號與數字標籤
    misconceptionChecks:
    - id: MC-CUR-SCIENCE-CONTENT-AA-IV-2-I01
      trigger: 把係數併入下標、漏乘下標，或替相對原子質量加上 g
      prompt: 請指出目前是在算「一個粒子的組成」還是「有幾個粒子」，並重寫逐項加總式。
      expectedEvidence: 能區分下標與係數，且相對質量不加 g
    feedback:
      correct: 指出下標、係數與加總式的對應，再用新化學式驗證。
      incorrect: 先提示數字位於元素右下角或化學式前方，再要求重試，不直接代算。
