unitImplementationSpec:
  specVersion: '1.0'
  lessonId: cur-science-content-bb-iv-2
  knowledgeGraphIds:
  - kg-science-content-bb-iv-2
  title: Bb-Ⅳ-2：熱量單位的定義
  subject: science
  socialDiscipline: null
  curriculumLevel: learning-content
  gradeRange:
  - '7'
  - '8'
  - '9'
  fusedScope:
    officialCurriculum: Bb-Ⅳ-2：熱量單位的定義
    curriculumIntent: 由可重現的水升溫基準理解 cal、kcal、J 的能量意義，並以 Q＝mcΔT 檢查質量、比熱、溫差與熱量的關係
    publisherEvidence:
      nani:
        status: pending
        required: true
      kanghsuan:
        status: pending
        required: true
      hanlin:
        status: pending
        required: true
    fusionRule: 只融合三版本共同概念與可核對差異；章節級證據雖已記錄，融合審查前不得聲稱已完成版本融合
    currentEvidenceStatus: curriculum-and-kg-grounded; lesson-unit-specific; publisher-chapter-evidence-recorded; fusion-review-pending
  learningGoals:
  - 區分溫度、熱傳遞與熱量，知道 cal、kcal、J 都是能量單位而不是溫度單位
  - 由 1 g 水升高 1°C 的教學基準理解卡路里定義，正確處理 1 kcal＝1000 cal 與 1 cal 約 4.184 J
  - 在無相變且比熱近似固定時，用 Q＝mcΔT 比較質量、比熱、溫差與所需熱量，並指出容器吸熱與散熱造成的偏差
  prerequisites:
  - 能計算溫差並進行比例、乘除與基本單位換算
  - 能從表格辨認質量、初溫、末溫及加熱條件
  coreConcepts:
  - 熱量是因能量傳遞而計量的能量，cal 與 J 是能量單位；°C 是溫度或溫差單位
  - 在指定教學條件下，1 cal 約為使 1 g 水升高 1°C 所需的熱量；1 kcal＝1000 cal，1 cal 約 4.184 J
  - Q＝mcΔT 的成立需留意相變、比熱近似、系統邊界、容器吸熱及向環境散熱
  misconceptions:
  - 把 1 cal 寫成「1°C 的熱」或把 kcal 當成溫度
  - 把食品 100 kcal 誤寫成 100 cal，或在 cal/J 換算時把 4.184 乘除方向顛倒
  - 套用 Q＝mcΔT 時漏掉質量、溫差或比熱單位，或在相變平台仍把吸收的能量全算成升溫
  contentFlow:
  - 'hook: 比較 1 g、10 g 水各升高 1°C 需要的能量，先預測哪一個對應 1 cal 的基準'
  - 'predict: 在不揭露答案前預測質量或溫差加倍時理想熱量如何改變'
  - 'manipulate: 固定材料後調整水質量與目標溫差，再切換 cal／J 顯示'
  - 'observe: 同步更新 Q＝mcΔT 分項、cal／J 換算與溫度—時間資料'
  - 'explain: 說明每個數值的物理量與單位，並指出實測與理想值差異可能來自何處'
  - 'formalize: 建立 cal、kcal、J 與 Q＝mcΔT 的使用條件'
  - 'transfer: 以食品標示、熱量計及不同金屬受熱資料判讀'
  - 'exit-ticket: 完成一題含單位換算與模型限制的熱量估算'
  visualizations:
  - 水升溫基準卡：質量、初溫、末溫、ΔT 與理想熱量並列，明示定義條件
  - 熱量帳本：m、c、ΔT、Q 四欄同步更新，cal 與 J 以同一能量雙單位顯示
  - 實測／理想比較：容器吸熱與散熱以能量分流標記，不把誤差偽裝成公式失效
  interactiveBlocks:
  - id: CUR-SCIENCE-CONTENT-BB-IV-2-I01
    component: EvidenceLabBlock
    purpose: 讓學生調整水的質量與溫差，從 Q＝mcΔT 與 cal/J 雙單位檢查熱量單位定義和比例關係
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        massG: 1
        deltaTempC: 1
        material: water
        displayUnit: cal
    studentActions:
    - 先預測 1 g 水升高 1°C、10 g 水升高 1°C、1 g 水升高 10°C 的理想熱量關係
    - 以鍵盤可操作控制改變 massG 與 deltaTempC，每次只改一項比較比例
    - 切換 cal、kcal、J 顯示並核對同一能量的數值換算
    - 切換材料時讀取不同 c 值，說明為何同質量同 ΔT 的 Q 不一定相同
    - 標記模型適用條件並說明容器吸熱、散熱或相變為何需要另行處理
    visualRules:
    - massG 或 deltaTempC 改變時，m、c、ΔT、Q 與雙單位值同步更新
    - 1 kcal 必須固定等於 1000 cal；cal/J 顯示以約 4.184 J/cal 換算並清楚標示近似
    - °C 只出現在溫度或溫差欄，不能出現在熱量單位欄
    - 若切換到相變情境，明示 Q＝mcΔT 單獨不足，不可繼續把全部能量算成溫升
    misconceptionChecks:
    - id: MC-CUR-SCIENCE-CONTENT-BB-IV-2-I01
      trigger: 學生把 cal/kcal 當溫度、把 1 kcal 當 1 cal、或漏用質量／溫差直接從最高溫猜熱量
      prompt: 請指出目前比較的是哪個物理量；m、c、ΔT 各是多少？同一能量改用 J 表示時應只換單位還是改變物理結果？
      expectedEvidence: 正確列出 m、c、ΔT，區分 °C 與 cal/J，並保持 cal/J 換算前後能量等價
    feedback:
      correct: 核對公式各項與單位，再要求改變一項條件驗證比例關係。
      incorrect: 先提示「°C 是溫度、cal/J 是能量」或要求補寫 m×c×ΔT，不直接代算最終答案。
  teachingPatternRefs:
  - refId: phet-ild
    reuseDecision: inspiration-only
    application: 本課只借用先預測、單變因操作與證據回查節奏；水樣資料、公式帳本與換算題均為本課自編。
  - refId: phet-activity
    reuseDecision: inspiration-only
    application: 本課用質量與溫差對照建立比例，不複製外部活動數據。
  - refId: w3c-aria
    reuseDecision: inspiration-only
    application: 質量、溫差、材料、單位與計算結果都提供鍵盤控制及文字狀態。
  - refId: w3c-landmarks
    reuseDecision: inspiration-only
    application: 預測、控制、計算帳本、限制與回饋分區可導覽。
  capTransfer:
    questionType: 熱量計算／單位換算／資料判讀
    stemConstraint: 更換水量、材料或食品標示情境，必須要求辨認 m、c、ΔT 或 cal/kcal/J 單位，不能只背換算數字
    requiredResponse: 寫出使用的物理量與單位、完成計算或換算，並指出公式適用的一項限制
    scoring: 物理量與公式正確 1、單位／換算正確 1、模型限制說明 1
  exitTicket:
    prompt: 理想情況下，50 g 水由 20°C 加熱到 24°C。若取水的比熱為 1 cal/(g·°C)，需要多少 cal？約等於多少 J？若實驗加熱器實際輸入更多能量，請寫一個合理原因。
    successCriteria:
    - 算出 Q＝50×1×4＝200 cal
    - 以 1 cal 約 4.184 J 換算為約 837 J，並把 J 當能量單位
    - 指出容器吸熱、向環境散熱或其他合理能量分流之一
  expressionExtension:
    applicable: false
    task: 用 80～120 字向同學解釋為什麼「100 kcal」不是「100°C」，以及 kcal、cal、J 三者如何比較
    constraint: 學生先寫；系統只提示物理量、1000 倍關係與 J 換算，不直接代寫完整答案
  mobileA11y:
    breakpoints:
    - 320
    - 375
    - 768
    touchTargetMinPx: 44
    keyboardAlternative: true
    screenReader: m、c、ΔT、Q、cal/kcal/J 與模型限制都有可讀文字狀態
    reducedMotion: 停用動畫仍可用數值表完成所有比較
  testCases:
  - 未提交質量／溫差比例預測前不得顯示完整計算說明。
  - massG 加倍且其他條件固定時，理想 Q 同比例加倍；deltaTempC 加倍亦同。
  - cal、kcal、J 切換只改表示數值與單位，不得改變同一能量的物理結果。
  - 學生把 1 kcal＝1 cal 或把 °C 當熱量單位時，命中迷思診斷並要求重寫單位。
  - 切換材料時 c 值和 Q 同步更新；不能假定所有材料 c＝1 cal/(g·°C)。
  - 相變情境必須顯示 Q＝mcΔT 單獨不足的限制提示。
  - 320／375／768px 與鍵盤操作下，公式、單位、控制項和回饋不得裁切。
  - fallback 至少保留三組靜態 m/c/ΔT 資料與 cal/J 換算題，可完成預測—計算—限制說明。
  definitionOfDone:
  - 課綱 ID、KG ID、標題與官方 locator 通過一致性檢查
  - 互動實際操作質量、溫差、材料與單位，不含 primary／secondary 假變項
  - 至少診斷一次溫度／熱量、kcal/cal 或公式適用條件迷思
  - CAP transfer、exit ticket、mobile、keyboard、screen reader、reduced-motion 與 fallback 可執行
  - 內容與教學法無 placeholder、TODO 或只換名詞模板
  status:
    designStatus: specified
    implementationStatus: implemented
    qaStatus: untested
