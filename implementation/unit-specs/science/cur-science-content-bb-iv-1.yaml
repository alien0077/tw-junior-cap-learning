unitImplementationSpec:
  specVersion: '1.0'
  lessonId: cur-science-content-bb-iv-1
  knowledgeGraphIds:
  - kg-science-content-bb-iv-1
  title: Bb-Ⅳ-1：熱由高溫處傳向低溫處
  subject: science
  socialDiscipline: null
  curriculumLevel: learning-content
  gradeRange:
  - '7'
  - '8'
  - '9'
  fusedScope:
    officialCurriculum: Bb-Ⅳ-1：熱由高溫處傳向低溫處
    curriculumIntent: 由溫差、接觸與時間資料判斷熱傳遞方向、熱平衡及隔熱對傳熱速率的影響
    publisherEvidence:
      nani:
        status: pending
        required: true
      kanghsuan:
        status: pending
        required: true
      hanlin:
        status: pending
        required: true
    fusionRule: 只融合三版本共同概念與可核對差異；章節級證據雖已記錄，融合審查前不得聲稱已完成版本融合
    currentEvidenceStatus: curriculum-and-kg-grounded; lesson-unit-specific; publisher-chapter-evidence-recorded; fusion-review-pending
  learningGoals:
  - 由兩物體初始溫度判斷自發熱傳遞方向，並以溫度隨時間接近解釋熱平衡
  - 區分溫度、熱量與傳熱速率，不把「較熱」直接等同「含有較多熱量」
  - 比較相同初溫條件下不同材料或隔熱設計的降溫曲線，說明隔熱改變速率而不反轉熱流方向
  prerequisites:
  - 能比較攝氏溫度大小並閱讀簡單溫度—時間表格或折線圖
  - 能分辨「物體目前的溫度」與「能量正在由哪裡傳到哪裡」是不同問題
  coreConcepts:
  - 有溫差且可交換能量時，淨熱傳遞自高溫處朝低溫處進行，直到接近熱平衡
  - 熱是因溫差造成的能量傳遞，不是物體內儲存的一種「熱物質」；冷也不是會流動的物質
  - 隔熱材料、接觸方式與傳導／對流／輻射條件可改變傳熱速率，但不會讓自發熱流由低溫流向高溫
  misconceptions:
  - 說冰塊把「冷」傳給飲料，而不是飲料把能量傳給較低溫的冰塊
  - 認為金屬摸起來較冷代表金屬本身溫度一定較低，忽略導熱速率差異
  - 認為保溫杯會製造熱、完全阻止熱傳遞，或能把熱流方向反轉
  contentFlow:
  - 'hook: 將 80°C 熱水與 20°C 金屬塊置於可交換能量的系統，先預測兩者溫度變化方向'
  - 'predict: 學生先畫熱流箭頭並預測接觸一段時間後兩物體溫度如何改變'
  - 'manipulate: 固定質量與環境，只改變兩物體初溫差或隔熱程度'
  - 'observe: 同步更新兩條溫度—時間曲線、瞬時溫差與熱流箭頭'
  - 'explain: 用「高溫端下降、低溫端上升、溫差縮小」三項證據說明熱流方向'
  - 'formalize: 定義熱傳遞、熱平衡及傳熱速率，分開處理溫度與能量傳遞概念'
  - 'transfer: 以冰飲、金屬湯匙、保溫杯與室內冷氣情境判斷高低溫端及主要傳熱途徑'
  - 'exit-ticket: 由一組溫度時間資料畫熱流箭頭，並說明隔熱只改變到達平衡的快慢'
  visualizations:
  - 雙物體溫度—時間圖：物體 A、B 共用時間軸並顯示當前溫差，不預設一定相同質量或熱容量時會在算術平均溫度平衡
  - 熱流箭頭：箭頭方向只由當下高低溫決定，溫差趨近零時淨熱流提示同步減弱
  - 隔熱比較卡：同初溫、同環境下比較有／無隔熱的降溫速率，避免把不同初溫混入比較
  interactiveBlocks:
  - id: CUR-SCIENCE-CONTENT-BB-IV-1-I01
    component: EvidenceLabBlock
    purpose: 讓學生操作兩物體初溫與隔熱程度，從雙溫度曲線和熱流箭頭建立「熱由高溫處傳向低溫處」及熱平衡模型
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        objectATempC: 80
        objectBTempC: 20
        insulationLevel: none
    studentActions:
    - 先提交 A、B 間熱流方向與兩者溫度變化預測，不先顯示正解
    - 以鍵盤可操作控制分別改變 A、B 初溫，觀察熱流箭頭是否隨高低溫關係改變
    - 固定兩物體初溫後只改隔熱程度，比較達到接近平衡所需時間
    - 標記兩條曲線中支持熱流方向與熱平衡的資料點
    - 用「哪一端較高溫 → 溫度如何變 → 溫差如何改變」完成解釋
    visualRules:
    - 任一初溫變更後，熱流箭頭、兩條曲線起點、溫差文字與可及性摘要同步更新
    - 隔熱程度只改變傳熱速率，不得在沒有外加功的情況下反轉淨熱流方向
    - 若兩物體初溫相同，顯示「無淨熱傳遞」而不是任意指定箭頭
    - 顏色不可單獨承擔 A／B 身分，曲線、端點與箭頭都有文字或符號標籤
    misconceptionChecks:
    - id: MC-CUR-SCIENCE-CONTENT-BB-IV-1-I01
      trigger: 學生畫出低溫端往高溫端的自發熱流、說「冷流入熱物體」，或認為隔熱會反轉方向
      prompt: 先比較此刻 A、B 哪一個溫度較高，再看下一時點兩者溫差是變大還是變小；哪個箭頭方向同時符合這兩項證據？
      expectedEvidence: 指出高溫端溫度下降、低溫端溫度上升且溫差縮小，並說明隔熱只改變速率
    feedback:
      correct: 核對高低溫端、曲線變化與箭頭方向，再要求把初溫對調驗證規則仍成立。
      incorrect: 先提示「熱流方向看溫差，不看物體名稱」並要求比較下一時點資料，不直接顯示箭頭答案。
  teachingPatternRefs:
  - refId: phet-ild
    reuseDecision: inspiration-only
    application: 本課只採用先預測、再操作、最後用資料修正模型的節奏；雙溫度資料、熱流箭頭與情境均為本課自編。
  - refId: phet-activity
    reuseDecision: inspiration-only
    application: 本課以初溫對調與隔熱比較作遷移，不複製外部模擬資料或活動腳本。
  - refId: w3c-aria
    reuseDecision: inspiration-only
    application: A／B 初溫、隔熱程度、當前溫差與熱流方向皆提供鍵盤控制及文字狀態。
  - refId: w3c-landmarks
    reuseDecision: inspiration-only
    application: 預測、控制、雙曲線證據與回饋分區可導覽，窄螢幕仍保留題目與狀態摘要。
  capTransfer:
    questionType: 溫度—時間資料判讀／熱流箭頭／理由短答
    stemConstraint: 更換成冰飲、湯匙或保溫容器情境，必須提供至少兩個位置或物體的溫度資料與時間變化，不能只問背誦定義
    requiredResponse: 指出高低溫端、畫出淨熱流方向，並引用至少一筆溫度隨時間變化證據；若涉及隔熱，再說明其改變的是速率而非方向
    scoring: 熱流方向正確 1、引用溫度資料 1、熱平衡或隔熱限制說明完整 1
  exitTicket:
    prompt: 杯中飲料為 10°C、室內空氣為 28°C。十分鐘後飲料升到 15°C。請畫出主要淨熱流方向，並說明若套上隔熱杯套，方向與升溫速率各會如何改變。
    successCriteria:
    - 熱流方向由 28°C 的較高溫環境指向 10°C 的飲料
    - 以飲料由 10°C 升至 15°C 作為能量流入飲料的資料證據
    - 說明隔熱會降低傳熱速率，但在環境仍較高溫時不會反轉熱流方向
  expressionExtension:
    applicable: false
    task: 用熱流箭頭與 80～120 字解釋「冰塊放入飲料後為什麼是飲料把能量傳給冰塊，而不是冰把冷傳給飲料」
    constraint: 學生先寫；系統只提示高低溫、溫度變化與熱流方向三層，不直接代寫完整答案
  mobileA11y:
    breakpoints:
    - 320
    - 375
    - 768
    touchTargetMinPx: 44
    keyboardAlternative: true
    screenReader: A／B 初溫、隔熱程度、當前溫差、熱流方向與曲線趨勢皆有可讀文字狀態
    reducedMotion: 停用動畫仍可逐時間點查看 A／B 溫度和熱流方向
  testCases:
  - 載入時未提交預測前，不顯示完整熱流方向解說；預測需保留供操作後比較。
  - 將 objectATempC 設為 80、objectBTempC 設為 20 時，箭頭由 A 指向 B；對調初溫後箭頭同步反轉。
  - 將 A、B 初溫設成相同時，顯示無淨熱傳遞，不能保留上一狀態箭頭。
  - 固定初溫只增加 insulationLevel 時，到達接近平衡的速度變慢，但熱流方向規則不變。
  - 學生選擇「冷由低溫端流向高溫端」時命中迷思診斷，先要求比較高低溫與下一時點資料。
  - 在 320／375／768px 與鍵盤操作下，兩條曲線、控制項、箭頭、文字摘要與回饋不得裁切。
  - fallback 至少保留三組靜態溫度表、可選熱流箭頭與隔熱比較題，圖形不可用時仍能完成預測—證據—解釋—transfer。
  definitionOfDone:
  - 課綱 ID、KG ID、標題與官方 locator 通過一致性檢查
  - 互動可實際改變兩物體初溫及隔熱程度，不含 primary／secondary 假變項
  - 冷流動、隔熱反轉方向與溫度／熱量混淆至少一項能被誘發、診斷並回饋
  - CAP transfer、exit ticket、mobile、keyboard、screen reader、reduced-motion 與 fallback 可執行
  - 內容與教學法無 placeholder、TODO 或只換名詞模板
  status:
    designStatus: specified
    implementationStatus: implemented
    qaStatus: untested
