unitImplementationSpec:
  specVersion: '1.0'
  lessonId: cur-science-content-ba-iv-4
  knowledgeGraphIds:
  - kg-science-content-ba-iv-4
  title: Ba-Ⅳ-4：電池的化學能轉電能
  subject: science
  socialDiscipline: null
  curriculumLevel: learning-content
  gradeRange:
  - '7'
  - '8'
  - '9'
  fusedScope:
    officialCurriculum: Ba-Ⅳ-4：電池的化學能轉電能
    curriculumIntent: 由完整電路與電池內化學變化建立化學能轉成電能的證據鏈
    publisherEvidence:
      nani: {status: pending, required: true}
      kanghsuan: {status: pending, required: true}
      hanlin: {status: pending, required: true}
    fusionRule: 未完成三版本章節融合前，只以官方課綱、KG 與可核對公開方向原創撰寫
    currentEvidenceStatus: curriculum-and-kg-grounded; publisher-fusion-review-pending
  learningGoals:
  - 說明電池工作時化學能經由電路轉成電能，再在負載轉成光、熱或動能等形式
  - 由開路／閉路、負載反應與電池狀態判斷能量是否能持續傳遞
  - 分辨「電池儲存電」與「電池以化學反應維持電位差並供能」兩種說法的差異
  prerequisites:
  - 能辨認電池、導線、開關與負載形成的簡單電路
  - 已理解能量可轉換但不憑空產生
  coreConcepts:
  - 電池中的化學變化提供能量，使完整外電路可持續傳遞電能
  - 開路時即使電池仍有化學能，外電路沒有持續電流，負載也不會持續取得電能
  - 負載得到的光、熱或動能來自能量轉換，不是電子被消耗掉
  misconceptions:
  - 認為電池內裝著會逐漸流光的「電」而不是化學能轉換
  - 認為開路時仍有與閉路相同的持續電流
  - 認為燈泡發光表示電子在燈泡中被消耗殆盡
  contentFlow:
  - 'hook: 同一顆電池接燈泡，為何開關打開與閉合結果不同'
  - 'predict: 先預測開路／閉路時電流、燈泡與能量箭頭'
  - 'manipulate: 固定電池，只切換開關與負載種類'
  - 'observe: 同步更新回路狀態、負載反應與化學能→電能→其他形式箭頭'
  - 'explain: 以完整回路和電池內化學能減少說明負載取得能量'
  - 'transfer: 手電筒、馬達與蜂鳴器比較相同輸入的不同輸出形式'
  - 'exit-ticket: 解釋電池沒電不是電子全部消失'
  visualizations:
  - 簡單回路圖：電池、開關、導線與負載皆有文字標籤及開閉狀態
  - 能量流程圖：電池化學能→電路電能→負載光／熱／動能，電子流與能量流分開表示
  interactiveBlocks:
  - id: CUR-SCIENCE-CONTENT-BA-IV-4-I01
    component: PhenomenonSimulationBlock
    purpose: 讓學生切換開關與負載，從回路是否完整和負載反應判讀電池化學能如何轉成電能
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        circuitClosed: false
        loadType: lamp
        batteryState: usable
    studentActions:
    - 先預測開路與閉路時負載是否運作及能量箭頭是否跨過負載
    - 只切換開關，保留同一電池與負載比較
    - 再切換燈泡／馬達等負載，比較輸出能量形式
    - 標記「完整回路」「負載反應」「電池化學能」三類證據
    visualRules:
    - 開路時不得顯示持續外電路電流或持續負載輸出
    - 閉路後負載與能量箭頭同步更新，但電子流與能量流必須用不同符號及文字
    - 不顯示未經資料支持的精確電壓、電流或化學反應速率
    - 顏色不能單獨承擔方向或狀態資訊
    misconceptionChecks:
    - id: MC-CUR-SCIENCE-CONTENT-BA-IV-4-I01
      trigger: 把電池說成儲存電子的容器，或認為燈泡會把電子用掉
      prompt: 閉路前後哪一項改變使負載能持續取得能量？電子與能量在圖中是否代表同一件事？
      expectedEvidence: 指出完整回路與電池化學能轉換，並說明負載轉換能量而非消耗電子
    feedback:
      correct: 核對回路、電池能量來源及負載輸出，再換另一負載遷移。
      incorrect: 先提示比較開路／閉路與能量箭頭，不直接給完整結論。
  teachingPatternRefs:
  - refId: phet-ild
    reuseDecision: inspiration-only
    application: 只借用先預測、切換條件、再用證據修正模型的節奏；本課回路與能量圖均自編。
  - refId: w3c-aria
    reuseDecision: inspiration-only
    application: 開關、負載及回路狀態提供鍵盤操作與可讀文字摘要。
  capTransfer:
    questionType: 電路圖判讀／能量流程／理由短答
    stemConstraint: 更換電池裝置或負載，但保留完整回路與化學能轉電能的核心關係
    requiredResponse: 指出回路狀態、能量來源與負載輸出
    scoring: 回路判讀 1、能量轉換 1、證據表達 1
  exitTicket:
    prompt: 手電筒電池逐漸失效時，為什麼不能說「電子被燈泡用光」？
    successCriteria:
    - 指出電池供能來自化學能轉換
    - 指出完整回路中的電子不是在燈泡處消失
    - 指出負載把電能轉為光與熱等形式
  expressionExtension:
    applicable: false
    task: 畫出一個電池裝置的回路與能量流程並加上短解釋
    constraint: 學生先寫；系統只給分層提示
  mobileA11y:
    breakpoints: [320, 375, 768]
    touchTargetMinPx: 44
    keyboardAlternative: true
    screenReader: 開關、負載、回路狀態與能量流程皆有文字描述
    reducedMotion: 關閉動畫仍可由靜態箭頭與狀態表完成判讀
  testCases:
  - 開路狀態不得顯示持續電流或持續負載輸出。
  - 閉合開關後回路、負載與能量流程同步更新。
  - 切換負載時只改變負載輸出形式，不可把電池能量來源改寫成別種形式。
  - 認為電子被燈泡用掉時必須命中迷思診斷。
  - 320／375／768px 與鍵盤操作下回路圖、控制項與回饋不得裁切。
  - fallback 保留靜態開路／閉路比較與可重試能量流程題。
  definitionOfDone:
  - 課綱 ID、KG ID、標題與官方 locator 一致
  - 互動實際操作開路／閉路與負載，而非 primary／secondary 假變項
  - 能量流與電子流迷思被實際診斷
  - transfer、exit ticket、mobile、keyboard、screen reader 與 fallback 可執行
  - 無 placeholder、TODO 或只換名詞模板
  status:
    designStatus: specified
    implementationStatus: implemented
    qaStatus: untested
  sourceRefs:
  - url: https://www.naer.edu.tw/upload/1/16/doc/820/%E5%8D%81%E4%BA%8C%E5%B9%B4%E5%9C%8B%E6%B0%91%E5%9F%BA%E6%9C%AC%E6%95%99%E8%82%B2%E8%AA%B2%E7%A8%8B%E7%B6%B1%E8%A6%81%E5%9C%8B%E6%B0%91%E4%B8%AD%E5%B0%8F%E5%AD%B8%E6%9A%A8%E6%99%AE%E9%80%9A%E5%9E%8B%E9%AB%98%E7%B4%9A%E4%B8%AD%E7%AD%89%E5%AD%B8%E6%A0%A1-%E8%87%AA%E7%84%B6%E7%A7%91%E5%AD%B8%E9%A0%98%E5%9F%9F.pdf
    locator: 正文第 22～30 頁／PDF 第 26～34 頁；主題 B、次主題 Ba；官方代碼 Ba-Ⅳ-4
    role: official-curriculum-source-of-truth
