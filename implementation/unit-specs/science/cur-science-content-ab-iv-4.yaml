unitImplementationSpec:
  specVersion: '1.0'
  lessonId: cur-science-content-ab-iv-4
  knowledgeGraphIds:
  - kg-science-content-ab-iv-4
  title: Ab-Ⅳ-4：純物質與混合物分類
  subject: science
  socialDiscipline: null
  curriculumLevel: learning-content
  gradeRange:
  - '7'
  - '8'
  - '9'
  fusedScope:
    officialCurriculum: Ab-Ⅳ-4：純物質與混合物分類
    curriculumIntent: Ab-Ⅳ-4：純物質與混合物分類
    publisherEvidence:
      nani:
        status: pending
        required: true
      kanghsuan:
        status: pending
        required: true
      hanlin:
        status: pending
        required: true
    fusionRule: 只融合三版本共同概念與可核對差異；章節級證據雖已記錄，融合審查前不得聲稱已完成版本融合
    currentEvidenceStatus: curriculum-and-kg-grounded; publisher-chapter-evidence-recorded; fusion-review-pending
  learningGoals:
  - 依「是否只含一種物質且組成固定」區分純物質與混合物，不以外觀均勻與否作唯一判準
  - 從粒子模型、沸點／熔點範圍或分離結果等資料判斷樣品分類
  - 說明混合物各成分保有部分可利用的物理性質，因此可選擇合適物理方法分離
  prerequisites:
  - 能區分元素、化合物與混合物的基本粒子表示
  - 能閱讀簡單物性資料表並理解「固定值」與「範圍」的差別
  coreConcepts:
  - 純物質由一種物質組成，在指定條件下具有固定組成與特徵性質；元素與化合物都可能是純物質
  - 混合物由兩種以上物質組成，比例可變；即使外觀均勻仍可能是混合物
  - 分離混合物利用成分間沸點、溶解度、粒徑、磁性等物理性質差異，不要求生成新物質
  misconceptions:
  - 認為透明、均勻或看不到成分就一定是純物質
  - 認為化合物因含兩種以上元素所以一定是混合物
  - 認為分離混合物一定需要化學反應，或任何過濾都能分離溶液中的溶質
  contentFlow:
  - 'hook: 比較蒸餾水、食鹽水與外觀均勻的未知液體，先判斷哪些證據足以分類'
  - 'predict: 先依粒子圖／組成資料分類純物質或混合物，不揭露答案'
  - 'manipulate: 改變成分數與比例，或選擇過濾、蒸餾、磁選等分離方法'
  - 'observe: 同步更新粒子模型、組成比例、物性資料與分離後結果'
  - 'explain: 用「一種物質／多種物質、組成是否固定、可利用的物性差異」說明分類'
  - 'contrast: 比較化合物的固定組成與混合物的可變比例'
  - 'transfer: 以空氣、合金、飲料或未知樣品資料重新分類並選分離方法'
  - 'exit-ticket: 指出一個均勻混合物並說明為何外觀不能證明純度'
  visualizations:
  - 組成工作台：顯示成分種類、比例與對應粒子模型，比例改變時分類證據同步更新
  - 分離方法卡：以沸點差、粒徑差、磁性或溶解度差連結到可行方法及限制
  interactiveBlocks:
  - id: CUR-SCIENCE-CONTENT-AB-IV-4-I01
    component: ParticleModelBlock
    purpose: 讓學生改變樣品成分數與比例，並依物性差異選擇合理的物理分離方法
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        componentCount: 1
        componentARatio: 100
        separationMethod: none
    studentActions:
    - 先依粒子模型與組成資料預測純物質或混合物
    - 將第二成分加入並改變比例，觀察是否仍屬同一分類
    - 依題目提供的沸點、粒徑、磁性或溶解度資料選分離方法
    - 說明為何均勻外觀不能單獨證明純物質
    visualRules:
    - 成分種類與比例必須以文字／數值標示，顏色不能是唯一分類線索
    - 純物質與混合物分類依組成資料，不得依粒子是否畫得整齊決定
    - 分離結果只能根據題目提供的物性差異計算／顯示，不可假設不存在的性質
    - 過濾不可被呈現成能直接分離均勻溶液中的已溶解溶質
    misconceptionChecks:
    - id: MC-CUR-SCIENCE-CONTENT-AB-IV-4-I01
      trigger: 以透明／均勻外觀判定純物質，或把化合物因含多種元素而判成混合物
      prompt: 請改看「樣品含幾種物質、組成比例是否固定」，並指出元素種類數與物質種類數不是同一件事。
      expectedEvidence: 能以物質種類與固定／可變組成完成分類，而非以外觀或元素種類數判斷
    feedback:
      correct: 指出組成證據，再要求選一種可利用的物性差異設計分離。
      incorrect: 先提示比較「一種化合物」與「兩種物質混在一起」的差別，再讓學生重試。
  teachingPatternRefs:
  - refId: phet-ild
    reuseDecision: inspiration-only
    application: "本課採先分類、改組成、再用物性證據選分離方法的流程；資料與視覺均為本專案自製。"
  - refId: phet-activity
    reuseDecision: inspiration-only
    application: "只借用預測—操作—解釋結構，不複製外部模擬內容。"
  - refId: w3c-aria
    reuseDecision: inspiration-only
    application: "成分數、比例、分類與分離結果均提供文字狀態，不依賴顏色。"
  - refId: w3c-landmarks
    reuseDecision: inspiration-only
    application: "組成、分類、分離方法與回饋區域可定位。"
  capTransfer:
    questionType: 分類／物性資料判讀／分離方法應用
    stemConstraint: 提供陌生樣品的組成與物性資料，要求分類並選擇能利用已知物性差異的分離方法
    requiredResponse: 選答後指出組成證據及分離方法利用的物性差異
    scoring: 分類正確 1、物性證據正確 1、分離方法與理由匹配 1
  exitTicket:
    prompt: 食鹽水看起來均勻透明，為什麼仍是混合物？若要從食鹽水取得水，應利用哪一類物性差異？
    successCriteria:
    - 指出食鹽水含水與食鹽兩種物質且比例可變
    - 不以透明／均勻作純物質判準
    - 能連結蒸餾與揮發／沸點差異，而不是用普通過濾分離已溶解食鹽
  expressionExtension:
    applicable: false
    task: 用 80～120 字為一個陌生樣品提出分類與分離方案，至少引用兩項資料證據。
    constraint: 學生先寫；系統只給一階回饋，不直接代寫完整答案
  mobileA11y:
    breakpoints:
    - 320
    - 375
    - 768
    touchTargetMinPx: 44
    keyboardAlternative: true
    screenReader: 成分數、比例、物性與分離選擇都有名稱、目前值與結果摘要
    reducedMotion: 不依賴動畫；組成與分離前後可以靜態表格比較
  testCases:
  - 載入時先要求依組成資料分類，不得先顯示答案。
  - 從一種物質加入第二種物質後，系統依物質種類與組成資料更新分類，不得以畫面是否均勻作判準。
  - 選過濾處理食鹽水時必須提示已溶解溶質會通過一般濾紙，不能把它顯示成成功分離。
  - 化合物案例不得因含兩種元素自動標成混合物。
  - 320px、375px、768px 與鍵盤操作下，組成比例、物性表與回饋均可讀取。
  - Fallback 模式提供組成／物性表與文字式分離選擇，不得只顯示通用說明。
  definitionOfDone:
  - 課綱 ID、KG ID、標題與官方 locator 通過一致性檢查
  - 三版本章節級證據已補齊，或明確標記 pending，不得冒充完成
  - 組成分類與分離方法互動可執行
  - 均勻＝純物質或化合物＝混合物等至少一項迷思被診斷並回饋
  - 會考 transfer、exit ticket 可執行
  - mobile、keyboard、screen reader、reduced-motion 與 fallback 測試通過
  - 內容、教學法與版權審查通過；無 placeholder、TODO 或只換名詞模板
  status:
    designStatus: specified
    implementationStatus: implemented
    qaStatus: untested
