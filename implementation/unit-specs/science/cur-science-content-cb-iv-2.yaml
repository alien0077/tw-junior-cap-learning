        status: pending
        required: true
    fusionRule: 只使用已記錄公開概念方向與可核對差異；未取得完整出版社章節前，不把公開索引描述成三版本完整內容證據。
    currentEvidenceStatus: curriculum-and-kg-grounded; publisher-chapter-evidence-recorded; fusion-review-pending
  learningGoals:
  - 以鑽石與石墨都由碳元素組成但性質不同的資料，說明元素種類相同不代表宏觀性質完全相同
  - 比較三度空間網狀與層狀排列，將硬度、易剝落與導電資料連到不同的結構／電子線索
  - 分辨直接測量、模型推論與模型限制，避免由元素名稱或單一性質過度推論材料結構
  - 對金屬導電與延展資料提出分層解釋，知道不同性質可能涉及不同微觀機制
  prerequisites:
  - 能區分元素種類、原子排列與材料的宏觀性質
  - 能閱讀硬度、導電、延展或熔點的比較表，並指出哪一欄是測量資料
  coreConcepts:
  - 材料性質取決於組成，也與原子排列、連結方式及可移動電荷等微觀條件有關
  - 鑽石與石墨都是碳的同素異形體；鑽石延伸的三度空間連結可支持高硬度解釋，石墨層狀結構可支持易剝落／滑動解釋
  - 石墨導電與金屬導電都需要可移動電荷的模型線索，但不能只靠「能導電」推定材料具有完全相同結構
  - 模型圖提供排列與關係的表徵；球體顏色、大小和距離通常不是原子的真實外觀或比例
  misconceptions:
  - 認為只要元素符號相同，所有材料性質就必定相同
  - 把「排列較整齊」直接等同「一定較硬」，不檢查連結、滑動與測量資料
  - 把能導電解讀成材料一定是液體、一定是金屬，或只由單一因素決定所有性質
  - 把粒子模型球的顏色、大小或間距當作真實原子照片與精確比例
  contentFlow:
  - 'hook: 同時展示只含碳的甲乙材料：甲導電且易剝落，乙不導電且難刮傷；先要求學生解釋為何元素相同仍可能不同'
  - 'predict: 在看到結構卡前，根據硬度、剝落與導電資料預測哪一種排列較符合甲／乙'
  - 'compare-structure: 切換層狀與三度網狀模型，只比較排列與連結差異，不把模型顏色當成性質'
  - 'mechanical-evidence: 模擬受力方向，觀察是否允許層間相對滑移，連到鉛筆痕跡與硬度資料'
  - 'electrical-evidence: 顯示是否存在可移動電荷的模型欄位，與導電資料交叉檢查'
  - 'explain: 用「資料顯示—模型因此支持—但不能證明」寫出有界線的結構—性質推論'
  - 'transfer: 比較一種可導電且可拉線的金屬材料，分開解釋導電與延展，不強迫兩性質共用同一原因'
  - 'exit-ticket: 以同素異形體說明為何元素名稱不足以預測全部材料性質'
  visualizations:
  - 碳材料比較板並列元素組成、排列模型、硬度、導電性與受力後是否易層間滑動
  - 結構圖中的碳原子以 C 標記，顏色只作輔助；固定顯示「模型非實際原子照片／比例」
  - 測量資料與模型推論使用不同欄位與標籤，禁止把模型預測冒充實測值
  interactiveBlocks:
  - id: CUR-SCIENCE-CONTENT-CB-IV-2-I01
    component: ParticleModelBlock
    purpose: 讓學生比較同為碳元素的層狀與三度網狀模型，將受力、導電與硬度資料逐項對應到可支持的微觀解釋與限制
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        structureModel: hidden
        appliedForce: none
        propertyView: hardness
    studentActions:
    - 先依甲乙材料的硬度、導電與剝落資料提交結構預測
    - 揭示層狀或三度網狀模型，切換受力方向觀察是否允許層間相對滑移
    - 切換硬度／導電／延展資料欄，為每項性質選取支持證據，不得一個理由包辦全部性質
    - 標記「直接測量」「模型推論」「尚未由資料證明」三類敘述
    - 用新材料資料重做一次結構—性質推理並保留模型限制
    visualRules:
    - 同一元素在兩種模型中都以 C 標記；不能用不同顏色暗示成分不同
    - 切換結構或受力時只更新模型預測欄，不得竄改已提供的實驗測量資料
    - 硬度、導電與剝落必須分欄呈現；不同性質可以有不同機制與證據
    - 顯示可移動電荷時以模型線索標註，不畫成可直接觀察到的真實電子照片
    - 320px 等窄螢幕時比較板可縱向排列，但元素、結構、測量與推論標籤不可遺失
    misconceptionChecks:
    - id: MC-CB-IV-2-SAME-ELEMENT
      trigger: 因兩材料都標 C 就宣稱硬度、導電性與熔點必定完全相同
      prompt: 兩者相同的是元素種類；還有哪些結構或作用條件尚未比較？請引用一項不同的實測性質。
      expectedEvidence: 指出排列／連結可能不同，並引用至少一項硬度、導電或剝落差異
    - id: MC-CB-IV-2-NEAT-HARD
      trigger: 只用「排列整齊」判斷材料一定較硬
      prompt: 模型中真正與受力抵抗或層間滑動相關的是什麼？請把結構特徵與硬度／剝落資料連起來。
      expectedEvidence: 以三度連結或層間滑動機制，而非外觀整齊程度，說明力學資料
    - id: MC-CB-IV-2-CONDUCTION
      trigger: 因材料導電就斷言一定是金屬或所有性質都由可移動電子單獨決定
      prompt: 導電資料支持哪一種微觀線索？它是否同時足以解釋硬度與延展？
      expectedEvidence: 導電需要可移動電荷線索，但其他性質仍須結構與受力資料支持
    - id: MC-CB-IV-2-MODEL-REALISM
      trigger: 把模型球的顏色、大小或距離當成實際原子顏色與比例
      prompt: 圖中哪些只是表徵約定？這個模型真正可比較的是排列關係還是原子的實際外觀？
      expectedEvidence: 說明模型支持排列／連結比較，不直接提供真實原子外觀與比例
    feedback:
      correct: 指出學生所引用的測量欄與結構特徵，再要求說出一項模型仍不能直接證明的內容。
      incorrect: 依「同元素＝同性質、整齊＝硬、導電過度推論、模型實體化」給一階提示；學生重試前不直接顯示完整解釋。
  teachingPatternRefs:
  - refId: phet-ild
    reuseDecision: inspiration-only
    application: "本課只吸收先預測再比較資料與模型的節奏；碳材料資料、結構圖與題目均為本課自行設計。"
  - refId: phet-activity
    reuseDecision: inspiration-only
    application: "受力與性質比較以原創資料表及模型呈現，不複製外部模擬畫面、數值或活動腳本。"
  - refId: w3c-aria
    reuseDecision: inspiration-only
    application: "結構選擇、受力方向、性質欄與測量／推論狀態都有鍵盤操作與等價文字摘要。"
  - refId: w3c-landmarks
    reuseDecision: inspiration-only
    application: "預測、結構模型、實測資料、推論與 transfer 各自成區，方便鍵盤與輔助科技導航。"
  capTransfer:
    questionType: 結構—性質資料判讀／模型限制短答
    stemConstraint: 提供兩種只含同一元素但熔點、導電或受力行為不同的新材料資料，不使用鑽石／石墨原題敘述
    requiredResponse: 指出相同組成與不同測量，提出一項可能的微觀結構／電子解釋，並明確說出資料仍不足以證明的部分
    scoring: 資料比較正確 1、微觀解釋有證據 1、模型限制清楚 1
  exitTicket:
    prompt: 鑽石和石墨都只含碳。請各引用一項宏觀資料，說明為何「元素相同」不足以推出「材料性質全部相同」，並指出模型圖的一項限制。
    successCriteria:
    - 正確引用硬度、導電或易剝落等至少一項差異
    - 以排列、連結或可移動電荷提出有條件的微觀解釋
    - 說明顏色、球體大小或距離是模型表徵，不能視為真實原子外觀／比例
  expressionExtension:
    applicable: false
    task: 用 80～120 字向同學解釋「同一元素也可能形成性質不同的材料」，並以鑽石／石墨資料支持，不可只背同素異形體名詞。
    constraint: 學生先寫；系統只給一階回饋，不直接代寫完整答案
  mobileA11y:
    breakpoints:
    - 320
    - 375
    - 768
    touchTargetMinPx: 44
    keyboardAlternative: true
    screenReader: 結構、受力、性質測量、推論狀態與模型限制均有可讀文字；資料表提供列欄標題
    reducedMotion: 停用層間滑動動畫後仍可用前／後狀態與文字描述完成比較
  testCases:
  - 初始只提供甲乙碳材料的性質資料，不先揭示結構；學生先提交哪個較像層狀／三度網狀的預測。
  - 切換至層狀模型並施加平行層面的力時，顯示較容易相對滑移的模型結果；不得把此結果直接改寫成實測硬度數值。
  - 三度網狀模型須呈現跨方向連結，不可只把粒子排得更密或更整齊來代替結構差異。
  - 將兩材料都因「C」而判為完全同性質時命中 SAME-ELEMENT 診斷，要求引用實測差異。
  - 只用「整齊」解釋硬度時命中 NEAT-HARD 診斷，要求指出連結／滑動機制。
  - 導電性判讀必須與可移動電荷模型欄連結；不能由導電單獨推得所有力學性質。
  - 模型圖固定標示顏色／大小／距離非真實比例；在螢幕閱讀器摘要中也要包含此限制。
  - CAP transfer 換成新的同元素材料資料，評分分開檢查測量比較、微觀解釋與限制。
  - 320px、375px、768px 下以鍵盤切換結構、受力與性質欄，焦點保留且元素、模型、資料與推論標籤不溢位。
  - 外部資源失效時，ParticleModelBlock 仍以本地 lesson/spec 的碳材料資料與文字 fallback 完成預測、比較、解釋與 transfer。
  definitionOfDone:
  - 課綱 ID、KG ID、標題與官方 locator 通過一致性檢查
  - 三版本章節級證據已補齊，或明確標記 pending，不得冒充完成
  - 至少一個互動操作能回答本單元明確學習問題
  - 至少一個迷思被實際誘發、診斷並以分層回饋處理
  - 會考 transfer、exit ticket 與表達延伸（適用時）可執行
  - mobile、keyboard、screen reader、reduced-motion 與 fallback 測試通過
  - 內容、教學法與版權審查通過；無 placeholder、TODO 或只換名詞模板
