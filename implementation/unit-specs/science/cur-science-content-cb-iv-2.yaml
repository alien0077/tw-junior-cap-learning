  title: Cb-Ⅳ-2：原子排列與元素特性
  subject: science
  socialDiscipline: null
  curriculumLevel: learning-content
  gradeRange:
  - '7'
  - '8'
  - '9'
  fusedScope:
    officialCurriculum: Cb-Ⅳ-2：原子排列與元素特性
    curriculumIntent: 以同一元素的不同原子排列與材料資料，建立「微觀結構—粒子作用／可移動電荷—宏觀性質」的有條件解釋。
    publisherEvidence:
      nani:
        status: pending
        required: true
      kanghsuan:
        status: pending
        required: true
