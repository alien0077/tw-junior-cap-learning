unitImplementationSpec:
  specVersion: '1.0'
  lessonId: cur-english-performance-7-iv-3
  knowledgeGraphIds:
  - kg-english-performance-7-iv-3
  title: 7-Ⅳ-3：非語言與語言溝通策略
  subject: english
  socialDiscipline: null
  curriculumLevel: learning-performance
  gradeRange:
  - '7'
  - '8'
  - '9'
  fusedScope:
    officialCurriculum: 7-Ⅳ-3 利用語言與非語言溝通策略提升溝通效能
    curriculumIntent: 針對漏聽、歧義或理解未確認，選用適切修補策略，並核實訊息是否到達
    publisherEvidence:
      nani:
        status: pending
        required: true
      kanghsuan:
        status: pending
        required: true
      hanlin:
        status: pending
        required: true
    fusionRule: 以官方課綱及KG界定核心；只融合可讀且有定位的版本材料，未取得的出版社正文明標未知；自編內容不冒稱出版社差異
    currentEvidenceStatus: official-curriculum-and-KG-grounded; one-school-plan-indicator-and-activity-locator; publisher-chapter-text-unavailable
  learningGoals:
  - 判斷溝通障礙是漏聽、語意歧義或理解未確認
  - 選用禮貌重述請求、具體澄清、改述核對或可理解的非語言線索
  - 以對方回述、指向或實際行動核驗訊息是否正確到達
  - 通訊媒介或可見線索改變時，調整策略而不假裝理解
  prerequisites:
  - 能理解簡短生活對話及基本位置、請求用語
  - 能指出自己已聽到或仍缺少的資訊
  coreConcepts:
  - 漏聽時請求重述；語意不明時提出聚焦澄清問題
  - 改述並邀請回應可檢查雙方是否共享同一理解
  - 手勢、表情、指向物件補充語句，但意義須由對方反應核驗
  - 策略的效能看訊息是否準確到達，不看說話者是否重複或提高音量
  misconceptions:
  - 對方沒聽清楚時只提高音量或原句重複，未指出缺漏片段
  - 對方點頭就當作已理解，不要求回述或採取可核對行動
  - 把某個手勢視為跨情境、跨文化都只有一種固定意思
  - 媒介遮住手勢或切斷聲音後仍假裝收到完整訊息
  contentFlow:
  - 'predict: 在校園導覽先判斷漏聽 turn 後介系詞會造成哪種路線誤差，預測對方需要重述還是澄清'
  - 'manipulate: 依漏聽、詞義歧義或理解未確認，選擇重述請求、聚焦提問或改述核對並實際試說'
  - 'observe: 比較對方回述、地圖指向及實際路線結果，記錄手勢補充後仍存在的理解落差'
  - 'explain: 引用對話中的漏失片段與回述結果，解釋策略為何修補該故障；不能只以音量或點頭當證據'
  - 'guided-practice: 路線資訊差任務，記錄線索、策略、回應及結果'
  - 'transfer: 視訊聲音與畫面不同步時切換文字通道'
  - 'exit-ticket: 說明策略與證據，指出何時還需再確認'
  visualizations:
  - 路線圖以圖書館、藝術教室及方向箭頭呈現 across from 與 next to 的空間差異
  - 語句與指向位置同步提供，文字標籤不可只靠顏色或表情傳意
  interactiveBlocks:
  - id: CUR-ENGLISH-PERFORMANCE-7-IV-3-I01
    component: GuidedChoiceBlock
    purpose: 依溝通故障選擇修補策略，並以回述／可觀察線索檢查效果
    initialState:
      mode: guided-choice
      showAnswer: false
      selectedEvidence: []
    studentActions:
    - 讀取具體校園或線上溝通情境
    - 選擇最能處理當下障礙的策略
    - 錯答時讀提示並重新判斷，不直接跳過
    - 說明哪個對方回應能證明訊息已修復
    visualRules:
    - 先選答案再揭露解釋，錯答須保留當前題目供重試
    - 語言線索與非語言線索均有文字替代，不以顏色單獨承載語意
    - 窄螢幕題幹、選項與回饋不得裁切
    misconceptionChecks:
    - id: MC-CUR-ENGLISH-PERFORMANCE-7-IV-3-I01
      trigger: 對方只點頭便推定理解，沒有可核對的回述或行動
      prompt: 哪一個觀察能證明雙方對地點或指令理解一致？
      expectedEvidence: 對方回述關鍵內容，或按指令正確定位／完成行動
    feedback:
      correct: 指出策略如何取得新資訊或核驗共同理解，再遷移至不同媒介。
      incorrect: 提示先判斷漏聽、歧義或未確認，再選相應修補；保留重試機會。
  teachingPatternRefs:
  - refId: phet-ild
    reuseDecision: inspiration-only
    application: "只參考結構化提示與鍵盤可及性；本課對話、語境及溝通策略均原創，與此元件示例無內容借用。"
  - refId: phet-activity
    reuseDecision: inspiration-only
    application: "只參考活動步驟清楚及回饋分層；本課對話、語境及溝通策略均原創，與此元件示例無內容借用。"
  - refId: w3c-aria
    reuseDecision: inspiration-only
    application: "只遵循語意標籤、焦點可見與鍵盤替代操作；互動文案及資料由本課自行設計。"
  - refId: w3c-landmarks
    reuseDecision: inspiration-only
    application: "只遵循地標與區域語意；本課活動不依賴外部服務或此參考的教學內容。"
  capTransfer:
    questionType: 資料判讀／概念應用／理由短答
    stemConstraint: 換一個情境但保留「7-Ⅳ-3：非語言與語言溝通策略」的核心關係；不可只換名詞
    requiredResponse: 選答後必須指出證據或推理步驟
    scoring: 概念正確 1、證據對應 1、表達完整 1
  exitTicket:
    prompt: 今天的核心關係是什麼？若改變一個條件，哪個結果會跟著變，為什麼？
    successCriteria:
    - 提到本單元核心概念
    - 指出條件與結果
    - 使用一項證據或表徵
  expressionExtension:
    applicable: true
    task: 用 80～120 字／英文短段落，將「7-Ⅳ-3：非語言與語言溝通策略」的證據、因果或觀察說給同學聽
    constraint: 學生先寫；系統只給一階回饋，不直接代寫完整答案
  mobileA11y:
    breakpoints:
    - 320
    - 375
    - 768
    touchTargetMinPx: 44
    keyboardAlternative: true
    screenReader: 每個控制項有名稱、目前值、操作結果與錯誤回饋
    reducedMotion: 停用自動動畫仍可逐步操作
  testCases:
    - 載入互動時不得預先顯示答案；每題作答後才顯示針對「漏聽／歧義／未確認」的提示或解析。
    - 錯答後留在當題並可重試；作答四題後才顯示完成狀態。
    - 正答分別為 A/A/A/A，需涵蓋重述、澄清、非語言補充與媒介切換，不以背單一句型代替策略選擇。
    - 在 320px、375px 與 768px 寬度可用鍵盤完成作答、錯答重試與正答，不得裁切題幹、選項或回饋。
    - 無外部服務時互動仍可完整操作；所有情境、答案及解析均內嵌於 lesson 資料並提供可讀文字。
    - fallback：語音／影片或模擬腳本不可用時，明示使用原創文字對話及地圖線索替代；四題仍可鍵盤完成，不假稱播放媒體成功。
  definitionOfDone:
  - 課綱 ID、KG ID、標題與官方 locator 通過一致性檢查
  - 三版本章節級證據已補齊，或明確標記 pending，不得冒充完成
  - 至少一個互動操作能回答本單元明確學習問題
  - 至少一個迷思被實際誘發、診斷並以分層回饋處理
  - 會考 transfer、exit ticket 與表達延伸（適用時）可執行
  - mobile、keyboard、screen reader、reduced-motion 與 fallback 測試通過
  - 六段單元專屬正文與學生頁一致，含概念、例證、迷思、練習、遷移及自我檢核
  - 單元 Node、完整測試套件及真實瀏覽器互動／鍵盤／窄螢幕測試通過
  status:
    designStatus: reviewed
    implementationStatus: implemented
    qaStatus: verified
