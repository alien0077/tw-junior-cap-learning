  capTransfer:
    questionType: 日常對話聽辨／語境回應／理由短答
    stemConstraint: 以電話留言或社團協作等新對話檢驗功能、限制線索及合宜接話
    requiredResponse: 選擇回應並指出支撐它的詞句或前後文
    scoring: 話語功能判斷 1、上下文線索 1、回應連貫合宜 1
  exitTicket:
    prompt: 哪個前後文線索讓你改變了第一個直覺答案？請引用線索並解釋它如何影響回應。
    successCriteria:
    - 正確辨認話語功能
    - 指出至少一項具體上下文線索
    - 回應符合情境且能承接對話
  expressionExtension:
    applicable: true
    task: 寫兩輪原創日常對話，並用一句話指出其中改變回答的上下文線索
    constraint: 學生先寫；系統只給一階回饋，不直接代寫完整答案
  mobileA11y:
    breakpoints:
    - 320
    - 375
    - 768
    touchTargetMinPx: 44
    keyboardAlternative: true
    screenReader: 每個選項可朗讀；正誤回饋與重試提示由 aria-live 呈現
    reducedMotion: 停用自動動畫仍可逐步操作
  testCases:
  - 四題互動各顯示正確選項、相符的解析與錯答重試提示，不得題目與回饋錯位。
  - 鍵盤可操作所有選項；錯答後可重試，答對後呈現可讀解析及 aria-live 狀態。
  - 在 320px、375px 與 768px 寬度，六段正文、對話題幹、選項及回饋不溢位。
  - 封鎖外部網路後仍可閱讀教材並完成所有 GuidedChoice 步驟。
  - Fallback：刻意阻擋 simulations.js 後，四題常見問答 GuidedChoice 仍可鍵盤作答、錯答重試並取得逐題解析；模擬腳本不可成為理解對話的必要條件。
  - 以電話轉達情境作遷移，能辨認請求、時限並提出理由充分的回應。
  definitionOfDone:
  - 課綱 ID、KG ID、標題與官方 locator 通過一致性檢查
  - 三版本章節級證據已補齊，或明確標記 pending，不得冒充完成
  - 至少一個互動操作能回答本單元明確學習問題
  - 至少一個迷思被實際誘發、診斷並以分層回饋處理
  - 會考 transfer、exit ticket 與表達延伸（適用時）可執行
  - mobile、keyboard、screen reader、reduced-motion 與 fallback 測試通過
  - 六段原創教學、四步互動、答案回饋與學生頁規格彼此一致；無 placeholder 或 TODO（內容審查由使用者以 ChatGPT 執行，不作 Codex gate）
  status:
    designStatus: reviewed
    implementationStatus: implemented
    qaStatus: verified
