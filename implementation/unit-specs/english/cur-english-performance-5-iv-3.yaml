    currentEvidenceStatus: curriculum-and-kg-grounded; publisher-chapter-evidence-recorded; fusion-review-pending
  learningGoals:
  - 聽懂日常對話中的詢問、請求、提供、致謝、道歉及提醒等話語功能
  - 整合前後句中的否定、時間、數量、人稱與已完成等線索，選出符合情境的回應
  - 說明回應所依據的具體詞句，並將判讀方法遷移至電話留言等新情境
  prerequisites:
  - 能理解國中常見日常英語字詞與簡單問句
  - 能辨認基本否定句及常見人稱代名詞
  coreConcepts:
  - 適當回應須先辨識說話者正在詢問、請求、提供、致謝或提醒
  - 前後文中的否定、完成狀態、時間與數量可能改變原先直覺答覆
  - 可指出語言線索且符合真實情境的回應，才算接續了對話
  misconceptions:
  - 看見 help、key 等關鍵字便套固定答句，沒有整合後續資訊
  - 把 Could you…? 一律當作詢問能力，而忽略常見請求功能
  - 漏聽 not、only、already 等否定或限制詞，導致人稱、數量或需求判讀錯誤
  contentFlow:
  - 'predict: 社團海報已完成時先預測對方是否仍需要協助，暫不只憑help關鍵字作答'
  - 'manipulate: 在互動選項間切換候選回應，逐一核對說話功能、人稱、否定及數量限制'
  - 'observe: 比較加入not、already或only等上下文後，合宜回應如何改變'
  - 'explain: 指出改變判斷的具體語句線索，說明為何其他答句不承接原對話'
  - 'identify-function: 分辨詢問、請求、提供、致謝、道歉與提醒'
  - 'locate-clues: 找出否定、時間、數量、人稱和前後句線索'
  - 'work-example: 逐輪分析海報協助對話並組成連貫接話'
  - 'guided-choice: 四題逐步練習功能、限制、致謝回應與電話請求'
  - 'transfer: 將理解方法移至有時限的電話留言'
  - 'exit-ticket: 指出改變答案的具體線索並說明回應理由'
  visualizations:
  - 原創短對話以文字呈現說話者、話語功能及前後文限制；不虛稱音調或音檔分析
  - GuidedChoice 每題提供三個可鍵盤選取的自然語句、逐題重試提示與作答後解析
  interactiveBlocks:
  - id: CUR-ENGLISH-PERFORMANCE-5-IV-3-I01
    component: GuidedChoiceBlock
    purpose: 透過原創對話判斷功能與上下文限制，選擇能承接對話的合宜回答
    initialState:
      selectedAnswer: null
      feedbackVisible: false
    studentActions:
    - 閱讀每題原創日常對話與三個回答選項
    - 使用滑鼠或鍵盤選答
    - 答錯後閱讀該題提示並重試；答對後檢視答案解析
    - 完成後以 exit ticket 說明線索如何支持回答
    visualRules:
    - 題幹、選項、答案、重試提示和回饋由 lesson JSON 提供，外部網路不是必要依賴
    - 選項使用有可存取名稱的原生按鈕，答錯與答對回饋可被輔助科技讀取
    - 不使用只有顏色或動畫才能理解的訊息
    - 窄螢幕不得裁切對話、選項或回饋
    misconceptionChecks:
    - id: MC-CUR-ENGLISH-PERFORMANCE-5-IV-3-I01
      trigger: 看見熟悉的關鍵字就選固定答句，漏掉後續已完成／數量等限制
      prompt: 請指出哪個前後句線索改變了原先的直覺回答。
      expectedEvidence: 引用 already、only、否定或具體時間數量等詞句，說明它如何改變對話需求
    feedback:
      correct: 說明話語功能與前後文線索如何支持此回答，並讀出完整對話檢查連貫性。
      incorrect: 提醒回聽／重讀關鍵詞及其前後句，允許重試後再顯示本題解析。
