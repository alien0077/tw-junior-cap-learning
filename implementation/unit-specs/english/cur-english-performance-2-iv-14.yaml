  capTransfer:
    questionType: 公告／訪談資料判讀與有界線的英文短答
    stemConstraint: 由節慶活動卡遷移到博物館告示，辨認同一個來源範圍規則在不同場合如何使用
    requiredResponse: 改寫一個未過度概括的英文文化介紹句，並指出支持它的原句及不能推出的範圍
    scoring: 參與者／場合範圍正確 1、英文主張可回指證據 1、明確限制推論 1
  exitTicket:
    prompt: 請為一張只記錄單一社區活動的卡片寫一句英文介紹，並補充這張卡不能代表哪些人或場合。
    successCriteria:
    - 保留 some、in this event 或 according to the card 等可核對範圍
    - 明確提及卡片的活動或來源內容
    - 不把一位受訪者、一戶家庭或單場活動擴張成普遍習俗
  expressionExtension:
    applicable: true
    task: 為交換生撰寫80～120字英文文化指南，使用兩種不同來源介紹一項活動及一項場館規則，指出一項相似點和一項差異。
    constraint: 每個文化主張須標出來源與場合；以some／in this event限定樣本；資訊不足處寫成待確認問題，不把系統提示拼成整段代答。
  mobileA11y:
    breakpoints:
    - 320
    - 375
    - 768
    touchTargetMinPx: 44
    keyboardAlternative: true
    screenReader: 每個控制項有名稱、目前值、操作結果與錯誤回饋
    reducedMotion: 停用自動動畫仍可逐步操作
  testCases:
  - 初次載入 harvest walk 活動卡時正解不得先揭露；學生先提交任一預測後才解鎖 Some、paper、harvest 的焦點操作，且預測須在狀態中保留。
  - 將焦點移至 Some 時，句中該詞須以粗體及文字替代同步標出，回饋須指出 some residents 只支持部分居民參與；移至 paper 時應指出材料線索不能證明人群範圍。
  - 輸入 everyone in the country 等過度概括後，系統須顯示回查 some 的一階提示，保留原進度讓學生修正，不直接代寫。
  - guidedActivity 的五步須逐步驗收參與者、場合、證據邊界、有範圍英文句及博物館遷移；錯誤答案顯示對應提示，完成後明確顯示5/5。
  - 在320px、375px與768px寬度以鍵盤操作預測、焦點按鈕、解釋、transfer及五步文字輸入；焦點可見、aria-label／aria-live狀態存在，核心內容不得水平溢位。
  - 即使localStorage或分享網址狀態不可用，學生仍須能完成預測、證據比較、解釋、遷移及五步 fallback 活動；停用動態效果不改變資訊或步驟。
  definitionOfDone:
  - 課綱 ID、KG ID、標題與官方 locator 通過一致性檢查
  - 三版本章節級證據已補齊，或明確標記 pending，不得冒充完成
  - 至少一個互動操作能回答本單元明確學習問題
  - 至少一個迷思被實際誘發、診斷並以分層回饋處理
  - 會考 transfer、exit ticket 與表達延伸（適用時）可執行
  - mobile、keyboard、screen reader、reduced-motion 與 fallback 測試通過
  - 內容、教學法與版權審查通過；無 placeholder、TODO 或只換名詞模板
