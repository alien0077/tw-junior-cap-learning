        status: pending
        required: true
    fusionRule: 只融合三版本共同概念與可核對差異；章節級證據雖已記錄，融合審查前不得聲稱已完成版本融合
    currentEvidenceStatus: curriculum-and-kg-grounded; publisher-chapter-evidence-recorded; fusion-review-pending
  learningGoals:
  - 從節慶行程、訪談摘錄、場館告示辨認地點、場合、參與者與文化實踐
  - 用可追溯證據比較兩地的相同面向，同時保留差異
  - 把「每個人都如此」等過度概括改寫成有來源、有場合、有範圍的英文介紹
  - 資訊不足時提出中性而尊重的確認問題，不以刻板印象補空白
  prerequisites:
  - 能從英文短句找出人物、地點、時間與主要動作
  - 能區分資料明說的內容和讀者自行推測的內容
  coreConcepts:
  - Place／Occasion／People／Practice：文化描述要交代發生地點、場合、參與者與實際做法
  - Evidence／Boundary：每個文化主張都要回指來源，結論範圍不能超過證據
  - Comparison scale：跨文化比較使用相同面向，但不把差異排列成高低
  misconceptions:
  - 把單一訪談或一場活動擴張成整個國家、所有家庭的固定習俗
  - 把菜單上同時出現的食物直接說成某節慶的歷史起源
  - 用自己的熟悉程度替不同文化作先進／落後、正常／奇怪的價值排序
  - 遇到資料空缺時猜測參與者動機或普遍做法，而不是標示未知並確認
  contentFlow:
  - 'hook: 比較 "Everyone does this" 和 "Some residents do this at one festival" 哪句能由來源支持'
  - 'activate-prerequisite: 從文化卡找出時間、地點、參與者與原句'
  - 'visualize: 將來源、文化主張、範圍詞和推論分欄呈現'
  - 'predict: 預測句中哪個焦點詞最能修正過度概括'
  - 'manipulate: 把對比重音移到 some、practice 或 occasion'
  - 'observe: 比較重音改變後聽者注意到的是參與範圍、做法或場合'
  - 'explain: 引用來源句，說明為何 some 限定了主張而不抹去文化差異'
  - 'formalize: 練習 According to the card...、Some visitors...、At this event... 等有來源界線的表達'
  - 'transfer: 將範圍與證據策略移至博物館告示等不同文化情境'
  - 'exit-ticket: 寫一則可查證的介紹句，並標註它不能代表的範圍'
  visualizations:
  - 來源卡以英文原句與來源種類呈現；旁欄標記 Place、Occasion、People、Practice、Evidence、Boundary
  - 對比重音以文字粗體和 aria-label 同步標出焦點詞；不使用顏色作唯一提示
  - 初始預測、操作焦點、證據說明與新情境遷移分階段解鎖，正解不在預測前揭露
  interactiveBlocks:
  - id: CUR-ENGLISH-PERFORMANCE-2-IV-14-I01
    component: LanguageTimelineBlock
    purpose: 操作英文句子的對比焦點，觀察來源範圍詞如何避免把一項文化實例說成全民規則
    initialState:
      mode: predict
      showAnswer: false
      selectedEvidence: []
      variableValues:
        primary: 1
        secondary: 1
    studentActions:
    - 閱讀 harvest walk 活動卡後，先預測哪個詞能限制文化主張的參與者範圍
    - 提交預測後，以鍵盤或按鈕輪流將對比焦點移到 Some、residents 或 festival
    - 比較焦點改變後的文字提示，確認哪一項最直接回應「不是所有人都如此」的迷思
    - 用活動卡的措辭解釋答案，再在博物館規則的新句中找出地點界線
    visualRules:
    - 每次點選只改變句子的焦點標記，原句和來源卡保持不變，讓學生能比較注意焦點而非誤以為事實改寫
    - 正解揭露前保留學生預測；錯誤焦點仍顯示對應解讀，並提示回查活動卡
    - 焦點同時以粗體、按鈕文字及 aria-pressed 表示，不以顏色單獨承載意義
    - 來源原句、焦點控制、證據說明與遷移輸入在窄螢幕垂直排列，不裁切或依賴外部圖片
    misconceptionChecks:
    - id: MC-CUR-ENGLISH-PERFORMANCE-2-IV-14-I01
      trigger: 將 harvest walk 卡片中的 some residents 改寫成 everyone in the country
      prompt: 活動卡實際記錄的是哪些人、在哪一場活動做了什麼？請指出原句中的範圍詞。
      expectedEvidence: 指出卡片只記錄某場 harvest walk 的 some residents，不能推出全國每個人都做同一件事
    feedback:
      correct: 回指 some residents 及 harvest walk 兩個限制線索，請學生在博物館新告示中再次標記範圍。
      incorrect: 指出推論擴張發生在 people 或 occasion 哪一欄；先提示回讀 some 與活動名稱，不直接提供改寫句，重試後再顯示局部示範。
    languageTimeline:
      title: 焦點實驗室：讓文化主張停在證據範圍內
      context: 活動卡只記錄「At the neighborhood harvest walk, some residents fold paper leaves together each September.」草稿卻寫成「Everyone in the country makes paper leaves every year.」先預測哪個詞最能把參與範圍拉回活動卡的證據。
      sentence:
      - Some
      - residents
      - fold
      - paper
      - leaves
      - at
      - the
      - harvest
      - walk.
      prompt: 預測要承受對比重音的字，再操作不同詞，觀察聽者會注意到什麼。
      choices:
      - word: Some
        contrast: 強調 Some，聽者會注意「部分居民」而非所有人。
        evidence: 活動卡明寫 some residents，沒有說全國每個人都參加。
      - word: paper
        contrast: 強調 paper，聽者會注意裝飾材料。
        evidence: 活動卡寫 paper leaves，但材料無法證明參與者範圍。
      - word: harvest
        contrast: 強調 harvest，聽者會注意活動場合。
        evidence: harvest walk 能定位活動，卻不能把 some residents 推成 everyone。
      correctWord: Some
      transfer:
        prompt: 新資料寫著「At this museum, visitors speak softly in the archive room.」哪個字最直接把提醒限制在特定場館，而不是所有地方？
        acceptedWord: this
        evidenceHint: this 把主張綁定這一間博物館；仍應依該館告示確認規則，不推成每個場館都相同。
    guidedActivity:
      title: 六欄文化卡：把過度概括改成可追溯介紹
      introduction: 依序使用同一張虛構活動卡的不同欄位完成改寫，再把方法遷移到另一種公共文化空間。每一步答錯會先給線索，可修正重試。
      stages:
      - prompt: 活動卡寫著「At the neighborhood harvest walk, some residents fold paper leaves together each September.」哪個英文片語明確限定參與者？
        acceptedAnswers:
        - some residents
        - some of the residents
        correctFeedback: 對；some 把範圍限於卡片記錄的部分居民。
        hint: 找量詞，不要把 some 換成 everyone。
      - prompt: 這些居民是在什麼場合折紙葉？請輸入活動名稱。
        acceptedAnswers:
        - the neighborhood harvest walk
        - neighborhood harvest walk
        - harvest walk
        correctFeedback: 對；活動名稱界定 occasion，不能把單一活動擴成全年習慣。
        hint: 回讀 At the ... 開頭的場合詞組。
      - prompt: 來源能支持「所有國家的人每年都折紙葉」嗎？輸入能支持或不能支持。
        acceptedAnswers:
        - 不能支持
        - 不能
        - 'no'
        correctFeedback: 正確；卡片只有一個社區活動的有限紀錄。
        hint: 比較來源的 some residents 與主張的 everyone in the country。
      - prompt: 用英文寫出有範圍的短句；須包含 some residents 和 harvest walk。
        acceptedAnswers:
        - Some residents fold paper leaves at the harvest walk.
        - At the harvest walk, some residents fold paper leaves.
        correctFeedback: 這句同時保留活動、參與者範圍和來源所述實踐。
        hint: 保留 some；把 everyone in the country 刪掉，不要增加來源沒有的普遍規則。
      - prompt: 遷移卡只記錄「At this museum, visitors speak softly in the archive room.」哪個英文詞把提醒限定在特定場館？
        acceptedAnswers:
        - this
        - this museum
        correctFeedback: 完成；你把範圍策略遷移到新的場館資料，沒有把一館規則推成普遍文化。
        hint: 尋找直接指向這一處而非所有地方的限定詞。
      completionMessage: 六欄已完成：你保留了來源與場合、修正了人群範圍，並在新場館資料中再次標記界線。
