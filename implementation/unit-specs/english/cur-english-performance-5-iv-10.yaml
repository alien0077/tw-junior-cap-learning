  specVersion: '1.0'
  lessonId: cur-english-performance-5-iv-10
  knowledgeGraphIds:
  - kg-english-performance-5-iv-10
  title: 5-Ⅳ-10：故事短文主旨口頭或書面表達
  subject: english
  socialDiscipline: null
  curriculumLevel: learning-performance
  gradeRange:
  - '7'
  - '8'
  - '9'
  fusedScope:
    officialCurriculum: 5-Ⅳ-10：故事短文主旨口頭或書面表達
    curriculumIntent: 5-Ⅳ-10：故事短文主旨口頭或書面表達
    publisherEvidence:
      nani:
        status: book-level-only
        required: true
      kanghsuan:
        status: book-level-only
        required: true
      hanlin:
        status: book-level-only
        required: true
    fusionRule: 僅融合目前可核對的課綱、KG、校方章節定位及出版社公開資源頁教學方向；不得將課程計畫或資源介紹寫成已逐頁閱讀的課本正文
    currentEvidenceStatus: original-fusion-manuscript-written; nani-and-kanghsuan-public-course-plan-locator-only; hanlin-official-resource-page-read; user-chatgpt-review-pending
  learningGoals:
  - 從故事開頭線索、角色選擇及結尾回應形成涵蓋全文的主旨
  - 區分單一細節、全文主旨與超出文本的寓意，並以事件支持判斷
  - 依聽眾或讀者調整口說／短文長度，但維持與故事證據一致
  prerequisites:
  - 能讀懂本單元程度的簡短英文故事
  - 能指出人物行動及事件先後
  coreConcepts:
  - 單一情節細節不等於涵蓋全文的主旨
  - 角色前後選擇與結尾呼應可構成主旨證據鏈
  - 寓意式延伸必須受文本支持，不能加入絕對化外推
  misconceptions:
  - 把最醒目的一個情節直接當成故事主旨
  - 把個人認同的格言當成作者主旨
  - 只列故事細節，未說明它們如何共同支持概括
  contentFlow:
  - 'predict: 比較單一情節與能解釋角色前後變化的概括，先預測哪一種更可能涵蓋全文'
  - 'manipulate: 重新組合開頭線索、角色選擇與結尾呼應，調整主旨句的範圍及支持證據'
  - 'observe: 對照細節、全文主旨與寓意式說法，觀察哪些事件被概括涵蓋、哪些說法超出文本'
  - 'explain: 指出故事前後事件如何共同支持主旨，並說明為何醒目細節或個人格言不是充分證據'
  - 'transfer: 轉為口說介紹與讀書札記短文，按新受眾調整長度但保留全文證據'
  - 'exit-ticket: 說明證據、範圍及受眾調整'
  visualizations:
  - language-structure：以「5-Ⅳ-10：故事短文主旨口頭或書面表達」作為唯一主題，至少同步呈現兩種表徵
  - 每次變更都保留因果可追溯的標記、圖例與文字替代
  interactiveBlocks:
  - id: CUR-ENGLISH-PERFORMANCE-5-IV-10-I01
    component: GuidedChoiceBlock
    purpose: 從故事事件範圍、角色轉變和結尾線索判斷主旨，排除細節及無文本支持的寓意
    initialState:
      showAnswer: false
      selectedEvidence: []
    studentActions:
    - 閱讀原創短篇並選擇能涵蓋全文的概括
    - 依提示比較主旨範圍與故事證據
    - 選出支持概括的角色前後行動及結尾線索
    visualRules:
    - 題幹、選項、提示與解析均以文字呈現並可鍵盤操作
    - 顏色不可單獨承擔意義，必須搭配標籤、符號或文字
    - 窄螢幕不得裁切核心圖、題幹與回饋
    misconceptionChecks:
    - id: MC-CUR-ENGLISH-PERFORMANCE-5-IV-10-I01
      trigger: 把故事中一個醒目事件直接當成全文主旨
      prompt: 指出哪些事件共同支持你的概括，並說明為何單一細節不夠。
      expectedEvidence: 定位角色前後選擇或結尾呼應，說明其涵蓋全文的關係
    feedback:
      correct: 指出學生使用的證據，並要求用新情境再驗證一次。
      incorrect: 先指出錯誤位於概念、證據或操作哪一層；提供一階提示，不直接代答；重試後才顯示局部示範。
  teachingPatternRefs:
  - refId: phet-ild
    reuseDecision: inspiration-only
    application: "本課「5-Ⅳ-10：故事短文主旨口頭或書面表達」的 LanguageTimelineBlock 只吸收預測、操作、證據表達或可及性呈現方法；資料、文字、題目與視覺內容由本課自行設計。"
