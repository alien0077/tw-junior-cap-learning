  capTransfer:
    questionType: 資料判讀／概念應用／理由短答
    stemConstraint: 換一個情境但保留「5-Ⅳ-10：故事短文主旨口頭或書面表達」的核心關係；不可只換名詞
    requiredResponse: 選答後必須指出證據或推理步驟
    scoring: 概念正確 1、證據對應 1、表達完整 1
  exitTicket:
    prompt: 今天的核心關係是什麼？若改變一個條件，哪個結果會跟著變，為什麼？
    successCriteria:
    - 提到本單元核心概念
    - 指出條件與結果
    - 使用一項證據或表徵
  expressionExtension:
    applicable: true
    task: 用 80～120 字／英文短段落，將「5-Ⅳ-10：故事短文主旨口頭或書面表達」的證據、因果或觀察說給同學聽
    constraint: 學生先寫；系統只給一階回饋，不直接代寫完整答案
  mobileA11y:
    breakpoints:
    - 320
    - 375
    - 768
    touchTargetMinPx: 44
    keyboardAlternative: true
    screenReader: 每個控制項有名稱、目前值、操作結果與錯誤回饋
    reducedMotion: 停用自動動畫仍可逐步操作
  testCases:
  - 載入「5-Ⅳ-10：故事短文主旨口頭或書面表達」時不得先顯示正解；學生必須先提交對「5-Ⅳ-10：故事短文主旨口頭或書面表達」的預測，且預測會被保留供後續比較。
  - 操作「language-structure：以「5-Ⅳ-10：故事短文主旨口頭或書面表達」作為唯一主題，至少同步呈現兩種表徵」中的主要變項後，與「表徵／證據與結論的對應」相關的圖、表、句構或因果鏈必須同步更新，文字狀態也要說明改變了什麼。
  - 學生觸發「只背「5-Ⅳ-10：故事短文主旨口頭或書面表達」形式，未依語境、時間或句構判斷」時，系統必須命中本單元的 misconception check，要求學生指出可定位證據，並先給一階提示而非直接揭露答案。
  - 在 320px、375px 與 768px 寬度，以鍵盤完成「5-Ⅳ-10：故事短文主旨口頭或書面表達」的預測—操作—觀察—解釋流程時，核心題幹、控制項、回饋與可讀狀態不得溢位或遺失。
  - 以新資料執行「5-Ⅳ-10：故事短文主旨口頭或書面表達」的 CAP transfer：換一個情境但保留「5-Ⅳ-10：故事短文主旨口頭或書面表達」的核心關係；不可只換名詞；學生回答必須選答後必須指出證據或推理步驟，評分同時檢查概念、證據對應與表達完整度。
  - 外部資料失效時，學生頁仍須以本地短篇、文字選項、提示與解析完成全部四步，不得阻塞本課。
  - Fallback：刻意阻擋 simulations.js 後，四步故事主旨 GuidedChoice 仍須鍵盤作答、錯答重試並顯示正答解析；不可依賴模擬腳本或外部資料。
  definitionOfDone:
  - 課綱 ID、KG ID、標題與官方 locator 通過一致性檢查
  - 版本來源限制已在稿件及紀錄如實標註，不得把課程計畫或資源頁冒稱指定課本全文
  - 至少一個互動操作能回答本單元明確學習問題
  - 至少一個迷思被實際誘發、診斷並以分層回饋處理
  - 會考 transfer、exit ticket 與表達延伸（適用時）可執行
  - mobile、keyboard、screen reader、reduced-motion 與 fallback 測試通過
  - 本單元融合稿件紀錄存在、互動與學生頁一致；lesson 內容審查由使用者另以 ChatGPT 執行，不屬 Codex 本階段 gate
