<body>
  <main>
    <h1>互動契約 Workbench</h1>
    <p>此頁驗證共用 predict → manipulate → observe → explain → verify 互動殼層、鍵盤操作、文字 fallback 與 state serialization。</p>
    <label>選擇 unit：<select id="unit"></select></label>
    <p id="unit-status" aria-live="polite">載入 1,027 份 unit specs…</p>
    <div id="mount"></div>
  </main>
  <script type="module">
    import { renderStudentLesson } from "./runtime/student-lesson-shell.js?v=20260908-state-persistence-hash";
    const select = document.querySelector("#unit");
    const mount = document.querySelector("#mount");
    const status = document.querySelector("#unit-status");
    const bundle = await fetch("./unit-specs.bundle.json").then(response => response.json());
    for (const unit of bundle.units) {
      const option = document.createElement("option");
      option.value = unit.lessonId;
      option.textContent = `${unit.subject} · ${unit.lessonId} · ${unit.title}`;
      select.append(option);
    }
    function renderSelected() {
      mount.replaceChildren();
      const spec = bundle.units.find(unit => unit.lessonId === select.value);
      renderStudentLesson({ document, mount, spec, lesson: spec.authoredLesson || null });
      status.textContent = `已載入 ${bundle.units.length} 份 unit specs；目前 ${spec.lessonId}／${spec.interactiveBlocks[0].component}；狀態仍為 ${spec.status.implementationStatus}／${spec.status.qaStatus}`;
    }
    select.addEventListener("change", renderSelected);
    select.value = "cur-math-content-a-8-1";
    renderSelected();
  </script>
</body>
