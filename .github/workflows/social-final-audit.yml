name: social-final-audit
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pyyaml
      - name: Audit all social units
        run: python scripts/audit_social_final.py
      - name: Audit social question-unit fit
        run: python scripts/audit_social_unit_fit.py
