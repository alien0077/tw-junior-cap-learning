name: Math final review QA

on:
  push:
    branches: [main]
    paths:
      - scripts/finalize_math_review_tail.mjs
      - .github/workflows/math-final-review.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: Asia/Taipei

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install runtime test dependencies
        run: npm ci
      - name: Apply final math review repairs
        run: node scripts/finalize_math_review_tail.mjs
      - name: Run A-7-2 equation-meaning regression
        run: npm run test:math:a7-2
      - name: Run S-9-1 similarity regressions
        run: npm run test:math:s9-1
      - name: Run S-9-13 surface-volume regressions
        run: npm run test:math:s9-13
      - name: Run strengthened exhaustive math audit
        run: node scripts/audit_math_coverage.mjs > /tmp/math-exhaustive-audit-current.json
      - name: Save audit snapshot
        run: cp /tmp/math-exhaustive-audit-current.json implementation/reports/math-exhaustive-audit-current.json
      - name: Commit final math review state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lessons/math/lesson-math-content-s-9-1.json lessons/math/lesson-math-content-s-9-13.json implementation/reports/math-s-9-1-first-pass-review.json implementation/reports/math-s-9-13-first-pass-review.json implementation/runtime/math-a-7-2-scope-interaction.test.mjs scripts/audit_math_coverage.mjs implementation/reports/math-exhaustive-audit-current.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(math): complete final content and interaction review"
          git pull --rebase origin main
          git push origin HEAD:main
