name: Math exhaustive audit

on:
  push:
    branches: [main]
    paths:
      - 'lessons/math/**'
      - 'questions/math/**'
      - 'implementation/unit-specs/math/**'
      - 'implementation/reports/math-*'
      - 'implementation/runtime/**'
      - 'site/simulations.js'
      - 'site/math-visual-labs.js'
      - 'site/math-visual-labs.css'
      - 'site/math-gold-standard.js'
      - 'site/math-gold-standard.css'
      - 'site/math-number-family.js'
      - 'site/math-number-family.css'
      - 'site/math-algebra-family.js'
      - 'site/math-geometry-family.js'
      - 'site/math-geometry-family.css'
      - 'site/math-data-family.js'
      - 'site/math-data-family.css'
      - 'site/math-function-family.js'
      - 'site/math-function-family.css'
      - 'site/math-semantic-mount.js'
      - 'implementation/visual-contracts/math/**'
      - 'scripts/audit_math_coverage.mjs'
      - '.github/workflows/math-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit all math lessons, questions, specs, reports, and simulations
        run: node scripts/audit_math_coverage.mjs
