name: Apply vetted math review

on:
  push:
    branches: [main]
    paths:
      - 'implementation/reports/math-review-repairs-2026-10-01.json'
      - 'scripts/apply_math_review_manifest.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply reviewed repairs
        run: node scripts/apply_math_review_manifest.mjs implementation/reports/math-review-repairs-2026-10-01.json
      - name: Commit generated review changes
        run: |
          if git diff --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lessons/math questions/math implementation/reports
          git commit -m 'fix(math): apply vetted second-pass reviews [skip ci]'
          git push origin HEAD:main
