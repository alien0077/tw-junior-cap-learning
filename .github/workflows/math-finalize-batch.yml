name: Math scoped finalizer

on:
  push:
    branches: [main]
    paths:
      - scripts/finalize_math_a72.mjs
      - .github/workflows/math-finalize-batch.yml

permissions:
  contents: write

env:
  TZ: Asia/Taipei

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply scoped A-7-2 repairs
        run: node scripts/finalize_math_a72.mjs
      - name: Validate A-7-2 simulation contract
        run: |
          python3 - <<'PY'
          import json
          from scripts.simulation_contracts import contract_errors
          path = "lessons/math/lesson-math-content-a-7-2.json"
          lesson = json.load(open(path, encoding="utf-8"))
          errors = contract_errors(lesson)
          if errors:
              raise SystemExit("\n".join(errors))
          print("A-7-2 simulation contract PASS")
          PY
      - name: Run runtime tests
        run: node --test implementation/runtime/*.test.mjs
      - name: Run exhaustive math audit and persist snapshot
        id: audit
        continue-on-error: true
        run: |
          node scripts/audit_math_coverage.mjs > /tmp/math-exhaustive-audit-current.json
      - name: Save audit snapshot
        run: |
          cp /tmp/math-exhaustive-audit-current.json implementation/reports/math-exhaustive-audit-current.json
      - name: Commit repaired files and audit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lessons/math/lesson-math-content-a-7-2.json questions/math/question-math-content-a-7-2-*.json site/simulations.js scripts/simulation_contracts.py scripts/audit_math_coverage.mjs implementation/reports/math-exhaustive-audit-current.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(math): finalize A-7-2 content and interaction"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Enforce exhaustive audit
        if: steps.audit.outcome != 'success'
        run: |
          echo "Exhaustive math audit still has blockers; see implementation/reports/math-exhaustive-audit-current.json"
          exit 1
